<script>
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.append(e); return e; };
const I = gm.interpolate;

/* ---------- ambient sea ---------- */
const rays = document.getElementById('rays'); for (let i = 0; i < 5; i++) { const r = document.createElement('div'); r.className = 'ray'; r.style.left = (100 + i * 200) + 'px'; rays.append(r); }
const bubbles = document.getElementById('bubbles'), BB = [];
for (let i = 0; i < 22; i++) { const b = document.createElement('div'); b.className = 'bub'; const s = 10 + gm.random('bs' + i) * 30; b.style.width = b.style.height = s + 'px'; bubbles.append(b);
  BB.push({ b, x: gm.random('bx' + i) * 1080, sp: 80 + gm.random('bv' + i) * 140, ph: gm.random('bp' + i) * 2200 }); }
gm.onFrame(t => { [...rays.children].forEach((r, i) => r.style.transform = `rotate(${10 + Math.sin(t * .5 + i) * 6}deg)`);
  BB.forEach(o => o.b.style.transform = `translate(${o.x + Math.sin(t * 2 + o.ph) * 18}px, ${1980 - ((t * o.sp + o.ph) % 2200)}px)`); });

/* ---------- the octopus: arms are rebuilt every frame from a few state curves ---------- */
const armsG = document.getElementById('arms'), ARMS = [];
for (let i = 0; i < 8; i++) { const g = mk('g', {}, armsG); ARMS.push({ body: mk('path', { fill: 'url(#skin)' }, g), suck: mk('g', { fill: '#fde7c4' }, g), glow: mk('path', { fill: 'none', stroke: '#FFD23F', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': '18 14' }, g) }); }
const neurons = document.getElementById('neurons'), NEU = [];
for (let i = 0; i < 90; i++) NEU.push({ el: mk('circle', { r: 6, fill: '#FFD23F' }, neurons), arm: i % 8, s: .15 + gm.random('ns' + i) * .8, hx: (gm.random('nx' + i) - .5) * 200, hy: -60 - gm.random('ny' + i) * 220, ph: gm.random('np' + i) });
const state = t => ({
  stream: I(t, [14.6, 15.1, 18.0, 18.6], [0, 1, 1, 0]),                           // arms trail when jetting
  glow: Math.max(I(t, [3.5, 3.8, 5.1, 5.4], [0, 1, 1, 0]), I(t, [36.0, 36.4, 39.8, 40.0], [0, 1, 1, 0])),
  blue: I(t, [1.9, 2.3, 3.2, 3.6], [0, 1, 1, 0]),
  dark: I(t, [28.5, 28.9, 39.8, 40.1], [0, 1, 1, 0]),
  camo: I(t, [45.3, 46.2, 47.6, 48.0], [0, 1, 1, 0]),
  xray: Math.max(I(t, [0, .01, 1.8, 2.0], [1, 1, 1, 0]), I(t, [8.3, 8.6, 14.0, 14.3], [0, 1, 1, 0])),
  wave: 1 + I(t, [39.9, 40.2, 42.3], [0, 1.6, 1.6]),
  lift: I(t, [39.9, 40.4, 42.3], [0, 1, 1]),                                        // one arm acts alone
});
gm.onFrame(t => {
  const S = state(t);
  const skin0 = gm.color.mix(gm.color.mix(gm.color.mix('#FFC566', '#7fc4ff', S.blue), '#2a4f8f', S.dark), '#8f8a7e', S.camo);
  const skin1 = gm.color.mix(gm.color.mix(gm.color.mix('#F08A2E', '#2b74cf', S.blue), '#163a74', S.dark), '#5d6f8a', S.camo);
  document.getElementById('sk0').setAttribute('stop-color', skin0); document.getElementById('sk1').setAttribute('stop-color', skin1);
  document.getElementById('spots').setAttribute('opacity', .45 * (1 - S.dark) * (1 - S.camo));
  document.getElementById('papillae').setAttribute('opacity', S.camo);
  document.getElementById('xray').setAttribute('opacity', S.xray);
  const beat = k => 1 + .14 * Math.max(0, Math.sin((t * 1.6 + k * .33) * Math.PI * 2)) ** 6;
  [['hL', 0], ['hR', 1], ['hC', 2]].forEach(([id, k]) => document.querySelector(`#${id} use`).setAttribute('transform', `scale(${id === 'hC' && t > 17.3 && t < 19.4 ? 1 : beat(k)})`));
  ARMS.forEach((A, i) => {
    const N = 16, L = 380, bx = (i - 3.5) * 32, by = 8, a0 = (90 + (i - 3.5) * 21) * Math.PI / 180, side = i < 4 ? -1 : 1;
    let x = bx, y = by, a = a0; const P = [];
    for (let k = 0; k <= N; k++) { const s = k / N;
      let ang = a0 + side * 1.4 * s * s + Math.sin(t * 2.1 + i * .9 + s * 4) * .5 * s * S.wave;
      if (i === 6) ang -= S.lift * (2.4 * s);                                       // the "independent" arm reaches up
      ang = ang * (1 - S.stream) + (Math.PI / 2 + (i - 3.5) * .05) * S.stream;
      P.push([x, y, ang, 30 * (1 - s) + 5]); x += Math.cos(ang) * L / N; y += Math.sin(ang) * L / N; }
    const Lp = [], Rp = [];
    P.forEach(([px, py, an, w]) => { const nx = -Math.sin(an), ny = Math.cos(an); Lp.push(`${px + nx * w} ${py + ny * w}`); Rp.unshift(`${px - nx * w} ${py - ny * w}`); });
    A.body.setAttribute('d', `M${Lp.join(' L')} L${Rp.join(' L')}Z`);
    A.glow.setAttribute('d', 'M' + P.map(p => `${p[0]} ${p[1]}`).join(' L')); A.glow.setAttribute('opacity', S.glow); A.glow.setAttribute('stroke-dashoffset', -t * 120);
    while (A.suck.childNodes.length < 7) mk('circle', {}, A.suck);
    [...A.suck.childNodes].forEach((c, k) => { const p = P[3 + k * 2]; const nx = -Math.sin(p[2]) * side * .45 * p[3];
      c.setAttribute('cx', p[0] + nx); c.setAttribute('cy', p[1] - Math.cos(p[2]) * side * .45 * p[3] * -1); c.setAttribute('r', Math.max(3, p[3] * .32)); });
    A.P = P;
  });
  // neurons: head first, then most of them flow into the arms
  const flow = I(t, [36.0, 38.6], [0, 1], { easing: 'in-out-cubic' }), nOn = I(t, [33.2, 35.4, 39.8, 40.0], [0, 1, 1, 0]);
  NEU.forEach((n, k) => { const toArm = k % 3 !== 0, p = ARMS[n.arm].P[Math.round(n.s * 16)];
    const x = toArm ? n.hx * (1 - flow) + p[0] * flow : n.hx * .6, y = toArm ? n.hy * (1 - flow) + p[1] * flow : n.hy;
    n.el.setAttribute('cx', x); n.el.setAttribute('cy', y); n.el.setAttribute('opacity', nOn * (k / NEU.length < (t - 33.2) / 2 ? 1 : 0) * (.6 + .4 * Math.sin(t * 6 + n.ph * 6))); });
});

/* ---------- title slot: one headline per beat (change every 2–4 s) ---------- */
const TITLES = [[0, '3 <em>CORAZONES</em>'], [1.9, '<em>SANGRE AZUL</em>'], [3.5, 'PIENSA CON<br>LOS <em>BRAZOS</em>'], [5.3, 'EL <em>PULPO</em>'],
  [8.4, '2 PARA LAS<br><em>BRANQUIAS</em>'], [11.0, '+1 PARA<br><em>TODO EL CUERPO</em>'], [14.4, 'LO <em>CURIOSO</em>…'], [16.9, '¡SE PARA<br>AL <em>NADAR</em>!'],
  [19.2, 'POR ESO<br><em>SE ARRASTRA</em>'], [21.8, 'SANGRE <em>AZUL</em>'], [24.4, '<em>COBRE</em>,<br>NO HIERRO'], [28.8, 'SU <em>CEREBRO</em>…'], [31.8, 'SUS <em>CEREBROS</em>'],
  [33.1, '<em>NEURONAS</em>'], [35.6, 'LA MAYORÍA,<br>EN LOS <em>BRAZOS</em>'], [40.0, 'CADA BRAZO<br><em>DECIDE</em>'], [42.4, 'SABOREA<br><em>AL TOCAR</em>'], [45.2, '<em>CAMUFLAJE</em>'],
  [47.6, 'SE CUELA POR<br><em>CUALQUIER HUECO</em>'], [50.2, 'SOLO EL <em>PICO</em><br>ES DURO'], [53.1, '¿CUÁL<br><em>ELEGIRÍAS</em>?']];
const tt = gm.timeline(null, { global: true }), titles = document.getElementById('titles');
TITLES.forEach(([at, html], i) => { const h = document.createElement('h2'); h.className = 'hl'; h.innerHTML = html; titles.append(h);
  const end = i < TITLES.length - 1 ? TITLES[i + 1][0] : 99;
  if (at > 0) tt.fromTo(h, { opacity: 0, y: 110, scale: 1.25, filter: 'blur(12px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: .35, ease: 'expo.out' }, at);
  tt
    .to(h, { opacity: 0, y: -110, filter: 'blur(8px)', duration: .2, ease: 'power2.in' }, end - .2); });
titles.firstChild.style.opacity = 1; tt.fromTo(titles.firstChild, { scale: 1.12 }, { scale: 1, duration: .5, ease: 'expo.out' }, 0);

/* ---------- octopus framing per beat (camera on the character) ---------- */
const cam = gm.timeline(null, { global: true });
const go = (at, d, o, ease = 'power3.inOut') => cam.to('#octo', { duration: d, ease, ...o }, at);
cam.set('#octo', { x: 0, y: 40, scale: 1.12 }, 0);
cam.fromTo('#octo', { scale: 1.25 }, { scale: 1.12, duration: 1.2, ease: 'expo.out' }, 0);
go(5.2, .6, { y: 60, scale: .95 }); cam.to('#rock', { opacity: 1, duration: .4 }, 5.2).to('#rock', { opacity: 0, duration: .3 }, 8.2);
cam.to('#lidR', { attr: { transform: 'scale(1 1)' }, duration: .12, yoyo: true, repeat: 1 }, 6.9);
go(8.3, .5, { y: 260, scale: 1.55 }, 'expo.out');                                       // x-ray zoom
cam.to('#flowArrows', { opacity: 1, duration: .3 }, 11.0).from('#flowArrows path', { draw: 0, duration: .8, stagger: .15 }, 11.0);
go(11.0, 1.2, { y: 330, scale: 1.9 });
go(14.3, .35, { x: -260, y: 260, scale: .7 }, 'expo.out');                                // start jet
go(14.9, 3.2, { x: 220, y: -160, scale: .7 }, 'power2.in');                               // jets up
go(18.4, .4, { x: -250, y: 330, scale: .55 }, 'expo.out');                                // lands on the seabed
go(19.0, 2.6, { x: 260, y: 330, scale: .55 }, 'sine.inOut');                               // crawls
cam.to('#world', { opacity: 0, duration: .2 }, 21.55).to('#world', { opacity: 1, duration: .25 }, 28.7);
go(28.6, .01, { x: 0, y: 80, scale: 1.0 });
cam.to('#brain', { opacity: 1, duration: .3 }, 29.3).to('#brain', { opacity: 0, duration: .3 }, 33.0);
cam.fromTo('#brain', { scale: .6 }, { scale: 1.3, duration: .4, ease: 'back.out(2)', transformOrigin: '0px -200px' }, 30.2);
go(33.0, .5, { y: 60, scale: 1.0 }, 'expo.out');
go(39.9, .5, { x: -180, y: 60, scale: .95 }, 'expo.out');
cam.to(['#pupL', '#pupR'], { x: -12, duration: .2 }, 40.0).to(['#pupL', '#pupR'], { x: 0, duration: .2 }, 45.2);
cam.to('#world', { opacity: 0, duration: .15 }, 42.3).to('#world', { opacity: 1, duration: .2 }, 45.1);
go(45.1, .01, { x: 0, y: 40, scale: .85 }); cam.to('#rock', { opacity: 1, duration: .3 }, 45.1).to('#rock', { opacity: 0, duration: .3 }, 47.5);
go(47.6, .5, { x: -200, y: 0, scale: .6 }, 'expo.out'); cam.to('#tube', { opacity: 1, duration: .3 }, 47.6);
go(48.4, 1.6, { x: 260, y: -80, scale: .6, scaleX: .22 }, 'power2.in');                  // squeezes into the tube
go(50.1, .4, { x: 60, y: 60, scale: 1.4, scaleX: 1.4 }, 'expo.out'); cam.to('#tube', { opacity: 0, duration: .25 }, 50.1);
cam.to('#beak', { attr: { 'stroke-width': 8 }, duration: .25 }, 50.3).to('#beak', { scale: 1.6, duration: .3, yoyo: true, repeat: 3, transformOrigin: '0px 40px' }, 50.4)
   .to('#beak', { attr: { 'stroke-width': 0 }, scale: 1, duration: .2 }, 52.9);
cam.to('#world', { opacity: 0, duration: .3 }, 53.0);

gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const W = (txt, n = 1) => { let c = 0; for (const w of words) if (norm(w.word) === norm(txt) && ++c === n) return w.start; throw new Error('word ' + txt); };
  const G = { global: true };
  /* ECG: beating, flat while it swims, back while it crawls */
  const flat0 = W('latir') - .1, flat1 = W('por') + .2, ecg = document.getElementById('ecgLine');
  gm.onFrame('#ecg', (l, info) => { const t = info.time, pts = [];
    for (let x = 0; x <= 600; x += 6) { const tx = t - (600 - x) / 300; const ph = (tx * 1.4) % 1; const flat = tx > flat0 && tx < flat1;
      const y = flat ? 0 : (ph < .05 ? -60 * Math.sin(ph / .05 * Math.PI) : ph < .1 ? 30 * Math.sin((ph - .05) / .05 * Math.PI) : 0); pts.push(`${x} ${75 + y}`); }
    ecg.setAttribute('d', 'M' + pts.join(' L')); ecg.setAttribute('stroke', t > flat0 && t < flat1 ? '#E5484D' : '#3fe08a'); });
  gm.timeline('#ecg', G).from('#ecg svg', { y: -60, opacity: 0, duration: .35, ease: 'expo.out' }, 14.3).to('#ecg svg', { opacity: 0, duration: .2 }, 21.5)
    .set('#bpm', { textContent: '¡SE PARA!' }, flat0).set('#bpm', { textContent: 'CORAZÓN' }, flat1);
  /* blood vessel → molecules */
  const cells = document.getElementById('cells'), CE = [];
  for (let i = 0; i < 18; i++) CE.push({ el: mk('ellipse', { rx: 40, ry: 26, fill: '#4FA3F7', stroke: '#9fd0ff', 'stroke-width': 4 }, cells), y: 760 + gm.random('cy' + i) * 360, ph: gm.random('cp' + i) * 1300, sp: 300 + gm.random('cs' + i) * 200 });
  gm.onFrame('#vessel', (l, info) => CE.forEach(c => { c.el.setAttribute('cx', ((info.time * c.sp + c.ph) % 1300) - 110); c.el.setAttribute('cy', c.y + Math.sin(info.time * 3 + c.ph) * 10); }));
  gm.timeline('#vessel', G).from('#vesselG', { scale: 2.4, opacity: 0, duration: .5, ease: 'expo.out', transformOrigin: '540px 940px' }, 21.6)
    .to('#vesselG', { opacity: 0, scale: .6, duration: .3, transformOrigin: '540px 940px' }, W('cobre') - .4).to('#mol', { opacity: 1, duration: .2 }, W('cobre') - .3)
    .from('#molCu', { scale: 0, rotate: -40, duration: .45, ease: 'back.out(1.8)' }, W('cobre') - .3).from('#molFe', { scale: 0, duration: .4, ease: 'back.out(1.8)' }, W('hierro') - .3)
    .from('#feX', { draw: 0, duration: .25 }, W('hierro') + .1).to('#molFe', { opacity: .35, duration: .4 }, W('hierro') + .4)
    .to('#molCu', { rotate: 30, duration: 2.5, ease: 'sine.inOut' }, W('hierro') + .2).from('#hemo', { y: 30, opacity: 0, duration: .35 }, W('hemocianina') - .3);
  /* counter 500.000.000 */
  const n5 = document.getElementById('n500'), c0 = W('quinientos') - .3;
  gm.onFrame('#cnt', (l, info) => { const v = Math.round(500000000 * gm.ease.outCubic(gm.clamp((info.time - c0) / 1.3))); n5.textContent = String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); });
  gm.timeline('#cnt', G).from('#n500', { scale: 1.4, opacity: 0, filter: 'blur(12px)', duration: .4, ease: 'expo.out' }, c0).to(['#n500', '#cnt .sub'], { opacity: 0, y: -60, duration: .2 }, 36.1)
    .from('#cnt .sub', { opacity: 0, y: 30, duration: .3 }, W('neuronas') - .2);
  /* taste macro: suckers glow on contact */
  const su = document.getElementById('suckers'), path = document.querySelector('#bigArm path'), PL = path.getTotalLength();
  for (let k = 0; k < 9; k++) { const p = path.getPointAtLength(PL * (.12 + k * .1)); mk('circle', { cx: p.x - 30, cy: p.y + 40, r: 26 - k * 1.5 }, su); }
  const touch = W('toca') - .3, wv = document.getElementById('waves');
  for (let k = 0; k < 3; k++) mk('circle', { cx: 790, cy: 1110, r: 40 }, wv);
  gm.timeline('#taste', G).from('#bigArm path', { draw: 0, duration: .7, ease: 'power3.out' }, 42.4).from('#suckers circle', { scale: 0, duration: .25, stagger: .04, transformOrigin: '50% 50%' }, 42.6)
    .from('#crab', { x: 200, duration: .5, ease: 'back.out(1.5)' }, 42.5)
    .to('#suckers circle', { fill: '#FFD23F', duration: .15, stagger: { each: .05, from: 'end' } }, touch)
    .fromTo('#waves circle', { attr: { r: 40 }, opacity: 1 }, { attr: { r: 200 }, opacity: 0, duration: .9, stagger: .25 }, touch)
    .to('#crab', { rotate: 10, duration: .1, yoyo: true, repeat: 5 }, touch);
  /* end cards */
  const cards = document.getElementById('cards');
  [['3 CORAZONES', '#E5484D'], ['CAMUFLAJE', '#8f8a7e'], ['BRAZOS QUE PIENSAN', '#FFD23F'], ['ESCAPISTA', '#4FA3F7']].forEach(([lab, col], i) => {
    const g = mk('g', { transform: `translate(${300 + (i % 2) * 480} ${640 + Math.floor(i / 2) * 290})` }, cards), c = mk('g', { class: 'cd' }, g);
    mk('rect', { x: -210, y: -120, width: 420, height: 240, rx: 30, fill: '#0f3e86', stroke: col, 'stroke-width': 8 }, c);
    if (i === 0) [-60, 0, 60].forEach(x => mk('use', { href: '#heart', transform: `translate(${x} -30) scale(1.3)`, fill: '#E5484D' }, c));
    if (i === 1) [[-60, -40], [0, -20], [60, -45], [-30, 0], [40, 5]].forEach(([x, y]) => mk('circle', { cx: x, cy: y, r: 22, fill: '#8f8a7e' }, c));
    if (i === 2) { mk('path', { d: 'M-90 0 Q-30 -60 30 -20 T120 -30', stroke: '#FFB547', 'stroke-width': 30, fill: 'none', 'stroke-linecap': 'round' }, c); mk('circle', { cx: 0, cy: -40, r: 22, fill: '#FFD23F' }, c); }
    if (i === 3) { mk('rect', { x: -40, y: -70, width: 140, height: 60, rx: 12, fill: '#2b74cf' }, c); mk('ellipse', { cx: -70, cy: -40, rx: 40, ry: 28, fill: '#FFB547' }, c); }
    const tx = mk('text', { y: 85, 'font-size': 52, fill: '#fff' }, c); tx.textContent = lab; });
  gm.timeline('#end', G).from('#cards .cd', { scale: 0, opacity: 0, duration: .45, ease: 'back.out(1.8)', stagger: .15, transformOrigin: '50% 50%' }, W('poderes') - .4)
    .to('#cards .cd', { scale: 1.06, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 5, stagger: .2, transformOrigin: '50% 50%' }, W('elegirías'))
    .from('#brand', { y: 40, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('te') - .1);

  /* captions */
  const ws = words.map(w => ({ text: w.word, start: w.start, end: w.end }));
  const phrases = [[]];
  ws.forEach((w, i) => { const cur = phrases.at(-1), prev = ws[i - 1];
    if (cur.length && (cur.length === 3 || cur.map(x => x.text).join(' ').length + w.text.length > 16 || w.start - prev.end > .28 || /[.!?,:…]$/.test(prev.text) || /^¿/.test(w.text))) phrases.push([]);
    phrases.at(-1).push(w); });
  const tl = gm.timeline(null, G);
  const caps = phrases.map(ph => { const el = document.createElement('div'); el.className = 'cap';
    el.innerHTML = '<i class="pill"></i>' + ph.map(w => `<span class="w">${w.text}</span>`).join(' '); document.getElementById('caps').append(el); return el; });
  return document.fonts.ready.then(() => phrases.forEach((ph, p) => {
    const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
    const box = i => ({ x: spans[i].offsetLeft, width: spans[i].offsetWidth });
    tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .18, ease: 'back.out(2)' }, ph[0].start - .04);
    ph.forEach((w, i) => {
      tl.fromTo(spans[i], { opacity: 0, y: 40, scale: .6 }, { opacity: 1, y: 0, scale: 1, duration: .24, ease: 'back.out(2.4)' }, w.start - .06);
      if (i) tl.to(pill, { ...box(i), duration: .1, ease: 'power3.out' }, w.start - .08);
      tl.to(spans[i], { '--hl': 1, scale: 1.08, duration: .05 }, w.start - .03)
        .to(spans[i], { '--hl': 0, scale: 1, duration: .05 }, ph[i + 1] ? ph[i + 1].start - .08 : Math.min(w.end + .3, next ? next[0].start - .2 : 99));
    });
    if (!next) tl.to(el, { opacity: 0, duration: .25 }, ph.at(-1).end + .7);
    else tl.to(el, { y: -50, opacity: 0, duration: .16, ease: 'power2.in' }, next[0].start - .18);
  }));
}));
</script>
</body>
