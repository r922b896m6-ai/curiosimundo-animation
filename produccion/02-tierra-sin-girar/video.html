<!doctype html>
<!--
  CURIOSIMUNDO · 02 · ¿Y si la Tierra dejara de girar?  (9:16, 32 s)
  Reglas de retención: dato con número en pantalla desde el fotograma 0, cambio visual cada 2–4 s, subtítulos grandes
  palabra a palabra en zona segura, pregunta directa al final.
  LOOK: motion graphics planos. Paleta de marca: azul profundo #0B2A5B → #1565C0, blanco, amarillo #FFD23F
  (tierra verde/marrón solo en el planeta). Bebas Neue para titulares, Inter 850 para subtítulos.

  BEATS (tiempo de vídeo):
  0.0  b1  Tierra girando + "+1.600 KM/H" ya en pantalla; en "girar" frena en seco (sacudida).
  2.5  b2  Ciudad en el ecuador: persona, coche y autobús salen volando hacia el este con líneas de velocidad.
  6.1  b3  Cortes rápidos: "TÚ" / "LOS COCHES" / "LOS EDIFICIOS" / "TODO → ESTE".
  10.5 b4  Ola gigante que barre un pueblo costero.
  12.9 b5  Tierra desde el espacio: el agua fluye a los polos.
  15.6 b6  Aparece el megacontinente ecuatorial.
  18.8 b7  "1 DÍA = 1 AÑO": calendario que pasa 12 meses en un día.
  20.8 b8  Tierra mitad día abrasador / mitad noche helada: "6 MESES ☀ · 6 MESES ☾".
  23.7 b9  "TRANQUILO": la Tierra vuelve a girar; "prácticamente imposible".
  26.4 b10 Niño en la línea día/noche con "?": "¿QUÉ HARÍAS TÚ?" + CURIOSIMUNDO.
-->

  .art { position:absolute; left:0; width:1080px; }
  #speed { position:absolute; left:0; right:0; top:250px; z-index:4; text-align:center; font: 400 210px/1 var(--head); color: var(--accent); text-shadow: 0 12px 40px rgb(0 10 40 / .6); }

  #series { position:absolute; left:0; right:0; top:470px; z-index:4; text-align:center; font: 800 44px/1.1 var(--font); letter-spacing:.04em; color:#fff; text-shadow: 0 4px 20px rgb(0 10 40 / .8); }

</style>

<script>
const NS = 'http://www.w3.org/2000/svg';
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.append(e); return e; };
/* stars that drift */
const stars = document.getElementById('stars'), ST = [];
for (let i = 0; i < 60; i++) { const s = document.createElement('div'); s.className = 'star'; let y = gm.random('sy' + i) * 1920; if (y > 1230 && y < 1420) y -= 300;
  s.style.left = gm.random('sx' + i) * 1080 + 'px'; s.style.top = y + 'px'; stars.append(s); ST.push({ s, ph: gm.random('sp' + i) * 6 }); }
gm.onFrame(t => ST.forEach(o => o.s.style.opacity = .25 + .35 * (1 + Math.sin(t * 2 + o.ph)) / 2));

const enter = (tl, sel, at, o = {}) => tl.from(sel, { y: 140, opacity: 0, scale: .8, filter: 'blur(12px)', duration: .4, ease: 'expo.out', stagger: .06, ...o }, at);
const swapIn = (tl, sel, at) => tl.from(sel, { y: 100, scale: 1.4, opacity: 0, filter: 'blur(12px)', duration: .35, ease: 'expo.out', stagger: .08 }, at);
const out = (tl, sel, at, d = .22) => tl.to(sel, { y: -140, opacity: 0, filter: 'blur(8px)', duration: d, ease: 'power2.in' }, at);
const shakes = [];
gm.onFrame(t => { let x = 0, y = 0; shakes.forEach(([t0, a, len]) => { const d = t - t0; if (d >= 0 && d < len) { const k = (1 - d / len) * a; x += (gm.noise(t * 45) - .5) * 2 * k; y += (gm.noise(t * 45 + 7) - .5) * 2 * k; } });
  document.body.style.translate = `${x}px ${y}px`; });

gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const W = (txt, n = 1) => { let c = 0; for (const w of words) if (norm(w.word) === norm(txt) && ++c === n) return w.start; throw new Error('word ' + txt); };
  const G = { global: true };

  /* hook number: on screen at frame 0, punches on "girar", steps up, leaves at b3 */
  const h = gm.timeline(null, G);
  h.fromTo('#speed', { scale: 1.15 }, { scale: 1, duration: .5, ease: 'expo.out' }, 0)
   .fromTo('#series', { y: 20, opacity: .0 }, { y: 0, opacity: 1, duration: .35, ease: 'expo.out' }, .05)
   .to('#speed', { scale: 1.12, duration: .12, ease: 'power2.out', yoyo: true, repeat: 1 }, W('girar'))
   .to('#series', { opacity: 0, y: -20, duration: .25 }, 2.4)
   .to('#speed', { scale: .62, y: -40, duration: .35, ease: 'power3.inOut' }, 2.5)
   .to('#speed', { scale: .9, duration: .25, ease: 'back.out(3)' }, W('mil') - .1).to('#speed', { scale: .62, duration: .3 }, W('kilómetros') + .2)
   .to('#speed', { opacity: 0, y: -160, duration: .22, ease: 'power2.in' }, 6.0);

  /* b1 spin then stop */
  const stopT = W('girar') + .1;
  gm.onFrame('#b1', (l, info) => { const t = info.time; const p = t < stopT ? t * 520 : stopT * 520 + 60 * (1 - Math.exp(-(t - stopT) * 9));
    document.getElementById('strip1').setAttribute('transform', `translate(${-(p % 1200)} 0)`); });
  gm.timeline('#b1', G).from('#arrow1', { draw: 0, duration: .5, ease: 'power2.out' }, 0).to('#arrow1, #ahead1', { opacity: 0, duration: .15 }, stopT)
    .to('#stopmarks', { opacity: 1, duration: .05 }, stopT).to('#stopmarks', { opacity: 0, duration: .3 }, stopT + .4)
    .to('#b1 .art', { scale: .5, opacity: 0, duration: .25, ease: 'power2.in' }, 2.4);
  shakes.push([stopT, 26, .55]);

  /* b2 things fly east */
  const t2 = gm.timeline('#b2', G), f0 = W('saldrías') - .05;
  t2.from('#b2 .art', { opacity: 0, duration: .15 }, 2.5);
  [['#fPerson', 300, 560, 1.0], ['#fCar', 520, 620, 1.3], ['#fBus', 760, 640, 1.6]].forEach(([id, x, y, d], i) => {
    t2.fromTo(id, { x, y, rotate: 0 }, { x: x + 1300, y: y - 260 - i * 60, rotate: 40 + i * 25, duration: d + .8, ease: 'power2.in' }, f0 + i * .25); });
  const lines = document.getElementById('lines');
  for (let i = 0; i < 9; i++) mk('path', { d: `M${100 + i * 90} ${220 + (i * 53) % 400} h${120 + (i % 3) * 60}` }, lines);
  t2.from('#lines path', { draw: 0, opacity: 0, duration: .25, stagger: .05 }, f0).to('#lines', { x: 400, opacity: 0, duration: 1.2, ease: 'power2.in' }, f0 + .4);
  shakes.push([f0, 14, .5]);
  t2.to('#b2 .art', { opacity: 0, duration: .15 }, 6.1);

  /* b3 quick cuts */
  const t3 = gm.timeline('#b3', G), qlines = document.getElementById('qlines');
  for (let i = 0; i < 8; i++) mk('path', { d: `M${60 + (i % 4) * 60} ${180 + i * 70} h-${160 + (i % 3) * 80}` }, qlines);
  gm.onFrame('#b3', (l, info) => { qlines.setAttribute('transform', `translate(${(info.time * 900) % 300} 0)`); });
  const cuts = [['#c1', '#q1', W('tú') - .15], ['#c2', '#q2', W('coches') - .2], ['#c3', '#q3', W('edificios') - .2], ['#c4', '#q4', W('todo') - .15]];
  cuts.forEach(([hl, art, at], i) => { const end = i < 3 ? cuts[i + 1][2] : 10.45;
    t3.fromTo(hl, { opacity: 0 }, { opacity: 1, duration: .01 }, at).fromTo(art, { opacity: 0 }, { opacity: 1, duration: .01 }, at)
      .from(`${hl} .w`, { scale: 1.5, filter: 'blur(10px)', duration: .25, ease: 'expo.out' }, at)
      .fromTo(`${art} .m`, { x: -160, rotate: -8 }, { x: 160, rotate: 10, duration: end - at, ease: 'none' }, at)
      .to([hl, art], { opacity: 0, duration: .01 }, end); });
  t3.to('#q4 .m', { x: 0, rotate: 0, duration: .01 }, W('todo') - .14);

  /* b4 wave */
  const t4 = gm.timeline('#b4', G);
  enter(t4, '#b4 .hl .w', 10.55);
  t4.fromTo('#wave', { x: -200 }, { x: 1500, duration: 2.3, ease: 'power1.in' }, 10.5)
    .to('#houses use', { y: -60, rotate: 30, opacity: 0, duration: .5, stagger: .25, ease: 'power2.in', transformOrigin: '50% 100%' }, 11.3);
  shakes.push([W('arrasarían'), 12, .6]);
  out(t4, '#b4 .hl', 12.8);

  /* b5/b6 globe */
  const t5 = gm.timeline('#b5', G);
  enter(t5, '#t5a .w', 12.95);
  t5.from('#b5 .art', { scale: .6, opacity: 0, duration: .5, ease: 'expo.out' }, 12.9)
    .fromTo(['#capN', '#capS'], { scaleY: .25 }, { scaleY: 1, duration: 2.4, ease: 'power2.inOut', transformOrigin: '50% 50%' }, W('polos') - .9)
    .from('#flow path', { draw: 0, duration: .6, stagger: .08 }, W('agua') - .1).to('#flow', { opacity: 0, duration: .3 }, W('continente'))
    .from('#belt', { scaleY: 0, duration: .9, ease: 'expo.out', transformOrigin: '50% 50%' }, W('continente') - .3).from('#beltEdge', { opacity: 0, duration: .4 }, W('continente'))
    .from('#eqLab', { opacity: 0, scale: .6, duration: .3, ease: 'back.out(2)' }, W('ecuador') - .2)
    .to('#b5 .art', { scale: 1.12, duration: 2.6, ease: 'sine.inOut' }, W('continente') - .3);
  gm.onFrame('#b5', (l, info) => document.getElementById('strip5').setAttribute('transform', `translate(${-((info.time - 12.9) * 30 % 1200)} 0)`));
  out(t5, '#t5a', W('continente') - .45); swapIn(t5, '#t5b .w', W('continente') - .25);
  out(t5, ['#t5b', '#b5 .art'], 18.7);

  /* b7 calendar → b8 day/night */
  const t7 = gm.timeline('#b7', G);
  enter(t7, '#t7a .w', 18.85);
  t7.from('#cal', { y: 200, opacity: 0, duration: .4, ease: 'expo.out' }, 18.8);
  const months = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
  months.forEach((m, i) => t7.set('#month', { textContent: m }, W('año') - .1 + i * .07));
  out(t7, ['#t7a', '#cal'], W('seis') - .3);
  swapIn(t7, '#t7b .w', W('seis') - .1);
  t7.from('#dn', { scale: .6, opacity: 0, duration: .45, ease: 'expo.out' }, W('seis') - .2).to('#dn', { scale: 1.08, duration: 2.2, ease: 'sine.inOut' }, W('seis') + .3);
  out(t7, ['#t7b', '#dn'], 23.6);

  /* b9 relax */
  const t9 = gm.timeline('#b9', G);
  enter(t9, '#b9 .hl .w', 23.75);
  t9.from('#b9 .art', { scale: .6, opacity: 0, duration: .4, ease: 'expo.out' }, 23.7).from('#ok', { scale: 0, duration: .35, ease: 'back.out(2.5)' }, W('imposible') - .2)
    .from('#b9 .sub', { y: 30, opacity: 0, duration: .3 }, W('prácticamente') - .2);
  gm.onFrame('#b9', (l, info) => document.getElementById('strip9').setAttribute('transform', `translate(${-((info.time * 300) % 1200)} 0)`));
  out(t9, ['#b9 .hl', '#b9 .sub', '#b9 .art'], 26.3);

  /* b10 question */
  const t10 = gm.timeline('#b10', G);
  enter(t10, '#b10 .hl .w', 26.45, { stagger: .1 });
  t10.from('#b10 .art', { opacity: 0, duration: .35 }, 26.4).from('#kid .m', { y: 300, duration: .5, ease: 'back.out(1.4)' }, 26.5)
    .from('#qm', { scale: 0, rotate: -30, duration: .45, ease: 'back.out(2.5)', transformOrigin: '50% 80%' }, W('qué') - .1)
    .to('#qm', { rotate: 10, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 5, transformOrigin: '50% 80%' }, W('qué') + .4)
    .to('#b10 .hl em', { scale: 1.2, duration: .25, ease: 'back.out(3)', transformOrigin: '50% 60%' }, W('tú', 2) - .05)
    .from('#brand', { y: 40, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('te') - .1);

  /* captions */
  const ws = words.map(w => ({ text: w.word, start: w.start, end: w.end }));
  const phrases = [[]];
  ws.forEach((w, i) => { const cur = phrases.at(-1), prev = ws[i - 1];
    if (cur.length && (cur.length === 3 || cur.map(x => x.text).join(' ').length + w.text.length > 16 || w.start - prev.end > .28 || /[.!?,:…]$/.test(prev.text) || /^¿/.test(w.text))) phrases.push([]);
    phrases.at(-1).push(w); });
  const tl = gm.timeline(null, G);
  const caps = phrases.map(ph => { const el = document.createElement('div'); el.className = 'cap';
    el.innerHTML = '<i class="pill"></i>' + ph.map(w => `<span class="w">${w.text}</span>`).join(' '); document.getElementById('caps').append(el); return el; });
  return document.fonts.ready.then(() => phrases.forEach((ph, p) => {
    const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
    const box = i => ({ x: spans[i].offsetLeft, width: spans[i].offsetWidth });
    tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .18, ease: 'back.out(2)' }, ph[0].start - .04);
    ph.forEach((w, i) => {
      tl.fromTo(spans[i], { opacity: 0, y: 40, scale: .6 }, { opacity: 1, y: 0, scale: 1, duration: .24, ease: 'back.out(2.4)' }, w.start - .06);
      if (i) tl.to(pill, { ...box(i), duration: .1, ease: 'power3.out' }, w.start - .08);
      tl.to(spans[i], { '--hl': 1, scale: 1.08, duration: .05 }, w.start - .03)
        .to(spans[i], { '--hl': 0, scale: 1, duration: .05 }, ph[i + 1] ? ph[i + 1].start - .08 : Math.min(w.end + .3, next ? next[0].start - .2 : 99));
    });
    if (!next) tl.to(el, { opacity: 0, duration: .25 }, ph.at(-1).end + .7);
    else tl.to(el, { y: -50, opacity: 0, duration: .16, ease: 'power2.in' }, next[0].start - .18);
  }));
}));
</script>
</body>
</html>
