<!doctype html>
<!--
  CURIOSIMUNDO · Serie "El soldado en Tenochtitlan" · Parte 1 de 5 (9:16, serie "¿Y si…?").
  Sección 1 · Sobrevivir: llega sin hablar náhuatl, aprende el idioma, ayuda en 1428 (guerra tepaneca, real) y descubre que no vivirá hasta 1519.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="29.2" data-safe-zone="reels">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="common.js"></script>
<style>
  body { background: radial-gradient(1200px 1400px at 50% 40%, #1565C0, #0B2A5B 75%); }
  #band { position:absolute; left:0; top:560px; width:1920px; height:1080px; transform: scale(.5625); transform-origin: 0 0; overflow:hidden; z-index:2; }
  #frame { position:absolute; left:0; top:556px; width:1080px; height:616px; border-top:4px solid #FFD23F; border-bottom:4px solid #FFD23F; z-index:3; pointer-events:none; }
  .ttl { position:absolute; left:40px; right:40px; top:250px; height:290px; display:flex; align-items:center; justify-content:center; text-align:center; z-index:5;
         font: 400 118px/.92 'Bebas Neue'; text-shadow: 0 10px 40px rgb(0 0 0 / .6); opacity:0; }
  .ttl em { font-style:normal; color:#FFD23F; }
  #vcaps { position:absolute; inset:0; z-index:8; pointer-events:none; }
  .vc { position:absolute; left:50px; right:50px; top:1240px; text-align:center; isolation:isolate; font: 850 86px/1.1 Inter; letter-spacing:-.02em; }
  .vc .w { display:inline-block; padding:0 .14em; --hl:0; position:relative; color: color-mix(in oklab, #0B2A5B calc(var(--hl) * 100%), #fff);
           text-shadow: 0 5px 0 rgb(0 10 40 / calc(.7 - var(--hl) * .7)), 0 8px 30px rgb(0 0 0 / calc(.5 - var(--hl) * .5)); }
  .vc .pl { position:absolute; left:0; top:.02em; height:1.08em; border-radius:.22em; z-index:-1; background:#FFD23F; }
  #promo { z-index: 6; }
</style></head>
<body>
<audio src="voz.mp3"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.45" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.6"></audio>
<section class="scene" id="s0" data-start="0" data-duration="6.1"></section>
<section class="scene" id="s1" data-start="5.9" data-duration="5.0"></section>
<section class="scene" id="s2" data-start="10.7" data-duration="5.7"></section>
<section class="scene" id="s3" data-start="16.2" data-duration="5.7"></section>
<section class="scene" id="s4" data-start="21.7" data-duration="7.6"></section>
<div id="titles"></div><div id="vcaps"></div>
<script>
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, 0), tl = gm.timeline(null, S.G), { mk, $, sv } = S, DUR = 29.2;
  const ground = (z, c = '#c9b48c') => mk('rect', { y: 1560, width: 1080, height: 360, fill: c }, z);
  const SUN = 'linear-gradient(#f2b26a, #8fb8de 45%)', DAY = 'linear-gradient(#8fb8de, #e8d9b0 60%)', DUSK = 'linear-gradient(#e8a86a, #6a4a6a)', NIGHT = 'radial-gradient(circle at 50% 45%, #2a3550, #0a0e18 70%)';
  S.titles(tl, [[0, '<em>1421</em><br>TENOCHTITLAN'], [2.4, 'SIN HABLAR<br><em>NÁHUATL</em>'], [6.1, '¿QUIÉN ES<br><em>ESTE HOMBRE</em>?'], [10.9, 'APRENDE<br><em>NÁHUATL</em>'], [12.2, '<em>1428</em>: ADIÓS<br>AZCAPOTZALCO'], [16.4, 'FALTAN<br><em>98 AÑOS</em>'], [20.3, 'ÉL NO<br><em>LLEGARÁ</em>'], [21.9, 'UN <em>LEGADO</em>'], [24.6, '¿QUÉ LES<br><em>ENSEÑARÍAS</em>?'], [29.2, '']], DUR); S.badge('PARTE 1/5');

  const z0 = sv('s0', SUN); const c0 = S.city(z0, 1, 380); ground(z0);
  const portal = mk('ellipse', { cx: 540, cy: 1560, rx: 0, ry: 0, fill: 'rgb(159 227 255 / .35)', stroke: '#9fe3ff', 'stroke-width': 16 }, z0);
  const so = CM.figure(z0, 'MXSF', { weapon: 'carbine' });
  gm.onFrame($('s0'), (l, info) => { const t = info.time, k = gm.clamp(t / 1.0) * (1 - gm.clamp((t - 2.6) / .5)); portal.setAttribute('rx', 150 * k); portal.setAttribute('ry', 250 * k);
    so.o.style.opacity = gm.clamp((t - 1.2) / .6); CM.pose(so, { x: 540, y: 1820, s: 2.1, dir: 1 }); c0.canoes.forEach((c, i) => c.setAttribute('transform', `translate(${(100 + i * 380 + t * 30) % 1180} ${1360 + i * 60})`)); });
  const z1 = sv('s1', DAY); S.city(z1, 1, 160).canoes.forEach(c => c.remove()); ground(z1);
  const s1 = CM.figure(z1, 'MXSF', { weapon: 'none' }); CM.pose(s1, { x: 540, y: 1820, s: 2.1, dir: 1 });
  const crowd = [0, 1, 2, 3].map(i => CM.figure(z1, 'MEX', { weapon: i < 2 ? 'none' : 'macua', shield: i >= 2 })); crowd.forEach((f, i) => CM.pose(f, { x: [140, 300, 800, 960][i], y: 1830, s: 1.9, dir: i < 2 ? 1 : -1, lean: i < 2 ? 14 : 0 }));
  const q1 = CM.text($('s1'), 'big', '¿DIOS?', 560, 'font-size:120px;color:#FFD23F;left:60px;right:auto;width:420px'), q2 = CM.text($('s1'), 'big', '¿ESPÍA?', 560, 'font-size:120px;color:#E5484D;left:600px;right:auto;width:420px');
  tl.from(q1, { scale: 0, duration: .3, ease: 'back.out(2)' }, W('dioses') - .4).from(q2, { scale: 0, duration: .3, ease: 'back.out(2)' }, W('espía') - .3);
  const z2 = sv('s2', DAY); ground(z2); S.city(z2, 1, 160).canoes.forEach(c => c.remove()); ground(z2);
  const words2 = [['ATL', 'AGUA'], ['TEPETL', 'CERRO'], ['TLACATL', 'PERSONA']], cards = words2.map(([n, e], i) => { const g = mk('g', {}, z2); mk('rect', { x: 90 + i * 320, y: 560, width: 280, height: 220, rx: 20, fill: '#efe7d2', stroke: '#7a5a3a', 'stroke-width': 6 }, g);
    const t1 = mk('text', { x: 230 + i * 320, y: 660, 'text-anchor': 'middle', 'font-family': 'Bebas Neue', 'font-size': 70, fill: '#c0392b' }, g); t1.textContent = n; const t2 = mk('text', { x: 230 + i * 320, y: 740, 'text-anchor': 'middle', 'font-family': 'Inter', 'font-weight': 800, 'font-size': 36, fill: '#111' }, g); t2.textContent = e; return g; });
  tl.from(cards, { y: -120, opacity: 0, duration: .35, stagger: .25, ease: 'back.out(1.6)' }, 10.9).to(cards, { opacity: 0, duration: .2 }, 12.1);
  const tri = mk('g', {}, z2); for (let i = 0; i < 4; i++) mk('rect', { x: 120 + i * 230, y: 1600, width: 150, height: 110, rx: 12, fill: '#c9a46a', stroke: '#7a5a3a', 'stroke-width': 5 }, tri);
  const cross = mk('path', { d: 'M100 1580 L1000 1740 M1000 1580 L100 1740', stroke: '#E5484D', 'stroke-width': 22, 'stroke-linecap': 'round' }, z2);
  tl.from(tri.children, { y: 200, opacity: 0, duration: .3, stagger: .1 }, 12.3).from(cross, { draw: 0, duration: .5 }, W('azcapotzalco') - .2);
  const z3 = sv('s3', NIGHT); const line = mk('rect', { x: 100, y: 1000, width: 880, height: 14, rx: 7, fill: '#9fb3c8' }, z3);
  const life = mk('rect', { x: 100, y: 1060, width: 360, height: 30, rx: 15, fill: '#3fbf6a' }, z3); const lt = mk('text', { x: 280, y: 1140, 'text-anchor': 'middle', 'font-family': 'Bebas Neue', 'font-size': 52, fill: '#3fbf6a' }, z3); lt.textContent = 'SU VIDA';
  [[100, '1421', '#fff'], [980, '1519', '#E5484D']].forEach(([x, y, c]) => { mk('circle', { cx: x, cy: 1007, r: 22, fill: c }, z3); const t = mk('text', { x, y: 960, 'text-anchor': 'middle', 'font-family': 'Bebas Neue', 'font-size': 80, fill: c }, z3); t.textContent = y; });
  const shipI = mk('g', { transform: 'translate(980 860) scale(.5)' }, z3); CM.caravel(shipI);
  tl.from(line, { attr: { width: 0 }, duration: 1, ease: 'power2.out' }, 16.4).from(life, { attr: { width: 0 }, duration: .8 }, W('vivirá') - .4).from(lt, { opacity: 0, duration: .3 }, W('vivirá'));
  const z4 = sv('s4', DUSK); S.city(z4, 1, 380).canoes.forEach(c => c.remove()); ground(z4, '#8a6a4a');
  const s4 = CM.figure(z4, 'MXSF', { weapon: 'none' }); CM.pose(s4, { x: 380, y: 1820, s: 2.1, dir: 1, armRot: -20 });
  const cod = mk('g', {}, z4); mk('rect', { x: 520, y: 1380, width: 420, height: 260, rx: 8, fill: '#efe7d2', stroke: '#7a5a3a', 'stroke-width': 6 }, cod); for (let i = 0; i < 4; i++) mk('rect', { x: 540 + i * 100, y: 1380, width: 4, height: 260, fill: '#c9b48c' }, cod);
  mk('circle', { cx: 600, cy: 1470, r: 30, fill: '#c0392b' }, cod); mk('path', { d: 'M680 1500 l40 -60 l40 60z', fill: '#1f6fb0' }, cod); mk('rect', { x: 800, y: 1450, width: 90, height: 40, fill: '#2f8f5a' }, cod);
  const qm = CM.text($('s4'), 'big', '?', 560, 'font-size:220px;color:#FFD23F');
  tl.from(cod, { scale: 0, opacity: 0, duration: .4, ease: 'back.out(1.8)', transformOrigin: '730px 1510px' }, W('dejar') - .2).from(qm, { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('enseñarías') - .2);

  ['s1','s2','s3','s4'].forEach(id => tl.from($(id), { opacity: 0, duration: .2 }, +$(id).dataset.start));
  return S.captions(words);
}));
</script>
</body>
</html>
