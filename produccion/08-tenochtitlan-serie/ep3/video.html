<!doctype html>
<!--
  CURIOSIMUNDO · Serie "El soldado en Tenochtitlan" · Parte 3 de 5 (9:16, serie "¿Y si…?").
  Sección 2 · Tácticas: en la historia real los aliados indígenas (Tlaxcala) fueron clave para Cortés; aquí: paz con Tlaxcala, vigías, zanjas y lanzas, puentes móviles.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="26.9" data-safe-zone="reels">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="common.js"></script>
<style>
  body { background: radial-gradient(1200px 1400px at 50% 40%, #1565C0, #0B2A5B 75%); }
  #band { position:absolute; left:0; top:560px; width:1920px; height:1080px; transform: scale(.5625); transform-origin: 0 0; overflow:hidden; z-index:2; }
  #frame { position:absolute; left:0; top:556px; width:1080px; height:616px; border-top:4px solid #FFD23F; border-bottom:4px solid #FFD23F; z-index:3; pointer-events:none; }
  .ttl { position:absolute; left:40px; right:40px; top:250px; height:290px; display:flex; align-items:center; justify-content:center; text-align:center; z-index:5;
         font: 400 118px/.92 'Bebas Neue'; text-shadow: 0 10px 40px rgb(0 0 0 / .6); opacity:0; }
  .ttl em { font-style:normal; color:#FFD23F; }
  #vcaps { position:absolute; inset:0; z-index:8; pointer-events:none; }
  .vc { position:absolute; left:50px; right:50px; top:1240px; text-align:center; isolation:isolate; font: 850 86px/1.1 Inter; letter-spacing:-.02em; }
  .vc .w { display:inline-block; padding:0 .14em; --hl:0; position:relative; color: color-mix(in oklab, #0B2A5B calc(var(--hl) * 100%), #fff);
           text-shadow: 0 5px 0 rgb(0 10 40 / calc(.7 - var(--hl) * .7)), 0 8px 30px rgb(0 0 0 / calc(.5 - var(--hl) * .5)); }
  .vc .pl { position:absolute; left:0; top:.02em; height:1.08em; border-radius:.22em; z-index:-1; background:#FFD23F; }
  #promo { z-index: 6; }
</style></head>
<body>
<audio src="voz.mp3"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.45" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.6"></audio>
<section class="scene" id="s0" data-start="0" data-duration="8.2"></section>
<section class="scene" id="s1" data-start="8.0" data-duration="4.0"></section>
<section class="scene" id="s2" data-start="11.8" data-duration="4.6"></section>
<section class="scene" id="s3" data-start="16.2" data-duration="6.2"></section>
<section class="scene" id="s4" data-start="22.2" data-duration="4.8"></section>
<div id="titles"></div><div id="vcaps"></div>
<script>
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, 0), tl = gm.timeline(null, S.G), { mk, $, sv } = S, DUR = 26.9;
  const ground = (z, c = '#c9b48c') => mk('rect', { y: 1560, width: 1080, height: 360, fill: c }, z);
  const SUN = 'linear-gradient(#f2b26a, #8fb8de 45%)', DAY = 'linear-gradient(#8fb8de, #e8d9b0 60%)', DUSK = 'linear-gradient(#e8a86a, #6a4a6a)', NIGHT = 'radial-gradient(circle at 50% 45%, #2a3550, #0a0e18 70%)';
  S.titles(tl, [[0, '<em>MILES</em> DE<br>ALIADOS'], [3.8, 'CORTÉS +<br><em>TLAXCALA</em>'], [8.2, 'PAZ CON<br><em>TLAXCALA</em>'], [12.0, '<em>VIGÍAS</em><br>EN LA COSTA'], [13.6, 'SEÑALES<br>DE <em>HUMO</em>'], [16.4, 'ZANJAS Y<br><em>LANZAS LARGAS</em>'], [19.6, 'PUENTES QUE<br><em>SE QUITAN</em>'], [22.4, '¿QUÉ <em>TÁCTICA</em><br>AÑADIRÍAS?'], [26.9, '']], DUR); S.badge('PARTE 3/5');

  const z0 = sv('s0', DAY); ground(z0);
  const tl0 = Array.from({ length: 14 }, (_, i) => CM.figure(z0, 'TLX')); const es0 = Array.from({ length: 3 }, () => CM.figure(z0, 'ES'));
  const hist = CM.text($('s0'), 'mid', 'HISTORIA <b>REAL</b>', 600, 'font-size:56px');
  gm.onFrame($('s0'), (l, info) => { const t = info.time; es0.forEach((f, i) => CM.pose(f, { x: 120 + i * 120 + t * 20, y: 1830, s: 1.7, dir: 1, run: .3, ph: t * 6 + i }));
    tl0.forEach((f, i) => { f.o.style.opacity = gm.clamp((t - 4.6 - i * .08) / .3); CM.pose(f, { x: 480 + (i % 7) * 85 + t * 20, y: 1700 + Math.floor(i / 7) * 130, s: 1.3 + Math.floor(i / 7) * .3, dir: 1, run: .3, ph: t * 6 + i }); }); });
  const z1 = sv('s1', SUN); S.city(z1, 1, 380).canoes.forEach(c => c.remove()); ground(z1);
  const a = CM.figure(z1, 'MEX', { weapon: 'none', shield: false }), b = CM.figure(z1, 'TLX', { weapon: 'none', shield: false }); CM.pose(a, { x: 420, y: 1820, s: 2.1, dir: 1 }); CM.pose(b, { x: 660, y: 1820, s: 2.1, dir: -1 });
  CM.flag(z1, 'MEX', 160, 620, 150, 100); CM.flag(z1, 'TLX', 770, 620, 150, 100);
  const heart = CM.text($('s1'), 'big', 'PAZ', 580, 'font-size:150px;color:#3fbf6a'); tl.from(heart, { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('paces') - .2);
  const z2 = sv('s2', 'linear-gradient(#8fb8de, #e8d9b0 70%)'); mk('rect', { y: 1500, width: 1080, height: 420, fill: '#3f86b4' }, z2);
  const hills = [[160, 1500], [420, 1320], [680, 1150], [940, 980]].map(([x, y], i) => { mk('path', { d: `M${x - 200} 1600 L${x} ${y} L${x + 200} 1600Z`, fill: ['#6f8f5a', '#5f7f4a', '#6f7f99', '#5f6f89'][i] }, z2); return [x, y]; });
  const smokes = hills.map(([x, y], i) => { const g = mk('g', {}, z2); for (let k = 0; k < 4; k++) mk('circle', { cx: x + k * 6, cy: y - 40 - k * 45, r: 24 + k * 8, fill: '#e8e8e8', opacity: .85 - k * .15 }, g); return g; });
  tl.from(smokes, { opacity: 0, scale: 0, duration: .4, stagger: .7, transformOrigin: 'center bottom' }, 13.6);
  const sh2 = mk('g', { transform: 'translate(120 1560) scale(.35)' }, z2); CM.caravel(sh2);
  const z3 = sv('s3', DAY); ground(z3);
  const ditch = mk('rect', { x: 560, y: 1700, width: 160, height: 220, fill: '#5a4030' }, z3);
  const horse = CM.horse(z3, '#6a4a2e'), rider = CM.figure(z3, 'ES', { weapon: 'none' }); const spears = [0, 1, 2].map(() => CM.figure(z3, 'MEX', { weapon: 'none', shield: false }));
  const lances = spears.map(() => mk('path', { d: '', stroke: '#6b4a2a', 'stroke-width': 9, 'stroke-linecap': 'round' }, z3));
  const brid = mk('g', {}, z3); mk('rect', { x: 0, y: 1150, width: 1080, height: 120, fill: '#3f86b4' }, brid); mk('rect', { x: 0, y: 1120, width: 380, height: 40, fill: '#c9b48c' }, brid); mk('rect', { x: 700, y: 1120, width: 380, height: 40, fill: '#c9b48c' }, brid);
  const plank = mk('rect', { x: 380, y: 1120, width: 320, height: 40, fill: '#8a6a4a' }, brid);
  gm.onFrame($('s3'), (l, info) => { const t = info.time, hx = Math.min(140 + (t - 16.2) * 260, 470);
    horse.g.setAttribute('transform', `translate(${hx} 1830) scale(1.4)`); CM.horsePose(horse, t, hx < 470 ? 1 : 0); CM.pose(rider, { x: hx + 6, y: 1690, s: 1.5, dir: 1 });
    spears.forEach((f, i) => { const x = 800 + i * 110; CM.pose(f, { x, y: 1820, s: 1.8, dir: -1 }); lances[i].setAttribute('d', `M${x - 20} 1590 L${x - 300} 1520`); });
    brid.style.display = t > 19.4 ? '' : 'none'; plank.setAttribute('y', 1120 - gm.clamp((t - 20.6) / .8) * 260); });
  const z4 = sv('s4', SUN); S.city(z4, 1, 380).canoes.forEach(c => c.remove()); ground(z4); const s4 = CM.figure(z4, 'MXSF', { weapon: 'none' }); CM.pose(s4, { x: 540, y: 1820, s: 2.1, dir: 1 });
  const qm = CM.text($('s4'), 'big', '?', 560, 'font-size:220px;color:#FFD23F'); tl.from(qm, { scale: 0, duration: .4, ease: 'back.out(2.5)' }, 22.4);

  ['s1','s2','s3','s4'].forEach(id => tl.from($(id), { opacity: 0, duration: .2 }, +$(id).dataset.start));
  return S.captions(words);
}));
</script>
</body>
</html>
