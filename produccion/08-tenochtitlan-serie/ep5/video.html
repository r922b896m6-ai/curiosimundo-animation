<!doctype html>
<!--
  CURIOSIMUNDO · Serie "El soldado en Tenochtitlan" · Parte 5 de 5 (9:16, serie "¿Y si…?").
  Sección 3 · La guerra (2): las calzadas, los puentes móviles y las canoas; sin aliados, los españoles se retiran y se rinden (sin sangre). Final de la serie.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="26.8" data-safe-zone="reels">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="common.js"></script>
<style>
  body { background: radial-gradient(1200px 1400px at 50% 40%, #1565C0, #0B2A5B 75%); }
  #band { position:absolute; left:0; top:560px; width:1920px; height:1080px; transform: scale(.5625); transform-origin: 0 0; overflow:hidden; z-index:2; }
  #frame { position:absolute; left:0; top:556px; width:1080px; height:616px; border-top:4px solid #FFD23F; border-bottom:4px solid #FFD23F; z-index:3; pointer-events:none; }
  .ttl { position:absolute; left:40px; right:40px; top:250px; height:290px; display:flex; align-items:center; justify-content:center; text-align:center; z-index:5;
         font: 400 118px/.92 'Bebas Neue'; text-shadow: 0 10px 40px rgb(0 0 0 / .6); opacity:0; }
  .ttl em { font-style:normal; color:#FFD23F; }
  #vcaps { position:absolute; inset:0; z-index:8; pointer-events:none; }
  .vc { position:absolute; left:50px; right:50px; top:1240px; text-align:center; isolation:isolate; font: 850 86px/1.1 Inter; letter-spacing:-.02em; }
  .vc .w { display:inline-block; padding:0 .14em; --hl:0; position:relative; color: color-mix(in oklab, #0B2A5B calc(var(--hl) * 100%), #fff);
           text-shadow: 0 5px 0 rgb(0 10 40 / calc(.7 - var(--hl) * .7)), 0 8px 30px rgb(0 0 0 / calc(.5 - var(--hl) * .5)); }
  .vc .pl { position:absolute; left:0; top:.02em; height:1.08em; border-radius:.22em; z-index:-1; background:#FFD23F; }
  #promo { z-index: 6; }
</style></head>
<body>
<audio src="voz.mp3"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.45" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.6"></audio>
<section class="scene" id="s0" data-start="0" data-duration="6.1"></section>
<section class="scene" id="s1" data-start="5.9" data-duration="6.2"></section>
<section class="scene" id="s2" data-start="11.9" data-duration="4.2"></section>
<section class="scene" id="s3" data-start="15.9" data-duration="4.5"></section>
<section class="scene" id="s4" data-start="20.2" data-duration="6.7"></section>
<div id="titles"></div><div id="vcaps"></div>
<script>
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, 0), tl = gm.timeline(null, S.G), { mk, $, sv } = S, DUR = 26.8;
  const ground = (z, c = '#c9b48c') => mk('rect', { y: 1560, width: 1080, height: 360, fill: c }, z);
  const SUN = 'linear-gradient(#f2b26a, #8fb8de 45%)', DAY = 'linear-gradient(#8fb8de, #e8d9b0 60%)', DUSK = 'linear-gradient(#e8a86a, #6a4a6a)', NIGHT = 'radial-gradient(circle at 50% 45%, #2a3550, #0a0e18 70%)';
  S.titles(tl, [[0, '<em>+200.000</em><br>PERSONAS'], [2.5, 'CORTÉS<br><em>AVANZA</em>'], [6.1, 'LAS <em>CALZADAS</em>'], [8.5, '<em>CIENTOS</em><br>DE CANOAS'], [10.0, 'CABALLOS<br><em>INÚTILES</em>'], [12.1, 'SIN <em>ALIADOS</em>'], [13.6, 'SE <em>RETIRAN</em>…'], [15.0, '…Y SE <em>RINDEN</em>'], [16.1, 'UN IMPERIO<br><em>MEXICA</em>'], [18.3, 'DE TÚ A TÚ<br>CON <em>EUROPA</em>'], [20.4, 'ES SOLO UN<br><em>¿Y SI…?</em>'], [21.9, '¿HABRÍA CAMBIADO<br><em>LA HISTORIA</em>?'], [26.8, '']], DUR); S.badge('PARTE 5/5');

  const z0 = sv('s0', SUN); const c0 = S.city(z0, 1, 380); ground(z0);
  const crowd = Array.from({ length: 16 }, (_, i) => CM.figure(z0, i % 4 ? 'MEX' : 'TLX', { weapon: 'none', shield: false })); crowd.forEach((f, i) => CM.pose(f, { x: 40 + (i % 8) * 140, y: 1700 + Math.floor(i / 8) * 150, s: 1.2 + Math.floor(i / 8) * .4, dir: i % 2 ? 1 : -1 }));
  gm.onFrame($('s0'), (l, info) => c0.canoes.forEach((c, i) => c.setAttribute('transform', `translate(${(100 + i * 380 + info.time * 30) % 1180} ${1360 + i * 60})`)));
  const z1 = sv('s1', DAY); mk('rect', { y: 900, width: 1080, height: 1020, fill: '#3f86b4' }, z1); const cw = mk('rect', { x: 0, y: 1500, width: 1080, height: 90, fill: '#c9b48c' }, z1);
  const gap = mk('rect', { x: 600, y: 1500, width: 0, height: 90, fill: '#3f86b4' }, z1);
  const col = Array.from({ length: 4 }, () => CM.figure(z1, 'ES')); const hz = CM.horse(z1, '#7a5236');
  const canoes = Array.from({ length: 10 }, (_, i) => { const g = mk('g', {}, z1); mk('path', { d: 'M-70 0 L70 0 L50 18 L-50 18Z', fill: '#6b4a2a' }, g); const w = CM.figure(g, 'MEX', { weapon: 'none' }); CM.pose(w, { x: 0, y: 0, s: .8, dir: i % 2 ? 1 : -1 }); return { g, x: (i * 117) % 1080, y: i % 2 ? 1300 + (i % 3) * 40 : 1700 + (i % 3) * 50 }; });
  gm.onFrame($('s1'), (l, info) => { const t = info.time, k = gm.clamp((t - 8.3) / 1.5);
    col.forEach((f, i) => CM.pose(f, { x: 100 + i * 100 + Math.min(t - 5.9, 2.6) * 60, y: 1500, s: 1.4, dir: 1, run: t < 8.5 ? .5 : 0, ph: t * 8 + i })); hz.g.setAttribute('transform', `translate(${520 + Math.min(t - 5.9, 2.6) * 60} 1500) scale(.9)`); CM.horsePose(hz, t, t < 8.5 ? 1 : 0);
    gap.setAttribute('width', 200 * gm.clamp((t - 7.4) / .6));
    canoes.forEach((c, i) => c.g.setAttribute('transform', `translate(${c.x + (1 - k) * (i % 2 ? -600 : 600)} ${c.y})`)); });
  const z2 = sv('s2', DAY); S.city(z2, 1, 160).canoes.forEach(c => c.remove()); ground(z2);
  const es = Array.from({ length: 4 }, () => CM.figure(z2, 'ES')); const mx = Array.from({ length: 4 }, (_, i) => CM.figure(z2, i % 2 ? 'TLX' : 'MEX'));
  gm.onFrame($('s2'), (l, info) => { const t = info.time, ret = t > 13.6 && t < 15.0, sur = t >= 15.0;
    es.forEach((f, i) => CM.pose(f, { x: 120 + i * 110 - (ret ? (t - 13.6) * 80 : sur ? 112 : 0), y: 1820, s: 1.8, dir: ret ? -1 : 1, run: ret ? 1 : 0, ph: t * 10 + i, up: sur }));
    mx.forEach((f, i) => CM.pose(f, { x: 640 + i * 110 - (sur ? 60 : 0), y: 1820, s: 1.8, dir: -1 })); });
  const flagR = mk('g', {}, z2); mk('rect', { x: 960, y: 1240, width: 8, height: 580, fill: '#3a2a1a' }, flagR); CM.flag(flagR, 'MEX', 968, 1240, 120, 80);
  const z3 = sv('s3', 'linear-gradient(#efe7d2, #d9cfb4)');
  const mf = mk('g', {}, z3); CM.flag(mf, 'MEX', 120, 880, 330, 220); const ef = mk('g', {}, z3); CM.flag(ef, 'ESB', 630, 880, 330, 220);
  const a3 = CM.figure(z3, 'MEX', { weapon: 'none', shield: false }), b3 = CM.figure(z3, 'ES', { weapon: 'none' }); CM.pose(a3, { x: 380, y: 1650, s: 2.1, dir: 1, armRot: -10 }); CM.pose(b3, { x: 700, y: 1650, s: 2.1, dir: -1, armRot: -10 });
  const tbl = mk('rect', { x: 400, y: 1460, width: 280, height: 30, fill: '#8a6a4a' }, z3); const doc = mk('rect', { x: 470, y: 1420, width: 140, height: 50, fill: '#fff', stroke: '#7a5a3a', 'stroke-width': 3 }, z3);
  tl.from([mf, ef], { scale: 0, opacity: 0, duration: .4, stagger: .2, ease: 'back.out(1.8)', transformOrigin: 'center center' }, 16.1);
  const z4 = sv('s4', NIGHT); const s4 = CM.figure(z4, 'MXSF', { weapon: 'none' }); CM.pose(s4, { x: 540, y: 1820, s: 2.2, dir: 1 });
  const qm = CM.text($('s4'), 'big', '?', 560, 'font-size:220px;color:#FFD23F'); const br = CM.text($('s4'), 'big', 'CURIOSI<em>MUNDO</em>', 860, 'font-size:84px;letter-spacing:.14em');
  tl.from(qm, { scale: 0, duration: .4, ease: 'back.out(2.5)' }, 21.9).from(br, { opacity: 0, y: 30, duration: .5 }, W('comentarios') - .5);

  ['s1','s2','s3','s4'].forEach(id => tl.from($(id), { opacity: 0, duration: .2 }, +$(id).dataset.start));
  return S.captions(words);
}));
</script>
</body>
</html>
