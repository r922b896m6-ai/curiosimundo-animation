<!doctype html>
<!--
  REEL: ¿Y si los humanos pudiéramos respirar bajo el agua?  (Curiosimundo, 9:16, ~50 s)

  LOOK: una sola inmersión. El fondo es el mar y la cámara baja durante todo el vídeo: turquesa con rayos de sol
  arriba → azul profundo → abismo negro con puntos bioluminiscentes. Un indicador de profundidad (arriba a la derecha)
  cuenta los metros. Ilustraciones planas tipo póster, alto contraste.
  TIPO: Bebas Neue para titulares y cifras (140-320 px), Inter 850 para subtítulos (84 px, píldora amarilla en la palabra dicha).
  PALETA: agua #18c6d6 → #0a3a6b → #020814; texto #f2fbff; acento amarillo #ffd23f (palabra clave, subtítulos);
  coral #ff6b5b (branquias, peligro).
  MOVIMIENTO: entradas rápidas expo/back.out, salidas cortas hacia arriba (power2.in) mientras la siguiente escena sube:
  la sensación de seguir bajando. Ambiente siempre vivo: burbujas, rayos que se mecen, nieve marina.

  SHOT LIST (tiempos de vídeo, cortes en las frases de la voz):
  0.0  s1  Gancho: "¿Y SI RESPIRÁRAMOS BAJO EL AGUA?" ya en pantalla en el frame 0 + buceador con burbujas.
  3.3  s2  Cabeza de perfil; a "branquias" se dibujan 3 branquias en el cuello; pez cruza en "peces"; O₂ entra en "oxígeno".
  9.1  s3  Barras AIRE vs AGUA; "30×" cuenta y golpea en "treinta"; "MENOS OXÍGENO".
  14.3 s4  La cabeza vuelve; en "enormes" brotan branquias gigantes; flujo de agua sin parar.
  19.2 s5  "NUEVO HOGAR": cúpulas en "ciudades", algas en "granjas", nadador vs submarino tachado en "submarinos".
  27.0 s6  Anillo 80% se dibuja, "80%" cuenta en "ochenta", "SIN EXPLORAR".
  32.1 s7  Se apaga la luz: "200 m"; salto a "1000 m"; esfera aplastada "×100 PRESIÓN" en "cien".
  39.4 s8  Silueta pierde calor (ondas naranjas → azules), termómetro baja, "25×" en "veinticinco".
  45.4 s9  Cierre: "¿TE MUDARÍAS AL FONDO DEL MAR?" + CURIOSIMUNDO, bioluminiscencia.
  Subtítulos palabra a palabra en la franja y≈1260 durante todo el vídeo.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="50.5" data-safe-zone="reels">
<head>
<style>
  :root { --ink:#f2fbff; --accent:#ffd23f; --coral:#ff6b5b; --skin:#bdeffa; --deep:#020814; --muted:#9fd3e6;
          --head: "Bebas Neue", Inter, sans-serif; --font: Inter, system-ui, sans-serif; }
  body { background: var(--deep); color: var(--ink); font-family: var(--font); overflow: hidden; margin: 0; }

  /* ---------- ocean (always on) ---------- */
  #ocean { position:absolute; inset:0; }
  #water { position:absolute; inset:0; }
  .ray { position:absolute; top:-200px; width:150px; height:1700px; transform-origin: 50% 0;
         background: linear-gradient(to bottom, rgb(255 255 255 / .55), rgb(255 255 255 / 0) 85%); filter: blur(6px); }
  .bub { position:absolute; border-radius:50%; border: 3px solid rgb(255 255 255 / .55);
         background: radial-gradient(circle at 32% 30%, rgb(255 255 255 / .7) 0 18%, rgb(255 255 255 / .06) 40%, transparent 70%); }
  #snow { position:absolute; inset:0; -webkit-mask-image: linear-gradient(#000 0 260px, transparent 300px 1160px, #000 1200px 1220px, transparent 1240px 1420px, #000 1460px); mask-image: linear-gradient(#000 0 260px, transparent 300px 1160px, #000 1200px 1220px, transparent 1240px 1420px, #000 1460px); }
  .snow { position:absolute; border-radius:50%; background:#cfefff; }
  .glowdot { position:absolute; border-radius:50%; background: radial-gradient(closest-side, #7dfcff, rgb(125 252 255 / 0)); }
  #depth { position:absolute; top:236px; right:60px; z-index:5; display:flex; align-items:center; gap:14px;
           font: 700 34px/1 var(--font); letter-spacing:.02em; color: var(--ink);
           padding: 14px 24px; border-radius: 40px; background: rgb(2 8 20 / .72); border: 2px solid rgb(255 255 255 / .25); }
  #depth i { width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid var(--accent); }

  /* ---------- scenes ---------- */
  .scene { z-index: 2; }
  .hl { position:absolute; left:60px; right:60px; margin:0; text-align:center; font-family: var(--head);
        font-weight:400; line-height:.9; letter-spacing:.01em; text-shadow: 0 10px 40px rgb(0 20 40 / .45); }
  .hl em { font-style:normal; color: var(--accent); }
  .hl .w { display:inline-block; }
  .sub { position:absolute; left:60px; right:60px; text-align:center; font: 800 46px/1.1 var(--font);
         letter-spacing:.06em; text-transform:uppercase; color: var(--muted); }
  svg { overflow: visible; }

  /* s1 */
  #s1 .hl { top: 330px; font-size: 176px; }
  #diver { position:absolute; left: 340px; top: 830px; width: 400px; }

  .o2 { position:absolute; width: 96px; height: 96px; border-radius: 50%; display:grid; place-items:center;
        font: 800 40px/1 var(--font); color:#063049; background: #dff9ff; box-shadow: 0 0 30px rgb(160 240 255 / .8); }
  .o2 sub { font-size: 24px; vertical-align: -4px; }
  #head2 .frills, #head2 .flow { display:none; }
  #head4 { top: 640px; }
  /* s3 */
  #s3 .hl { top: 290px; font-size: 300px; }
  #s3 .sub { top: 560px; font-size: 54px; color: var(--ink); }
  .col { position:absolute; bottom: calc(1920px - 1110px); width: 300px; height: 420px; }
  .col .glass { position:absolute; inset:0; border-radius: 28px; border: 4px solid rgb(255 255 255 / .55); background: rgb(255 255 255 / .06); overflow:hidden; }
  .col .fill { position:absolute; left:0; right:0; bottom:0; transform-origin: 50% 100%; }
  .col .lab { position:absolute; top: 100%; left:0; right:0; margin-top: 16px; text-align:center; font: 400 70px/1 var(--head); letter-spacing:.04em; }
  #cAir { left: 150px; } #cAir .fill { top:0; background: linear-gradient(#ffffff, #bdefff); }
  #cWat { left: 630px; } #cWat .fill { height: 16px; background: var(--accent); }
  .dot { position:absolute; width: 34px; height: 34px; border-radius: 50%; background: #2a8fc2; box-shadow: inset 0 0 0 5px #1b6f9c; }
  /* s5 */
  #s5 .hl { top: 290px; font-size: 168px; }
  #city { position:absolute; left: 0; top: 560px; width: 1080px; height: 640px; }
  /* s6 */
  #s6 .hl { top: 300px; font-size: 140px; }
  #ring { position:absolute; left: 240px; top: 500px; width: 600px; height: 600px; }
  #pct { position:absolute; left: 240px; top: 650px; width: 600px; text-align:center; font: 400 260px/1 var(--head); color: var(--accent); }
  #pct small { font-size: 150px; }
  /* s7 */
  #s7 .hl { top: 330px; font-size: 320px; }
  #s7 .sub { top: 640px; font-size: 52px; }
  #press { position:absolute; left: 330px; top: 580px; width: 420px; height: 420px; }
  #p100 { position:absolute; left: 60px; right: 60px; top: 1050px; text-align:center; font: 400 120px/1 var(--head); color: var(--coral); }
  /* s8 */
  #s8 .hl { top: 290px; font-size: 280px; }
  #s8 .sub { top: 560px; font-size: 54px; color: var(--ink); }
  #body { position:absolute; left: 230px; top: 660px; width: 420px; height: 500px; }
  #thermo { position:absolute; left: 760px; top: 680px; width: 90px; height: 440px; }
  /* s9 */
  #s9 .hl { top: 360px; font-size: 168px; }
  #brand { position:absolute; left:0; right:0; top: 1010px; text-align:center; font: 400 92px/1 var(--head);
           letter-spacing:.14em; color: var(--ink); }
  #brand span { color: var(--accent); }

  /* ---------- captions ---------- */
  #caps { position:absolute; inset:0; z-index: 6; pointer-events:none; }
  .cap { position:absolute; left:70px; right:70px; top:1250px; text-align:center; isolation:isolate;
         font-size:84px; font-weight:850; line-height:1.1; letter-spacing:-.02em; }
  .cap .w { display:inline-block; padding:0 .14em; --hl:0; position:relative;
            color: color-mix(in oklab, #10203a calc(var(--hl) * 100%), #ffffff);
            text-shadow: 0 4px 0 rgb(0 20 40 / calc(.55 - var(--hl) * .55)), 0 8px 30px rgb(0 0 0 / calc(.5 - var(--hl) * .5)); }
  .pill { position:absolute; left:0; top:.02em; height:1.08em; border-radius:.22em; z-index:-1; background: var(--accent);
          box-shadow: 0 10px 40px rgb(255 210 63 / .45); }
</style>

<script>
/* ---------------- shared bits ---------------- */
const HEAD = `
<svg viewBox="0 0 600 600" width="600" height="600">
  <g class="frills" stroke-linecap="round" fill="none">
    <g class="fr" style="transform-origin:200px 230px"><path d="M200 200 C130 150 90 100 50 40" stroke="#ff6b5b" stroke-width="26"/><path d="M200 200 C130 150 90 100 50 40" stroke="#ff9a8e" stroke-width="64" stroke-dasharray="6 26"/></g>
    <g class="fr" style="transform-origin:200px 230px"><path d="M190 240 C120 230 70 220 10 210" stroke="#ff6b5b" stroke-width="26"/><path d="M190 240 C120 230 70 220 10 210" stroke="#ff9a8e" stroke-width="64" stroke-dasharray="6 26"/></g>
    <g class="fr" style="transform-origin:200px 230px"><path d="M200 280 C130 320 90 370 50 430" stroke="#ff6b5b" stroke-width="26"/><path d="M200 280 C130 320 90 370 50 430" stroke="#ff9a8e" stroke-width="64" stroke-dasharray="6 26"/></g>
  </g>
  <g fill="#bdeffa">
    <path d="M230 350 L230 470 Q290 490 350 470 L350 350 Z"/>
    <path d="M110 600 Q120 470 240 458 L340 458 Q460 470 470 600 Z"/>
    <ellipse cx="300" cy="230" rx="150" ry="155"/>
    <path d="M440 220 q42 34 0 62 Z"/>
  </g>
  <path d="M160 170 Q200 70 300 72 Q390 74 430 150 Q360 120 300 130 Q220 140 190 230 Z" fill="#0f4c6e"/>
  <circle cx="380" cy="205" r="16" fill="#062033"/>
  <path d="M385 305 q22 10 40 -6" stroke="#062033" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g class="gills" stroke="#ff6b5b" stroke-width="10" fill="none" stroke-linecap="round">
    <path class="gill" d="M245 370 q28 18 56 0"/><path class="gill" d="M245 400 q28 18 56 0"/><path class="gill" d="M245 430 q28 18 56 0"/>
  </g>
  <g class="flow" stroke="#e6fdff" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="4 30" opacity="0">
    <path d="M560 300 C500 310 460 320 420 315"/><path d="M290 400 C220 420 160 450 60 470"/><path d="M290 430 C230 470 170 520 80 560"/><path d="M560 340 C500 350 460 340 430 330"/>
  </g>
</svg>`;
document.getElementById('head2').innerHTML = HEAD;
document.getElementById('head4').innerHTML = HEAD;

/* ---------------- ocean: depth drives everything ---------------- */
const depthAt = t => gm.interpolate(t, [0, 3.3, 9, 14.3, 19.2, 27, 32.1, 33.4, 34.2, 35.5, 36.4, 50.5],
                                       [0, 4, 12, 22, 30, 38, 55, 70, 200, 205, 1000, 1000], { easing: 'in-out-cubic' });
const dark = d => gm.clamp(Math.log10(1 + d) / 3);          // 0 at surface → 1 at 1000 m
const rays = document.getElementById('rays');
for (let i = 0; i < 6; i++) { const r = document.createElement('div'); r.className = 'ray'; r.style.left = (80 + i * 170) + 'px'; rays.append(r); }
const bubbles = document.getElementById('bubbles'), B = [];
for (let i = 0; i < 26; i++) { const b = document.createElement('div'); b.className = 'bub'; const s = 10 + gm.random('bs' + i) * 34;
  b.style.width = b.style.height = s + 'px'; bubbles.append(b); B.push({ el: b, s, x: gm.random('bx' + i) * 1080, sp: 90 + gm.random('bv' + i) * 160, ph: gm.random('bp' + i) * 2400 }); }
const snow = document.getElementById('snow'), S = [];
for (let i = 0; i < 18; i++) { const g = true; const d = document.createElement('div'); d.className = g ? 'glowdot' : 'snow';
  const s = g ? 30 + gm.random('gs' + i) * 40 : 3 + gm.random('ss' + i) * 5; d.style.width = d.style.height = s + 'px'; snow.append(d);
  S.push({ el: d, g, x: gm.random('sx' + i) * 1080, y: gm.random('sy' + i) * 1920, ph: gm.random('sp' + i) * 6.28 }); }
const water = document.getElementById('water'), dval = document.getElementById('dval');
gm.onFrame(t => {
  const d = depthAt(t), k = dark(d);
  const top = gm.color.mix('#2ad6e2', '#020a1c', Math.min(1, k * 1.15));
  const mid = gm.color.mix('#0e7fb4', '#01060f', k);
  const bot = gm.color.mix('#0a3a6b', '#000207', k);
  water.style.background = `linear-gradient(to bottom, ${top} 0%, ${mid} 50%, ${bot} 100%)`;
  dval.textContent = Math.round(d) + ' m';
  rays.style.opacity = Math.max(0, 1 - k * 1.7);
  [...rays.children].forEach((r, i) => { r.style.transform = `rotate(${12 + Math.sin(t * .5 + i) * 5}deg) scaleX(${1 + .3 * Math.sin(t * .7 + i * 2)})`; });
  B.forEach(b => { const y = 1980 - ((t * b.sp + b.ph) % 2200); b.el.style.transform = `translate(${b.x + Math.sin(t * 2 + b.ph) * 22}px, ${y}px)`; b.el.style.opacity = .9 - k * .45; });
  S.forEach((p, i) => { const y = (p.y + t * 18) % 1920; p.el.style.transform = `translate(${p.x + Math.sin(t * .6 + p.ph) * 30}px, ${y}px)`;
    p.el.style.opacity = p.g ? Math.max(0, (k - .55) * 2.2) * (.5 + .5 * Math.sin(t * 1.7 + p.ph)) : .15 + k * .5; });
});

/* ---------------- scenes ---------------- */
const enter = (tl, sel, at, o = {}) => tl.from(sel, { y: 160, opacity: 0, scale: .85, filter: 'blur(14px)', duration: .55, ease: 'expo.out', stagger: .07, ...o }, at);
const leave = (tl, sel, at) => tl.to(sel, { y: -220, opacity: 0, duration: .32, ease: 'power2.in' }, at);

gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const W = (txt, n = 1) => { let c = 0; for (const w of words) if (norm(w.word) === norm(txt) && ++c === n) return w.start; throw new Error('word ' + txt); };
  const G = { global: true };

  /* S1 hook — visible at frame 0 */
  const t1 = gm.timeline('#s1', G);
  t1.fromTo('#s1 .hl .w', { y: 40, scale: 1.12 }, { y: 0, scale: 1, duration: .7, ease: 'expo.out', stagger: .08 }, 0)
    .from('#diver', { y: 260, rotate: -20, opacity: 0, duration: 1.1, ease: 'power3.out' }, .2)
    .to('#diver', { y: -40, rotate: 6, duration: 2.2, ease: 'sine.inOut' }, 1.2)
    .to('#s1 .hl em', { scale: 1.15, duration: .25, ease: 'back.out(3)' }, W('agua') - .05)
    .to('#s1 .hl em', { scale: 1, duration: .3, ease: 'power2.out' }, W('agua') + .25);
  gm.burst('#s1', { at: .6, kind: 'bubbles', x: '68%', y: '50%', count: 26, global: true });
  gm.burst('#s1', { at: 2.0, kind: 'bubbles', x: '68%', y: '50%', count: 18, global: true });
  leave(t1, ['#s1 .hl', '#diver'], 3.13);

  /* S2 gills */
  const s2 = 3.3, t2 = gm.timeline('#s2', G);
  enter(t2, '#s2 .hl .w', s2);
  t2.from('#head2', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s2 + .1)
    .from('#head2 .gill', { draw: 0, duration: .35, ease: 'power2.out', stagger: .12 }, W('branquias') - .05)
    .fromTo('#head2 .gills', { scale: 1 }, { scale: 1.25, duration: .2, ease: 'back.out(3)', transformOrigin: '50% 50%' }, W('branquias') + .35)
    .to('#head2 .gills', { scale: 1, duration: .3 }, W('branquias') + .6)
    .fromTo('#fish', { x: 1200, y: 0 }, { x: -320, y: -60, duration: 2.6, ease: 'sine.inOut' }, W('peces') - .9)
    .to('#s2 .hl em', { color: '#ff6b5b', duration: .3 }, W('branquias'));
  ['#o2a', '#o2b', '#o2c'].forEach((id, i) => {
    const at = W('oxígeno') - .1 + i * .28;
    t2.fromTo(id, { x: 980, y: 760 + i * 70, scale: .3, opacity: 0 }, { x: 560, y: 830 + i * 30, scale: 1, opacity: 1, duration: .45, ease: 'back.out(1.8)' }, at)
      .to(id, { x: 495, y: 880, scale: .2, opacity: 0, duration: .5, ease: 'power2.in' }, at + .9);
  });
  t2.fromTo('#head2 .gill', { stroke: '#ff6b5b' }, { stroke: '#ffd23f', duration: .2, stagger: .1 }, W('disuelto'));
  leave(t2, ['#s2 .hl', '#head2'], 8.93);

  /* S3 30x */
  const s3 = 9.1, t3 = gm.timeline('#s3', G);
  const dotsAir = document.querySelector('#cAir .dots');
  for (let i = 0; i < 30; i++) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = (22 + (i % 5) * 52 + (Math.floor(i / 5) % 2) * 16) + 'px'; d.style.top = (24 + Math.floor(i / 5) * 64) + 'px'; dotsAir.append(d); }
  const dW = document.createElement('div'); dW.className = 'dot'; dW.style.left = '133px'; dW.style.top = '350px'; document.querySelector('#cWat .dots').append(dW);
  t3.from('.col', { y: 300, opacity: 0, duration: .6, ease: 'expo.out', stagger: .12 }, s3)
    .from('#cAir .fill', { scaleY: 0, duration: .8, ease: 'power3.out' }, s3 + .4)
    .from('#cAir .dot', { scale: 0, duration: .3, ease: 'back.out(2.5)', stagger: { each: .025, from: 'random' } }, W('agua', 3) - .1)
    .from('#cWat .dot', { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('tiene'))
    .from('#s3 .hl', { y: 120, scale: 1.6, opacity: 0, filter: 'blur(16px)', duration: .45, ease: 'expo.out' }, W('treinta') - .25)
    .fromTo('#n30', { textContent: 0 }, { textContent: 30, duration: .55, ease: 'power3.out' }, W('treinta') - .2)
    .from('#s3 .sub', { y: 40, opacity: 0, duration: .4, ease: 'power3.out' }, W('menos'))
    .fromTo('#cWat .glass', { borderColor: 'rgb(255 255 255 / .55)' }, { borderColor: '#ffd23f', duration: .3 }, W('menos'))
    .to('#cAir', { scale: 1.06, duration: .3, ease: 'back.out(2)', transformOrigin: '50% 100%' }, W('aire'));
  gm.burst('#s3', { at: W('treinta') + .05, kind: 'sparks', x: '50%', y: '22%', count: 40, colors: ['#ffd23f', '#ffffff'], global: true });
  leave(t3, ['#s3 .hl', '#s3 .sub', '.col'], 14.25);

  /* S4 huge gills */
  const s4 = 14.3, t4 = gm.timeline('#s4', G);
  enter(t4, '#s4 .hl .w', s4 + .15);
  t4.from('#head4', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s4)
    .from('#head4 .fr', { scale: 0, rotate: -25, duration: .7, ease: 'back.out(1.7)', stagger: .09 }, W('enormes') - .2)
    .fromTo('#head4 svg', { scale: 1 }, { scale: .92, duration: .4, ease: 'power2.out', transformOrigin: '60% 50%' }, W('enormes') - .2)
    .to('#head4 .gills', { opacity: 0, duration: .3 }, W('enormes'))
    .to('#head4 .flow', { opacity: 1, duration: .3 }, W('bombear') - .1)
    .fromTo('#head4 .fr', { rotate: 0 }, { rotate: 6, duration: .5, ease: 'sine.inOut', yoyo: true, repeat: 5 }, W('enormes') + .6)
    .to('#s4 .hl em', { scale: 1.12, duration: .25, ease: 'back.out(3)', transformOrigin: '50% 60%' }, W('enormes') - .05);
  gm.onFrame('#s4', (l, info) => { const f = document.querySelector('#head4 .flow'); f.style.strokeDashoffset = -info.time * 160; });
  leave(t4, ['#s4 .hl', '#head4'], 19.1);

  /* S5 city */
  const s5 = 19.2, t5 = gm.timeline('#s5', G);
  const kelp = document.getElementById('kelp'), KP = [];
  [60, 120, 175, 470, 540, 600, 830, 1020, 1060].forEach((x, i) => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    kelp.append(p); KP.push({ p, x, h: 220 + gm.random('kh' + i) * 200, ph: i }); });
  gm.onFrame('#s5', (l, info) => { const t = info.time; KP.forEach(k => { const s = Math.sin(t * 1.4 + k.ph) * 24;
    k.p.setAttribute('d', `M${k.x} 565 C${k.x + s} ${565 - k.h * .35} ${k.x - s} ${565 - k.h * .7} ${k.x + s * 1.4} ${565 - k.h}`); }); });
  t5.from('#city', { y: 400, opacity: 0, duration: .8, ease: 'expo.out' }, s5)
    .from('#domes .dome', { scale: 0, opacity: 0, duration: .55, ease: 'back.out(1.8)', stagger: .14, transformOrigin: '50% 100%' }, W('ciudades') - .15)
    .from('#tube', { draw: 0, duration: .5, ease: 'power2.out' }, W('ciudades') + .35)
    .from('#kelp path', { draw: 0, duration: .7, ease: 'power3.out', stagger: .05 }, W('granjas') - .1)
    .fromTo('#swimmer', { x: -200, y: 300 }, { x: 760, y: 200, duration: 2.6, ease: 'sine.inOut' }, W('viajes') - .3)
    .from('#sub', { scale: 0, opacity: 0, duration: .4, ease: 'back.out(2)', transformOrigin: '50% 50%' }, W('sin', 2) - .2)
    .from('#strike', { draw: 0, duration: .3, ease: 'power3.out' }, W('submarinos') + .2);
  enter(t5, '#s5 .hl .w', W('hogar') - .5);
  gm.burst('#s5', { at: W('ciudades') + .2, kind: 'bubbles', x: '28%', y: '58%', count: 24, global: true });
  leave(t5, ['#s5 .hl', '#city'], 26.95);

  /* S6 80% */
  const s6 = 27, t6 = gm.timeline('#s6', G);
  t6.from('#ring', { scale: .5, opacity: 0, duration: .6, ease: 'expo.out' }, s6)
    .from('#pct', { scale: .6, opacity: 0, duration: .5, ease: 'back.out(1.8)' }, s6 + .1)
    .fromTo('#arc', { draw: 0 }, { draw: .8, duration: 1.1, ease: 'power3.out' }, W('ochenta') - .2)
    .fromTo('#n80', { textContent: 0 }, { textContent: 80, duration: 1.1, ease: 'power3.out' }, W('ochenta') - .2)
    .to('#ring', { rotate: 8, duration: 4, ease: 'sine.inOut' }, s6 + .6);
  enter(t6, '#s6 .hl .w', W('nadie') - .3);
  leave(t6, ['#s6 .hl', '#ring', '#pct'], 32.05);

  /* S7 depth */
  const s7 = 32.1, t7 = gm.timeline('#s7', G);
  t7.from('#s7 .hl', { y: 160, opacity: 0, filter: 'blur(16px)', duration: .5, ease: 'expo.out' }, W('doscientos') - .35)
    .fromTo('#nM', { textContent: 0 }, { textContent: 200, duration: .6, ease: 'power3.out' }, W('doscientos') - .2)
    .from('#dark', { y: 40, opacity: 0, duration: .4, ease: 'power3.out' }, W('luz') - .3)
    .to('#dark', { opacity: 0, y: 30, duration: .25, ease: 'power2.in' }, W('presión') - .35)
    .to('#nM', { textContent: 1000, duration: .7, ease: 'power3.inOut' }, W('mil') - .25)
    .to('#s7 .hl', { scale: 1.08, duration: .3, ease: 'back.out(3)' }, W('mil') + .4)
    .to('#s7 .hl', { scale: 1, duration: .3 }, W('mil') + .7)
    .from('#press', { scale: .4, opacity: 0, duration: .5, ease: 'back.out(1.6)' }, W('presión') - .2)
    .to('#sphere', { scale: .55, duration: .35, ease: 'expo.out', transformOrigin: '250px 250px' }, W('cien') - .05)
    .to('#sphere', { scaleX: .62, scaleY: .48, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 2, transformOrigin: '250px 250px' }, W('cien') + .3)
    .from('#p100', { y: 60, scale: 1.4, opacity: 0, duration: .35, ease: 'expo.out' }, W('cien') - .1);
  const arrows = document.getElementById('arrows');
  for (let i = 0; i < 8; i++) { const a = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    a.setAttribute('d', 'M250 20 L280 70 L262 70 L262 120 L238 120 L238 70 L220 70 Z'); a.setAttribute('transform', `rotate(${i * 45} 250 250)`);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.append(a); arrows.append(g); }
  t7.from('#arrows g', { opacity: 0, duration: .3, stagger: .04 }, W('presión'));
  gm.onFrame('#s7', (l, info) => { const t = info.time, on = t > W('cien'); arrows.style.transform = on ? `scale(${.92 + .04 * Math.sin(t * 12)})` : ''; arrows.style.transformOrigin = '250px 250px'; });
  leave(t7, ['#s7 .hl', '#press', '#p100'], 39.4);

  /* S8 cold */
  const s8 = 39.4, t8 = gm.timeline('#s8', G);
  const waves = document.getElementById('waves'), WV = [];
  for (let i = 0; i < 6; i++) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); waves.append(p); WV.push(p); }
  gm.onFrame('#s8', (l, info) => { const t = info.time, cool = gm.clamp((t - W('roba')) / 3);
    WV.forEach((p, i) => { const ph = ((t * .9 + i / 6) % 1), r = 160 + ph * 200, a = (i % 2 ? -1 : 1);
      const x0 = 210 + a * r * .9, y0 = 120 + i * 60;
      p.setAttribute('d', `M${x0} ${y0} q${a * 18} 20 0 40 q${-a * 18} 20 0 40`);
      p.setAttribute('stroke', gm.color.mix('#ffb35c', '#7fd8ff', cool)); p.setAttribute('opacity', (1 - ph) * (t > W('roba') - .3 ? 1 : 0)); });
    document.getElementById('h0').setAttribute('stop-color', gm.color.mix('#ffb35c', '#cfefff', cool)); document.getElementById('h1').setAttribute('stop-color', gm.color.mix('#ff6b5b', '#4a9fd8', cool)); });
  t8.from('#body', { y: 260, opacity: 0, duration: .65, ease: 'expo.out' }, s8)
    .from('#thermo', { y: 260, opacity: 0, duration: .65, ease: 'expo.out' }, s8 + .1)
    .fromTo('#merc', { scaleY: 1 }, { scaleY: .18, duration: 3.2, ease: 'power2.inOut', transformOrigin: '50% 100%' }, W('roba'))
    .to('#merc, #bulb', { fill: '#7fd8ff', duration: 2.4 }, W('roba') + .4)
    .from('#s8 .hl', { y: 120, scale: 1.6, opacity: 0, filter: 'blur(16px)', duration: .45, ease: 'expo.out' }, W('veinticinco') - .25)
    .fromTo('#n25', { textContent: 0 }, { textContent: 25, duration: .55, ease: 'power3.out' }, W('veinticinco') - .2)
    .from('#s8 .sub', { y: 40, opacity: 0, duration: .4, ease: 'power3.out' }, W('rápido') - .2);
  gm.burst('#s8', { at: W('veinticinco') + .1, kind: 'dust', x: '50%', y: '22%', count: 40, colors: ['#bfefff', '#ffffff'], global: true });
  leave(t8, ['#s8 .hl', '#s8 .sub', '#body', '#thermo'], 45.3);

  /* S9 end */
  const s9 = 45.35, t9 = gm.timeline('#s9', G);
  enter(t9, '#s9 .hl .w', s9 + .05, { stagger: .12 });
  t9.to('#s9 .hl em', { scale: 1.15, duration: .3, ease: 'back.out(3)' }, W('mar', 2) - .05)
    .from('#brand', { y: 40, opacity: 0, letterSpacing: '.4em', duration: .8, ease: 'expo.out' }, W('mar', 2) + .3)
    .to('#s9 .hl', { scale: 1.04, duration: 4, ease: 'sine.inOut' }, s9 + .6);
  gm.burst('#s9', { at: W('mar', 2) + .1, kind: 'bubbles', x: '50%', y: '62%', count: 40, global: true });

  /* ---------------- captions (whole video) ---------------- */
  const ws = words.map(w => ({ text: w.word, start: w.start, end: w.end }));
  const phrases = [[]];
  ws.forEach((w, i) => { const cur = phrases.at(-1), prev = ws[i - 1];
    if (cur.length && (cur.length === 3 || cur.map(x => x.text).join(' ').length + w.text.length > 17 || w.start - prev.end > .28 || /[.!?,:…]$/.test(prev.text) || /^¿/.test(w.text))) phrases.push([]);
    phrases.at(-1).push(w); });
  const tl = gm.timeline(null, G);
  const caps = phrases.map(ph => { const el = document.createElement('div'); el.className = 'cap';
    el.innerHTML = '<i class="pill"></i>' + ph.map(w => `<span class="w">${w.text}</span>`).join(' ');
    document.getElementById('caps').append(el); return el; });
  return document.fonts.ready.then(() => phrases.forEach((ph, p) => {
    const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
    const box = i => ({ x: spans[i].offsetLeft, width: spans[i].offsetWidth });
    tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .2, ease: 'back.out(2)' }, ph[0].start - .04);
    ph.forEach((w, i) => {
      tl.fromTo(spans[i], { opacity: 0, y: 36, scale: .7 }, { opacity: 1, y: 0, scale: 1, duration: .26, ease: 'back.out(2.2)' }, w.start - .06);
      if (i) tl.to(pill, { ...box(i), duration: .12, ease: 'power3.out' }, w.start - .1);
      tl.to(spans[i], { '--hl': 1, scale: 1.06, duration: .06 }, w.start - .03)
        .to(spans[i], { '--hl': 0, scale: 1, duration: .06 }, ph[i + 1] ? ph[i + 1].start - .1 : Math.min(w.end + .3, next ? next[0].start - .2 : 99));
    });
    if (!next) tl.to(el, { opacity: 0, duration: .25, ease: 'power2.in' }, ph.at(-1).end + .6);
    else tl.to(el, { y: -50, opacity: 0, duration: .2, ease: 'power2.in' }, next[0].start - .22);
  }));
}));
</script>
