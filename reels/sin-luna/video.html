<!doctype html>
<!--
  REEL: ¿Qué pasaría si la Luna desapareciera?  (Curiosimundo, 9:16, ~53.5 s)

  LOOK: cielo nocturno. Al principio, azul de luna llena; cuando la Luna desaparece el cielo se oscurece y salen
  muchas más estrellas (la historia se ve en el fondo). Al final la Luna vuelve y el cielo se ilumina otra vez.
  Ilustraciones planas tipo póster; una píldora arriba a la derecha dice el estado ("LUNA" → "SIN LUNA · NOCHE 1"
  → "SIN LUNA · +1 M AÑOS" → "LUNA").
  TIPO: Bebas Neue para titulares y cifras, Inter 850 para subtítulos (píldora amarilla en la palabra dicha).
  PALETA: cielo #0d1f45 → #02030a; texto #f4f2ff; acento amarillo #ffd23f; coral #ff6b5b (peligro);
  océano #3d8ee8; luna #f3efe2.
  MOVIMIENTO: entradas rápidas expo/back.out, salidas cortas hacia arriba; el titular cambia en el mismo hueco
  cuando cambia la idea; estrellas que titilan siempre.

  SHOT LIST (tiempo de vídeo):
  0.0  s1  Gancho "¿Y SI DESAPARECIERA LA LUNA?" + Luna enorme; en "noche" la Luna se deshace en polvo.
  3.3  s2  Paisaje iluminado por la luna → se apaga en "oscuro"; salen estrellas. "CIELO MÁS OSCURO".
  7.6  s3  Tierra con el océano estirado hacia una Luna fantasma; en "Sin ella" el bulto se encoge; aparece el Sol;
           en "tres" el titular cambia a "3× MÁS PEQUEÑAS".
  19.1 s4  Corales bajo una luna llena fantasma; en "llena" sueltan sus huevos hacia arriba.
  26.1 s5  Tierra con su eje a 23,4° y la Luna en órbita ("INCLINACIÓN"); en "Sin ella" la órbita se va,
           en "tambalearse" el eje se tambalea como un trompo, en "estaciones" medio planeta arde y medio se congela.
  39.4 s6  Sol; la silueta de la Luna llega a taparlo y en "siempre" se tacha: "ADIÓS ECLIPSES".
  42.8 s7  La Luna vuelve, enorme: "MÁS IMPORTANTE DE LO QUE PARECE".
  48.1 s8  Cierre: "¿SABÍAS ESTO?" + "Cuéntamelo en los comentarios" + CURIOSIMUNDO.
  Subtítulos palabra a palabra en la franja y≈1250 durante todo el vídeo.
-->
<html data-width="1080" data-height="1920" data-fps="30" data-duration="53.5" data-safe-zone="reels">
<head>
<style>
  :root { --ink:#f4f2ff; --accent:#ffd23f; --coral:#ff6b5b; --ocean:#3d8ee8; --moon:#f3efe2; --muted:#b7c3e8;
          --head: "Bebas Neue", Inter, sans-serif; --font: Inter, system-ui, sans-serif; }

            font: 700 32px/1 var(--font); letter-spacing:.04em; padding: 14px 24px; border-radius: 40px;

  /* ---------- scenes ---------- */

  svg { overflow: visible; }
  .art { position:absolute; left:0; width:1080px; }

  #s1 .hl { top: 330px; font-size: 176px; }
  #moon1 { position:absolute; left: 350px; top: 830px; width: 380px; height: 380px; }

  /* ---------- captions ---------- */
  #caps { position:absolute; inset:0; z-index: 6; pointer-events:none; }

         font-size:84px; font-weight:850; line-height:1.1; letter-spacing:-.02em; }
  .cap .w { display:inline-block; padding:0 .14em; --hl:0; position:relative;
            color: color-mix(in oklab, #10203a calc(var(--hl) * 100%), #ffffff);
            text-shadow: 0 4px 0 rgb(0 0 0 / calc(.55 - var(--hl) * .55)), 0 8px 30px rgb(0 0 0 / calc(.5 - var(--hl) * .5)); }
  .pill { position:absolute; left:0; top:.02em; height:1.08em; border-radius:.22em; z-index:-1; background: var(--accent);
          box-shadow: 0 10px 40px rgb(255 210 63 / .45); }
</style>

<script>
/* ---------------- sky: the story shows in the stars ---------------- */
const VANISH = 2.3, BACK = 42.9;
const sky = document.getElementById('sky'), ST = [];
for (let i = 0; i < 140; i++) { const d = document.createElement('div'); d.className = 'star';
  const s = 2 + gm.random('ss' + i) ** 3 * 6; d.style.width = d.style.height = s + 'px';
  let y = gm.random('sy' + i) * 1920, k = 0; while (((y > 270 && y < 660) || (y > 1220 && y < 1430)) && k < 20) y = gm.random('sy' + i + '-' + (++k)) * 1920;
  d.style.left = gm.random('sx' + i) * 1080 + 'px'; d.style.top = y + 'px';
  if (s > 5) d.style.boxShadow = '0 0 10px #fff'; sky.append(d);
  ST.push({ el: d, bright: gm.random('sb' + i), ph: gm.random('sp' + i) * 6.28, sp: 1 + gm.random('sv' + i) * 3 }); }
gm.onFrame(t => {
  // 0 = moonlit, 1 = moonless; back to moonlit at the end
  const dark = gm.interpolate(t, [VANISH, VANISH + 1.2, 6.2, 7, BACK, BACK + 1.5], [0, .55, .55, 1, 1, 0], { easing: 'in-out-cubic' });
  const top = gm.color.mix('#173a7a', '#03040c', dark), bot = gm.color.mix('#0a1838', '#010207', dark);
  sky.style.background = `radial-gradient(1300px 900px at 70% 35%, ${gm.color.mix('#2a4f96', '#0a0d22', dark)}, transparent 70%), linear-gradient(${top}, ${bot})`;
  ST.forEach((s, i) => { const visible = s.bright > .62 - dark * .62; const tw = .55 + .45 * Math.sin(t * s.sp + s.ph);
    s.el.style.opacity = visible ? tw * (.45 + dark * .55) : 0; });
});

/* ---------------- helpers ---------------- */
const enter = (tl, sel, at, o = {}) => tl.from(sel, { y: 160, opacity: 0, scale: .85, filter: 'blur(14px)', duration: .55, ease: 'expo.out', stagger: .08, ...o }, at);
const leave = (tl, sel, at) => tl.to(sel, { y: -220, opacity: 0, duration: .32, ease: 'power2.in' }, at);
const swapOut = (tl, sel, at) => tl.to(sel, { y: -120, opacity: 0, filter: 'blur(10px)', duration: .28, ease: 'power2.in' }, at);
const NS = 'http://www.w3.org/2000/svg';

gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const W = (txt, n = 1) => { let c = 0; for (const w of words) if (norm(w.word) === norm(txt) && ++c === n) return w.start; throw new Error('word ' + txt + ' ' + n); };
  const G = { global: true };

  /* status pill */
  const st = gm.timeline(null, G);
  st.set('#stxt', { textContent: 'SIN LUNA · NOCHE 1' }, VANISH + .3)
    .fromTo('#status i', { opacity: 1 }, { opacity: .15, duration: .4 }, VANISH)
    .set('#stxt', { textContent: 'SIN LUNA · +1 M AÑOS' }, W('millones') - .1)
    .fromTo('#status', { scale: 1 }, { scale: 1.12, duration: .2, ease: 'back.out(3)', yoyo: true, repeat: 1, transformOrigin: '100% 50%' }, W('millones') - .1)
    .set('#stxt', { textContent: 'LUNA' }, BACK + .3)
    .to('#status i', { opacity: 1, duration: .5 }, BACK + .3);

  /* S1 hook: title on frame 0, moon dissolves on "noche" */
  const t1 = gm.timeline('#s1', G);
  t1.fromTo('#s1 .hl .w', { y: 40, scale: 1.12 }, { y: 0, scale: 1, duration: .7, ease: 'expo.out', stagger: .08 }, 0)
    .fromTo('#moon1', { y: 80, scale: .9 }, { y: 0, scale: 1, duration: 1.6, ease: 'power3.out' }, 0)
    .to('#s1 .hl em', { color: '#ff6b5b', duration: .2 }, W('desapareciera'))
    .to('#m1', { scale: 1.06, duration: .25, ease: 'power2.out', transformOrigin: '0 0' }, VANISH - .3)
    .to('#m1', { scale: 0, opacity: 0, filter: 'blur(20px)', duration: .45, ease: 'power3.in', transformOrigin: '0 0' }, VANISH - .05);
  gm.burst('#s1', { at: VANISH + .3, kind: 'dust', x: '50%', y: '52.5%', count: 120, speed: 700, size: 9, colors: ['#f3efe2', '#e6e0cd', '#ffffff'], duration: 2.2, global: true });
  leave(t1, '#s1 .hl', 3.13);

  /* S2 dark sky */
  const s2 = 3.3, t2 = gm.timeline('#s2', G);
  enter(t2, '#s2 .hl .w', s2 + .05);
  t2.from('#land', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s2)
    .to('#unlit', { opacity: 1, duration: .9, ease: 'sine.inOut' }, W('oscuro') - .5)
    .to('#s2 .hl em', { scale: 1.12, duration: .25, ease: 'back.out(3)', transformOrigin: '50% 60%' }, W('oscuro') - .05);
  leave(t2, ['#s2 .hl', '#land'], 7.43);

  /* S3 tides */
  const s3 = 7.6, t3 = gm.timeline('#s3', G);
  enter(t3, '#t3a .w', s3 + .1);
  t3.from('#tides', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s3)
    .fromTo('#bulge', { scaleX: .85, scaleY: 1 }, { scaleX: 1, scaleY: .92, duration: .9, ease: 'sine.inOut', transformOrigin: '50% 50%' }, W('mareas') - .2)
    .from('#ghost3 .in', { scale: 0, opacity: 0, duration: .5, ease: 'back.out(2)' }, W('luna', 2) - .2)
    .from('#pull path', { draw: 0, duration: .35, ease: 'power3.out', stagger: .1 }, W('tira') - .1)
    .to('#pull', { x: 22, duration: .35, ease: 'sine.inOut', yoyo: true, repeat: 3 }, W('tira') + .3)
    .to('#ghost3 .body', { opacity: 0, duration: .4 }, W('sin') - .1)
    .to('#ghost3 .in, #pull', { opacity: 0, scale: .6, duration: .5, ease: 'power2.in', transformOrigin: '50% 50%' }, W('ella') + .2)
    .to('#bulge', { scaleX: .74, scaleY: .9, duration: 1.2, ease: 'power3.inOut', transformOrigin: '50% 50%' }, W('ella'))
    .from('#sun3 .in', { scale: 0, opacity: 0, duration: .55, ease: 'back.out(1.8)' }, W('sol') - .2)
    .to('#bulge', { scaleX: .82, duration: .6, ease: 'sine.inOut', transformOrigin: '50% 50%' }, W('sol') + .2);
  swapOut(t3, '#t3a', W('casi') - .2);
  t3.from('#t3b .w', { y: 120, scale: 1.4, opacity: 0, filter: 'blur(14px)', duration: .45, ease: 'expo.out', stagger: .12 }, W('tres') - .2);
  leave(t3, ['#t3b', '#tides'], 18.85);

  /* S4 corals */
  const s4 = 19.1, t4 = gm.timeline('#s4', G);
  const corals = document.getElementById('corals'), eggs = document.getElementById('eggs');
  const CO = [[140, '#ff7ab6'], [300, '#ff9a5c'], [470, '#ff6b5b'], [640, '#ff7ab6'], [800, '#ffb35c'], [960, '#ff9a5c']];
  CO.forEach(([x, c], i) => { const h = 150 + gm.random('ch' + i) * 120;
    [[0, 0], [-1, .45], [1, .6], [-1, .8]].forEach(([dir, f], j) => { const p = document.createElementNS(NS, 'path');
      const y0 = 590 - (j ? h * f * .6 : 0);
      p.setAttribute('d', j ? `M${x} ${y0} q${dir * 30} -20 ${dir * 50} -${70 + j * 10}` : `M${x} 590 Q${x + 10} ${590 - h / 2} ${x} ${590 - h}`);
      p.setAttribute('stroke', c); p.setAttribute('stroke-width', j ? 18 : 26); p.setAttribute('class', 'cb'); corals.append(p); }); });
  for (let i = 0; i < 40; i++) { const e = document.createElementNS(NS, 'circle'); const c = CO[i % 6];
    e.setAttribute('cx', c[0] + (gm.random('ex' + i) - .5) * 80); e.setAttribute('cy', 430 - gm.random('ey' + i) * 60);
    e.setAttribute('r', 6 + gm.random('er' + i) * 6); e.setAttribute('fill', '#ffe1ef'); e.setAttribute('class', 'egg'); eggs.append(e); }
  enter(t4, '#s4 .hl .w', s4 + .1);
  t4.from('#reef', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s4)
    .from('#corals .cb', { draw: 0, duration: .6, ease: 'power3.out', stagger: .02 }, W('corales') - .2)
    .from('#ghost4 .in', { scale: 0, opacity: 0, duration: .55, ease: 'back.out(1.8)' }, W('luz') - .3)
    .from('#ghost4 .body', { opacity: 0, duration: .4 }, W('llena') - .2)
    .from('#ghost4 .halo', { opacity: 0, scale: .5, duration: .6, ease: 'expo.out' }, W('llena') - .2)
    .from('#eggs .egg', { opacity: 0, scale: 0, duration: .3, ease: 'back.out(2)', stagger: { each: .02, from: 'random' }, transformOrigin: '50% 50%' }, W('llena'))
    .to('#eggs .egg', { y: -260, duration: 1.4, ease: 'sine.out', stagger: { each: .02, from: 'random' } }, W('llena') + .1);
  leave(t4, ['#s4 .hl', '#reef'], 25.85);

  /* S5 tilt → wobble → seasons */
  const s5 = 26.1, t5 = gm.timeline('#s5', G);
  const wobbleAt = W('tambalearse') - .2;
  t5.from('#tilt', { y: 300, opacity: 0, duration: .7, ease: 'expo.out' }, s5)
    .from('#axis', { draw: 0, duration: .6, ease: 'power3.out' }, W('inclinación') - .3)
    .from('#tiltdeg', { x: 60, opacity: 0, duration: .45, ease: 'expo.out' }, W('inclinación') - .1);
  enter(t5, '#t5a .w', W('estabiliza') - .5);
  swapOut(t5, '#t5a', W('sin', 2) - .2);
  t5.to('#orbitBack, #orbitFront, #moon5', { opacity: 0, duration: .5, ease: 'power2.in' }, W('sin', 2));
  t5.from('#t5b .w', { y: 120, scale: 1.4, opacity: 0, filter: 'blur(14px)', duration: .45, ease: 'expo.out', stagger: .1 }, W('tambalearse') - .3);
  swapOut(t5, ['#t5b', '#tiltdeg'], W('estaciones') - .3);
  t5.to('#seasons', { opacity: .85, duration: .6, ease: 'sine.inOut' }, W('estaciones'))
    .from('#t5c .w', { y: 120, scale: 1.4, opacity: 0, filter: 'blur(14px)', duration: .45, ease: 'expo.out', stagger: .1 }, W('extremas') - .45);
  const earth5 = document.getElementById('earth5'), moon5 = document.getElementById('moon5'), deg = document.getElementById('deg');
  gm.onFrame('#s5', (l, info) => { const t = info.time;
    const amp = gm.interpolate(t, [wobbleAt, wobbleAt + 1.2, 39.4], [0, 32, 26], { easing: 'out-cubic' });
    const ang = 23.4 + amp * Math.sin((t - wobbleAt) * 5.2) + amp * .3 * Math.sin((t - wobbleAt) * 11);
    earth5.setAttribute('transform', `rotate(${ang})`);
    deg.textContent = ang.toFixed(1).replace('.', ',');
    const a = (t - s5) * 1.4; moon5.setAttribute('transform', `translate(${Math.cos(a) * 400} ${Math.sin(a) * 90})`);
    moon5.style.visibility = Math.sin(a) < 0 && Math.abs(Math.cos(a) * 400) < 200 ? 'hidden' : 'visible'; });
  leave(t5, ['#t5c', '#tilt'], 39.15);

  /* S6 eclipse */
  const s6 = 39.4, t6 = gm.timeline('#s6', G);
  enter(t6, '#s6 .hl .w', s6 + .1);
  t6.from('#sun6', { scale: .4, opacity: 0, duration: .6, ease: 'expo.out' }, s6)
    .fromTo('#shadow6', { x: 520, opacity: 1 }, { x: 0, duration: 1.1, ease: 'power3.inOut' }, s6 + .3)
    .to('#shadow6', { opacity: 0, scale: 1.2, duration: .4, ease: 'power2.in', transformOrigin: '50% 50%' }, W('siempre') - .3)
    .from('#xmark path', { draw: 0, duration: .25, ease: 'power3.out', stagger: .12 }, W('siempre') - .1);
  leave(t6, ['#s6 .hl', '#eclipse'], 42.65);

  /* S7 moon returns */
  const s7 = 42.8, t7 = gm.timeline('#s7', G);
  t7.from('#moon7', { y: 700, scale: .6, duration: 1.1, ease: 'expo.out' }, s7)
    .to('#moon7', { y: -30, scale: 1.04, duration: 4, ease: 'sine.inOut' }, s7 + 1.1);
  enter(t7, '#s7 .hl .w', W('importante') - .6);
  t7.to('#s7 .hl em', { scale: 1.1, duration: .25, ease: 'back.out(3)', transformOrigin: '50% 60%' }, W('importante') - .05);
  leave(t7, ['#s7 .hl'], 47.85);
  t7.to('#moon7', { y: -380, scale: .35, opacity: .5, duration: .7, ease: 'power3.inOut' }, 47.7);

  /* S8 end */
  const s8 = 48.1, t8 = gm.timeline('#s8', G);
  enter(t8, '#s8 .hl .w', s8 + .05, { stagger: .12 });
  t8.from('#s8 .sub', { y: 40, opacity: 0, duration: .45, ease: 'power3.out' }, W('cuéntamelo') - .2)
    .from('#brand', { y: 40, opacity: 0, letterSpacing: '.4em', duration: .8, ease: 'expo.out' }, W('cuéntamelo') + .3)
    .to('#s8 .hl', { scale: 1.04, duration: 4.5, ease: 'sine.inOut' }, s8 + .6)
    .from('#moon8', { y: 500, duration: 1.2, ease: 'expo.out' }, s8)
    .to('#moon8', { y: -40, duration: 4, ease: 'sine.inOut' }, s8 + 1.2);

  /* ---------------- captions (whole video) ---------------- */
  const ws = words.map(w => ({ text: w.word, start: w.start, end: w.end }));
  const phrases = [[]];
  ws.forEach((w, i) => { const cur = phrases.at(-1), prev = ws[i - 1];
    if (cur.length && (cur.length === 3 || cur.map(x => x.text).join(' ').length + w.text.length > 17 || w.start - prev.end > .28 || /[.!?,:…]$/.test(prev.text) || /^¿/.test(w.text))) phrases.push([]);
    phrases.at(-1).push(w); });
  const tl = gm.timeline(null, G);
  const caps = phrases.map(ph => { const el = document.createElement('div'); el.className = 'cap';
    el.innerHTML = '<i class="pill"></i>' + ph.map(w => `<span class="w">${w.text}</span>`).join(' ');
    document.getElementById('caps').append(el); return el; });
  return document.fonts.ready.then(() => phrases.forEach((ph, p) => {
    const el = caps[p], spans = el.querySelectorAll('.w'), pill = el.querySelector('.pill'), next = phrases[p + 1];
    const box = i => ({ x: spans[i].offsetLeft, width: spans[i].offsetWidth });
    tl.fromTo(pill, { ...box(0), scale: .5, opacity: 0 }, { scale: 1, opacity: 1, duration: .2, ease: 'back.out(2)' }, ph[0].start - .04);
    ph.forEach((w, i) => {
      tl.fromTo(spans[i], { opacity: 0, y: 36, scale: .7 }, { opacity: 1, y: 0, scale: 1, duration: .26, ease: 'back.out(2.2)' }, w.start - .06);
      if (i) tl.to(pill, { ...box(i), duration: .12, ease: 'power3.out' }, w.start - .1);
      tl.to(spans[i], { '--hl': 1, scale: 1.06, duration: .06 }, w.start - .03)
        .to(spans[i], { '--hl': 0, scale: 1, duration: .06 }, ph[i + 1] ? ph[i + 1].start - .1 : Math.min(w.end + .3, next ? next[0].start - .2 : 99));
    });
    if (!next) tl.to(el, { opacity: 0, duration: .25, ease: 'power2.in' }, ph.at(-1).end + .6);
    else tl.to(el, { y: -50, opacity: 0, duration: .2, ease: 'power2.in' }, next[0].start - .22);
  }));
}));
