<!doctype html>
<!-- Cleopatra: la última reina de Egipto · Capítulo 2 · Reina a los 18: muere su padre (51 a. C.), reina con su hermano Ptolomeo XIII, los consejeros la apartan, huye, reúne un ejército, frente a frente, llega César. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="42.21">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script><script src="lib/egypt.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.55"></audio>
<section class="scene" id="two" data-start="3.6" data-duration="15.67"></section>
<section class="scene" id="adv" data-start="19.17" data-duration="8.55"></section>
<section class="scene" id="army" data-start="27.62" data-duration="8.18"></section>
<section class="scene" id="hk" data-start="35.7" data-duration="6.51"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4, D = 42.21, S = {two: 3.6, adv: 19.17, army: 27.62, hk: 35.7};
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), $ = id => document.getElementById(id), mk = CM.mk;
  const svgOf = (id, bg) => CM.svgIn($(id), bg);
  Object.keys(S).slice(1).forEach(id => tl.from($(id), { opacity: 0, duration: .35 }, S[id]));
  const nxt = id => { const k = Object.keys(S), i = k.indexOf(id); return i + 1 < k.length ? S[k[i + 1]] : D; };
  const hd = (title, sub, at, end) => CM.head(H, tl, title, sub, at, end);
  const big = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'big', html, top, extra); tl.from(t, { scale: 1.3, opacity: 0, duration: .4, ease: 'expo.out' }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const mid = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'mid', html, top, extra); tl.from(t, { y: 20, opacity: 0, duration: .35 }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const stamp = (id, txt, at, top = 420, col = '#E5484D') => { const t = CM.text($(id), 'big', `<span style="border:12px solid ${col};border-radius:20px;padding:0 40px;color:${col}">${txt}</span>`, top, 'font-size:150px;transform:rotate(-8deg)'); tl.from(t, { scale: 2, opacity: 0, duration: .3, ease: 'back.out(2)' }, at); return t; };
  const push = (id, from = 1.15, to = 1, ox = '50%', oy = '50%') => { const s = $(id).querySelector('svg'); tl.fromTo(s, { scale: from }, { scale: to, duration: nxt(id) - S[id], ease: 'none', transformOrigin: `${ox} ${oy}` }, S[id]); };
  const ender = (id, q, at, sub = 'CUÉNTAMELO EN LOS COMENTARIOS') => { const end = document.createElement('div'); end.style.cssText = 'position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(1200px 800px at 50% 45%, #1d2a5a, #050a1a 75%)';
    end.innerHTML = `<div style="font:400 120px/1 'Bebas Neue';text-align:center">${q}</div><div style="font:800 40px Inter;letter-spacing:.06em">${sub}</div><div style="margin-top:30px;padding:22px 60px;border-radius:16px;background:#d0312d;font:800 44px Inter;letter-spacing:.08em">SUSCRÍBETE</div><div style="margin-top:20px;font:400 90px Bebas Neue;letter-spacing:.14em">CURIOSI<span style="color:#FFD23F">MUNDO</span></div>`;
    $(id).append(end); const c = end.children;
    tl.from(end, { opacity: 0, duration: .5 }, at).from(c[0], { scale: 1.2, opacity: 0, duration: .5, ease: 'expo.out' }, at + .1).from(c[1], { y: 20, opacity: 0, duration: .3 }, W('cuéntamelo') - .2)
      .from(c[2], { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('suscríbete') - .2).to(c[2], { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W('suscríbete') + .3)
      .from(c[3], { y: 30, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('curiosimundo') - .2); };
    const shake = (el, at, amp = 14) => tl.to(el, { x: amp, duration: .06 }, at).to(el, { x: -amp, duration: .08 }, at + .06).to(el, { x: amp * .5, duration: .08 }, at + .14).to(el, { x: 0, duration: .08 }, at + .22);

  const fig = (s, kind, x, y, sc = 2.4, dir = 1, o = {}) => { const f = EG.person(s, kind, o); EG.place(f, x, y, sc, dir); return f; };
  const walk = (sec, f, x0, x1, t0, t1, y, sc = 2.4, dir = 1, run = 1) => gm.onFrame($(sec), (l, i) => { const k = gm.clamp((i.time - t0) / (t1 - t0)); EG.pose(f, { x: x0 + (x1 - x0) * k, y, s: sc, dir, run: k > 0 && k < 1 ? run : 0, ph: i.time * 8 }); });
  const row = (s, kind, n, x0, dx, y, sc = 1.6, dir = 1) => Array.from({ length: n }, (_, i) => fig(s, kind, x0 + i * dx, y + (i % 2) * 24, sc, dir));
  const march = (sec, F, t0, t1, sp, y0, sc, dir, run = 1) => gm.onFrame($(sec), (l, i) => F.forEach((f, k) => { const d = gm.clamp(i.time - t0, 0, t1 - t0); EG.pose(f, { x: f.x0 + d * sp, y: y0 + (k % 2) * 24, s: sc, dir, run: i.time > t0 && i.time < t1 ? run : 0, ph: i.time * 8 + k }); }));
  const army = (s, kind, n, x0, dx, y0, sc, dir) => Array.from({ length: n }, (_, i) => { const f = EG.person(s, kind); f.x0 = x0 + i * dx; EG.pose(f, { x: f.x0, y: y0 + (i % 2) * 24, s: sc, dir }); return f; });
  const gold = el => el.setAttribute('style', 'filter: sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.05)');
  const PAL = id => { const s = svgOf(id); EG.palace(s); return s; };
  const NIGHTSEA = 'linear-gradient(#0a1430, #1d2a5a)';

  CM.card($('cards'), tl, 2, '51 a. C.', 'REINA A LOS 18', 0, 4);

  const zt = PAL('two'); fig(zt, 'cleo', 720, 900, 3); fig(zt, 'ptol', 1200, 900, 2.2, -1); EG.label(zt, 'CLEOPATRA · ~18 AÑOS', 720, 320, 56, '#FFD23F'); EG.label(zt, 'PTOLOMEO XIII · UN NIÑO', 1200, 480, 56, '#FFD23F');
  hd('<em>51 a. C.</em>', 'muere su padre', S.two + .3, W('reinar') - .3); hd('DOS <em>REYES</em>', 'hermana y hermano, juntos', W('reinar') - .2, S.adv);
  const za = PAL('adv'); const pt = fig(za, 'ptol', 1200, 900, 2.2, -1); const adv = [1340, 1460, 1060].map((x, k) => fig(za, 'cit', x, 900, 2.6, k === 2 ? 1 : -1)); adv.forEach(a => a.b.querySelectorAll('path')[0].setAttribute('fill', '#3a3048'));
  const cl = EG.person(za, 'cleo'); walk('adv', cl, 700, -200, W('huir') - .5, W('huir') + 2.2, 900, 3, -1);
  hd('LOS <em>CONSEJEROS</em>', 'querían el poder para ellos', S.adv + .3, W('huir') - .4); hd('TUVO QUE <em>HUIR</em>', 'de Alejandría', W('huir') - .3, S.army);
  const zr = svgOf('army'); EG.desert(zr); const A = army(zr, 'egs', 6, 80, 110, 900, 1.9, 1), B = army(zr, 'egs', 8, 1080, 110, 900, 1.9, -1); B.forEach(f => f.b.querySelectorAll('path')[0].setAttribute('fill', '#8a6a4a'));
  march('army', A, S.army + .5, S.army + 4, 40, 900, 1.9, 1, .7); march('army', B, S.army + .5, S.army + 4, -40, 900, 1.9, -1, .7); const cA = fig(zr, 'cleo', 130, 780, 1.6);
  hd('UN <em>EJÉRCITO</em>', 'reunido en la frontera', S.army + .3, W('frente') - .4); big('army', 'FRENTE A <em>FRENTE</em>', 120, W('frente') - .3, 'font-size:130px');
  const zk = svgOf('hk'); EG.sky(zk, '#7ab8e8', '#f4e2b8'); const sk = EG.sea(zk, 720, '#2a7ab0'); EG.city(zk, 720, 9); const gl = EG.galley(zk, { size: 1.3, sail: '#b3262d', rows: 2 });
  gm.onFrame($('hk'), (l, i) => { sk.anim(i.time); gl.w.setAttribute('transform', `translate(${-400 + (i.time - S.hk) * 220} 860)`); gl.anim(i.time); }); big('hk', '<em>JULIO CÉSAR</em>', 110, W('julio') - .3, 'font-size:160px');

  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
