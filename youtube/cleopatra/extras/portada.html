<!doctype html>
<!-- Portada de YouTube 1280×720: Cleopatra delante de las pirámides con barcos de velas púrpura. «CLEOPATRA · LA ÚLTIMA REINA». -->
<html data-width="1280" data-height="720" data-fps="30" data-duration="1">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script><script src="lib/egypt.js"></script>
<style>.t1{position:absolute;font:400 150px/.88 'Bebas Neue';color:#FFD23F;text-shadow:0 8px 0 #111,0 0 40px rgb(0 0 0 / .8);-webkit-text-stroke:4px #111}
.t1 span{color:#fff}.tag{position:absolute;left:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.12em;color:#fff;background:rgb(6 12 28 / .85);padding:10px 18px;border-radius:10px;border-left:6px solid #FFD23F}.tag span{color:#FFD23F}
.bd{position:absolute;right:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.08em;color:#111;background:#FFD23F;padding:10px 18px;border-radius:10px}</style></head>
<body>
<section class="scene" id="p" data-start="0" data-duration="1"></section>
<script>
const p = document.getElementById('p'), mk = CM.mk;
const s = mk('svg', { viewBox: '0 0 1920 1080', width: 1280, height: 720, style: 'position:absolute;inset:0' }, p); CM.defs(s);

EG.desert(s); EG.pyramids(s, 1300, 820, .9); const sea = EG.sea(s, 900, '#2a6fb0'); const gl = EG.galley(s, { size: .9, sail: '#7a1a8a', rows: 2 }); gl.w.setAttribute('transform', 'translate(560 980) scale(.8)');
const c = EG.person(s, 'cleo'); EG.place(c, 1440, 1060, 4.4);
p.insertAdjacentHTML('beforeend', '<div class="t1" style="left:40px;top:40px;width:820px">CLEOPATRA</div><div class="t1" style="left:40px;top:180px;font-size:90px;color:#fff">LA ÚLTIMA<br>REINA</div><div class="tag">CURIOSI<span>MUNDO</span></div>');
</script>
</body>
</html>
