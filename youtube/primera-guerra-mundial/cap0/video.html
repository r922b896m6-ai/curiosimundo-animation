<!doctype html>
<!-- Capítulo 0 · Introducción (gancho). Batalla al atardecer con artillería; "1914–1918", "65.000.000 de soldados"; título del vídeo. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="16.6">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="voz.mp3" data-start="0"></audio>
<audio src="musica.mp3" data-volume="0.55" data-duck="0.45" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.5"></audio>
<section class="scene" id="b" data-start="0" data-duration="9.4"></section>
<section class="scene" id="t" data-start="9.0" data-duration="7.6"></section>
<div class="vig"></div><div id="caps"></div>
<script>
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words), G = { global: true }, tl = gm.timeline(null, G);
  CM.battle(document.getElementById('b'), { id: 'b', left: 'UK', right: 'DE', terrain: 'dusk', t0: 0, t1: 9.4, n: 9, falls: [3, 6], mg: true,
    artillery: [0.2, 1.6, 3.1, 4.4, 5.9, 7.3, 8.6], melee: { at: 6.6, step: .5, weapons: ['rifle', 'club', 'shovel', 'fist'] }, labels: false, pan: [0, -1280] });
  const b = document.getElementById('b');
  const y = Object.assign(document.createElement('div'), { className: 'big', innerHTML: '1914 <em>–</em> 1918' }); y.style.top = '330px'; b.append(y);
  tl.fromTo(y, { scale: 1.25 }, { scale: 1, duration: .8, ease: 'expo.out' }, 0).to(y, { opacity: 0, y: -60, duration: .25 }, W('unos') - .3);
  const n = Object.assign(document.createElement('div'), { className: 'big', innerHTML: '<em>65.000.000</em>' }); n.style.top = '300px'; b.append(n);
  const n2 = Object.assign(document.createElement('div'), { className: 'mid', innerHTML: 'soldados <b>movilizados</b>' }); n2.style.top = '520px'; b.append(n2);
  tl.from(n, { scale: 1.5, opacity: 0, filter: 'blur(14px)', duration: .45, ease: 'expo.out' }, W('sesenta') - .3).from(n2, { y: 30, opacity: 0, duration: .35 }, W('soldados') - .2)
    .to([n, n2], { opacity: 0, y: -60, duration: .25 }, W('mundo') - .4);
  const m = Object.assign(document.createElement('div'), { className: 'mid', innerHTML: 'un mundo que <b>nunca volvió</b> a ser el mismo' }); m.style.top = '420px'; b.append(m);
  tl.from(m, { y: 30, opacity: 0, duration: .35 }, W('mundo') - .2);
  const t = document.getElementById('t'); t.style.background = 'radial-gradient(1200px 800px at 50% 45%, #163a78, #071330 75%)';
  t.innerHTML = '<div class="mid" style="top:250px;color:#FFD23F">CURIOSIMUNDO PRESENTA</div><div class="big" style="top:330px;font-size:190px">LA PRIMERA<br><em>GUERRA MUNDIAL</em></div><div class="mid" style="top:760px">cómo empezó · sus grandes batallas · cómo terminó</div>';
  const [p, h, s] = t.children;
  tl.from(t, { opacity: 0, duration: .4 }, 9.0).from(p, { y: 20, opacity: 0, duration: .4 }, 9.2).from(h, { scale: 1.3, opacity: 0, filter: 'blur(16px)', duration: .8, ease: 'expo.out' }, 9.4)
    .to(h, { scale: 1.05, duration: 6, ease: 'sine.inOut' }, 10.2).from(s, { y: 30, opacity: 0, duration: .4 }, W('cómo') - .2);
  return CM.captions(words);
}));
</script>
</body>
</html>
