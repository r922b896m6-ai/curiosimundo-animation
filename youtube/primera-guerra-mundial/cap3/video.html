<!doctype html>
<!-- Capítulo 3 · 1915: estancados. Ataque frustrado (UK14 vs DE14), gas en Ypres, vida en la trinchera, Galípoli (ANZAC vs otomanos), Italia, Lusitania. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="78.4">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.5"></audio>
<section class="scene" id="stal" data-start="3.6" data-duration="10.6"></section>
<section class="scene" id="gas" data-start="14.0" data-duration="10.5"></section>
<section class="scene" id="life" data-start="24.3" data-duration="8.0"></section>
<section class="scene" id="map" data-start="32.1" data-duration="9.1"></section>
<section class="scene" id="gal" data-start="40.9" data-duration="18.9"></section>
<section class="scene" id="map2" data-start="59.6" data-duration="7.0"></section>
<section class="scene" id="lus" data-start="66.4" data-duration="12.0"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4;
gm.wait(Promise.all([fetch('voz.json').then(r => r.json()), fetch('lib/europa.json').then(r => r.json())]).then(([words, geo]) => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), C = CM.MAPCOL, $ = id => document.getElementById(id);
  CM.card($('cards'), tl, 3, '1915', 'ESTANCADOS', 0, 4);
  /* failed attack across no man's land */
  CM.battle($('stal'), { id: 'st', left: 'UK14', right: 'DE14', terrain: 'mud', t0: 3.6, t1: 14.2, n: 8, falls: [0, 2, 3, 5, 6], mg: true, def: 4, artillery: [4.0, 5.6, 7.1, 8.9, 10.6, 12.2], pan: [0, -1280] });
  CM.head(H, tl, '1915 · <em>ESTANCADOS</em>', 'ametralladoras y alambre de púas', 4.2, 13.9);
  tl.from($('stal'), { opacity: 0, duration: .3 }, 3.6);
  /* gas at Ypres */
  const gs = CM.svgIn($('gas'), 'linear-gradient(#6b6f5a, #a8a582)'); CM.mk('rect', { y: 760, width: 1920, height: 320, fill: '#3b2d20' }, gs);
  for (let k = 0; k < 14; k++) CM.mk('rect', { x: 980 + k * 66, y: 730 - (k % 2) * 10, width: 70, height: 34, rx: 12, fill: '#8a7a58', stroke: '#5e5039', 'stroke-width': 3 }, gs);
  const sold = [0, 1, 2].map(i => CM.figure(gs, 'FR', { pack: false })), masked = [0, 1, 2].map(i => CM.figure(gs, 'FR', { pack: false, mask: true }));
  const gasF = CM.gas(gs, 15.0, 24.0, { x0: -300, y: 760, sp: 170, n: 22, spread: 400 });
  const mT = W('máscaras') - .2;
  gm.onFrame($('gas'), (l, info) => { const t = info.time; gasF(t); sold.forEach((f, i) => { CM.pose(f, { x: 1180 + i * 230, y: 800, s: 1.6, dir: -1 }); f.o.style.display = t < mT ? '' : 'none'; });
    masked.forEach((f, i) => { CM.pose(f, { x: 1180 + i * 230, y: 800, s: 1.6, dir: -1 }); f.o.style.display = t >= mT ? '' : 'none'; }); });
  CM.head(H, tl, 'YPRES · <em>GAS CLORO</em>', 'abril de 1915', W('abril') - .3, 24.2);
  tl.from($('gas'), { opacity: 0, duration: .3 }, 14.0);
  /* trench life */
  const ls = CM.svgIn($('life'), 'linear-gradient(#5d636d, #9a9c9a)'); CM.mk('path', { d: 'M0 300 L560 300 L600 820 L1320 820 L1360 300 L1920 300 L1920 1080 L0 1080Z', fill: '#3b2d20' }, ls);
  CM.mk('rect', { x: 600, y: 780, width: 720, height: 40, fill: '#7f97a0', opacity: .8 }, ls);
  const st = CM.figure(ls, 'UK14', { weapon: 'none' }); CM.pose(st, { x: 960, y: 800, s: 1.5, dir: 1 });
  const items = ['BARRO', 'RATAS', 'PIOJOS', 'FRÍO'].map((txt, i) => { const d = CM.text($('life'), 'big', txt, 330, `font-size:110px;left:${-1200 + i * 800}px;right:auto;width:600px`); return d; });
  const life = CM.text($('life'), 'mid', 'turnos entre <b>primera línea</b> y <b>retaguardia</b>', 500);
  [['barro', 0], ['ratas', 1], ['piojos', 2], ['frío', 3]].forEach(([w, i]) => tl.fromTo(items[i], { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: .3, ease: 'expo.out' }, W(w) - .15).to(items[i], { opacity: .25, duration: .3 }, W(w) + .7));
  items.forEach((d, i) => d.style.left = (160 + i * 420) + 'px');
  tl.from(life, { y: 30, opacity: 0, duration: .35 }, W('turnos') - .2).from($('life'), { opacity: 0, duration: .3 }, 24.3);
  CM.head(H, tl, 'LA VIDA EN LA <em>TRINCHERA</em>', '', 24.6, 32.0);
  /* map: Gallipoli */
  const m = CM.map($('map'), geo);
  m.color(tl, ['FRANCIA', 'RUSIA', 'REINO UNIDO', 'BÉLGICA', 'SERBIA', 'MONTENEGRO'], C.allies, 0, .01).color(tl, ['ALEMANIA', 'AUSTRIA-HUNGRÍA', 'IMPERIO OTOMANO', 'BULGARIA'], C.central, 0, .01).color(tl, 'ITALIA', '#58637a', 0, .01);
  tl.set(m.g, { x: 0, y: 0, scale: 1 }, 0); m.zoom(tl, 'Constantinopla', 2.3, 32.4, 2.5);
  m.pin(tl, 'Galípoli', 'GALÍPOLI', W('galípoli') - .3, null, { size: 22, fill: '#E5484D' }); m.line(tl, 'gallipoli', W('paso') - .6, { color: '#2f6fcf', width: 8, arrow: true, dur: 1.2 });
  m.text(tl, 'HACIA RUSIA', ...geo.cities['Constantinopla'].map((v, i) => v + (i ? -40 : 60)), W('rusia') - .2, null, { size: 22, fill: '#FFD23F' });
  CM.head(H, tl, 'EL IMPERIO <em>OTOMANO</em>', 'aliado de Alemania', W('otomano') - .3, 40.8);
  tl.from($('map'), { opacity: 0, duration: .3 }, 32.1);
  /* Gallipoli landing: ANZAC & British vs Ottomans, beach and hills */
  CM.battle($('gal'), { id: 'gp', left: 'ANZ', right: 'OT', terrain: 'beach', t0: 40.9, t1: 59.8, n: 8, falls: [1, 4, 6], mg: true, def: 4,
    artillery: [41.6, 43.4, 45.5, 47.8, 50.2, 53.0, 55.4], melee: { at: 51.5, step: .7 }, pan: [0, -1280] });
  const boats = CM.mk('g', {}, $('gal').querySelector('svg'));
  for (let i = 0; i < 3; i++) CM.mk('path', { d: `M${80 + i * 260} 760 l160 0 l-20 30 l-120 0z`, fill: '#5a4a33' }, boats);
  tl.to(boats, { x: -600, opacity: 0, duration: 4, ease: 'power1.in' }, 41.5);
  CM.head(H, tl, '<em>GALÍPOLI</em>', 'abril 1915 – enero 1916', 41.2, W('kemal') - .6);
  CM.head(H, tl, 'MUSTAFÁ <em>KEMAL</em>', 'los otomanos resisten en las colinas', W('kemal') - .4, 59.6);
  const ret = CM.text($('gal'), 'mid', 'tras más de 8 meses, <b>los aliados se retiran</b>', 320); tl.from(ret, { y: 30, opacity: 0, duration: .35 }, W('retiraron') - .8);
  tl.from($('gal'), { opacity: 0, duration: .3 }, 40.9);
  /* Italy joins the Allies */
  const m2 = CM.map($('map2'), geo);
  m2.color(tl, ['FRANCIA', 'RUSIA', 'REINO UNIDO', 'BÉLGICA', 'SERBIA', 'MONTENEGRO'], C.allies, 0, .01).color(tl, ['ALEMANIA', 'AUSTRIA-HUNGRÍA', 'IMPERIO OTOMANO', 'BULGARIA'], C.central, 0, .01).color(tl, 'ITALIA', '#58637a', 0, .01);
  tl.set(m2.g, { x: 960 - 1060 * 1.8, y: 540 - 640 * 1.8, scale: 1.8 }, 0);
  m2.color(tl, 'ITALIA', C.allies, W('italia') - .1, .6); m2.line(tl, 'isonzo', W('alpes') - .6, { color: '#FFD23F', width: 10, dur: .8 });
  m2.text(tl, 'FRENTE ITALIANO', ...geo.cities['Caporetto'].map((v, i) => v + (i ? -40 : 0)), W('alpes') - .3, null, { size: 24, fill: '#FFD23F' });
  CM.head(H, tl, 'ITALIA <em>CAMBIA DE BANDO</em>', 'mayo de 1915', W('italia') - .3, 66.4);
  tl.from($('map2'), { opacity: 0, duration: .3 }, 59.6);
  /* Lusitania */
  const lu = CM.svgIn($('lus'), 'linear-gradient(#8fa9c4, #d7dfe6 52%, #3a6a96 52%, #10325a)');
  const ship = CM.liner(lu), ub = CM.uboat(lu), torp = CM.mk('path', { d: 'M0 0 L1 0', stroke: '#e8f3ff', 'stroke-width': 6, 'stroke-dasharray': '18 12', fill: 'none' }, lu);
  const hit = W('hundió') - .2;
  gm.onFrame($('lus'), (l, info) => { const t = info.time, sink = gm.clamp((t - hit - .6) / 7);
    ship.setAttribute('transform', `translate(${1150} ${560 + sink * 220}) rotate(${sink * 14}) scale(.9)`); ship.setAttribute('opacity', 1 - sink * .4);
    ub.setAttribute('transform', `translate(300 ${640 + Math.sin(t) * 4}) scale(.7)`);
    const p = gm.clamp((t - (hit - 1.4)) / 1.4); torp.setAttribute('d', `M380 640 L${380 + p * 520} ${640 - p * 10}`); torp.setAttribute('opacity', t > hit - 1.4 && t < hit + .4 ? 1 : 0); });
  const ex = CM.explosion(lu, 920, 600, hit, 1.1, 'lus'); gm.onFrame($('lus'), (l, info) => ex(info.time));
  CM.head(H, tl, 'EL <em>LUSITANIA</em>', '7 de mayo de 1915', 66.7, 78.2);
  const toll = CM.text($('lus'), 'mid', '<b>1.198</b> muertos · <b>128</b> estadounidenses', 300); tl.from(toll, { y: 30, opacity: 0, duration: .35 }, W('murieron') - .3);
  tl.from($('lus'), { opacity: 0, duration: .3 }, 66.4);
  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
