<!doctype html>
<!-- Portada de YouTube 1280×720: soldado francés de 1914 frente a soldado alemán, explosión de fondo, "1914–1918 · EN 10 MINUTOS". -->
<html data-width="1280" data-height="720" data-fps="30" data-duration="1">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script>
<style>.t1{position:absolute;left:0;right:0;top:40px;text-align:center;font:400 190px/1 'Bebas Neue';color:#FFD23F;text-shadow:0 8px 0 #111,0 0 40px rgb(0 0 0 / .8);letter-spacing:.02em;-webkit-text-stroke:4px #111}
.t2{position:absolute;left:0;right:0;top:225px;text-align:center;font:400 96px/1 'Bebas Neue';color:#fff;text-shadow:0 6px 0 #111,0 0 30px rgb(0 0 0 / .9);-webkit-text-stroke:3px #111}
.tag{position:absolute;left:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.12em;color:#fff;background:rgb(6 12 28 / .85);padding:10px 18px;border-radius:10px;border-left:6px solid #FFD23F}
.tag span{color:#FFD23F}</style></head>
<body>
<section class="scene" id="p" data-start="0" data-duration="1"></section>
<script>
const p = document.getElementById('p');
const s = CM.mk('svg', { viewBox: '0 0 1280 720', width: 1280, height: 720, style: 'position:absolute;inset:0' }, p); CM.defs();
const g = CM.mk('linearGradient', { id: 'pg', x1: 0, y1: 0, x2: 0, y2: 1 }, CM.mk('defs', {}, s)); CM.mk('stop', { offset: 0, 'stop-color': '#3a2a20' }, g); CM.mk('stop', { offset: 1, 'stop-color': '#c46a2a' }, g);
CM.mk('rect', { width: 1280, height: 720, fill: 'url(#pg)' }, s);
CM.mk('circle', { cx: 640, cy: 520, r: 520, fill: 'url(#cmFlash)', opacity: .9 }, s);
for (let i = 0; i < 4; i++) CM.mk('circle', { cx: 380 + i * 170, cy: 470 - (i % 2) * 40, r: 140, fill: 'url(#cmSmoke)', opacity: .8 }, s);
CM.mk('path', { d: 'M0 600 Q640 560 1280 600 L1280 720 L0 720Z', fill: '#2a2017' }, s);
for (let i = 0; i < 18; i++) CM.mk('circle', { cx: 300 + gm.random('c' + i) * 680, cy: 330 + gm.random('d' + i) * 220, r: 6 + gm.random('e' + i) * 12, fill: '#2a2017' }, s);
const fr = CM.figure(s, 'FR14'), de = CM.figure(s, 'DE14');
CM.pose(fr, { x: 260, y: 740, s: 2.6, dir: 1, lean: 6 }); CM.pose(de, { x: 1020, y: 740, s: 2.6, dir: -1, lean: 6 });
CM.mk('use', { href: '#cmStar', transform: 'translate(640 410) scale(1.3)' }, s);
CM.flag(s, 'FR', 40, 330, 110, 72); CM.flag(s, 'DE', 1130, 330, 110, 72);
p.insertAdjacentHTML('beforeend', '<div class="t1">1914 – 1918</div><div class="t2">EN 10 MINUTOS</div><div class="tag">CURIOSI<span>MUNDO</span></div>');
</script>
</body>
</html>
