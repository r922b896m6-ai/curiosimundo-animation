<!doctype html>
<!-- WW2 · Capítulo 1 · El camino a la guerra (1919–1939): Versalles, Gran Depresión, totalitarismos, Hitler, anexiones, Múnich, Japón en China, el Eje, pacto germano-soviético, invasión de Polonia. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="90.4">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.5"></audio>
<section class="scene" id="map" data-start="3.6" data-duration="86.8"></section>
<section class="scene" id="ver" data-start="3.6" data-duration="6.0"></section>
<section class="scene" id="dep" data-start="9.5" data-duration="6.6"></section>
<section class="scene" id="pac" data-start="60.2" data-duration="5.8"></section>
<section class="scene" id="eje" data-start="65.9" data-duration="5.2"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4;
gm.wait(Promise.all([fetch('voz.json').then(r => r.json()), fetch('lib/europa1939.json').then(r => r.json()), fetch('lib/pacifico.json').then(r => r.json())]).then(([words, geo, pac]) => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), C = CM.MAPCOL, $ = id => document.getElementById(id);
  CM.card($('cards'), tl, 1, '1919 – 1939', 'EL CAMINO A LA GUERRA', 0, 4);
  /* Versailles */
  const d = CM.doc($('ver'), 'TRATADO DE VERSALLES', '1919', ['· culpa de la guerra', '· pérdida de territorios', '· enormes reparaciones']); $('ver').style.background = 'radial-gradient(1100px 800px at 50% 50%, #3a2f22, #120d08)';
  const hum = CM.text($('ver'), 'mid', 'Alemania, <b>humillada y resentida</b>', 860); tl.from(d, { y: 300, rotate: 6, duration: .6, ease: 'expo.out' }, 4.0).from(hum, { y: 30, opacity: 0, duration: .35 }, W('humillada') - .3);
  /* Great Depression */
  const ds = CM.svgIn($('dep'), 'linear-gradient(#5a5f68, #9a9c9a)'); CM.mk('rect', { y: 860, width: 1920, height: 220, fill: '#3a3a3e' }, ds);
  for (let i = 0; i < 12; i++) CM.civil(ds, 160 + i * 140, 900, 1.25, ['#3a3f48', '#4a3f35', '#2f3a42'][i % 3]);
  const ch = CM.mk('path', { d: 'M1100 180 L1250 220 L1350 200 L1450 330 L1560 420 L1700 600', stroke: '#E5484D', 'stroke-width': 14, fill: 'none', 'stroke-linecap': 'round' }, ds);
  CM.mk('path', { d: 'M1100 160 V620 H1760', stroke: '#fff', 'stroke-width': 5, fill: 'none' }, ds);
  tl.from($('dep'), { opacity: 0, duration: .3 }, 9.5).from(ch, { draw: 0, duration: 1.4, ease: 'power2.in' }, 10.2);
  CM.head(H, tl, '1929 · LA GRAN <em>DEPRESIÓN</em>', 'millones de personas sin trabajo', 10.0, 16.0);
  /* map: totalitarian regimes, Hitler, expansion */
  const m = CM.map($('map'), geo); tl.set(m.g, { x: 0, y: 0, scale: 1 }, 0);
  m.color(tl, 'ITALIA', '#8f3a3a', W('mussolini') - .2); m.pin(tl, 'Roma', 'MUSSOLINI', W('mussolini') - .1, W('rearmó') - .3, { size: 30 });
  m.color(tl, 'ALEMANIA', C.central, W('hitler') - .2); m.pin(tl, 'Berlín', 'HITLER · 1933', W('hitler') - .1, W('rearmó') - .3, { size: 30 });
  CM.head(H, tl, 'LOS <em>TOTALITARISMOS</em>', 'Italia · Alemania', W('caos') - .4, W('muchos') - .3);
  CM.head(H, tl, 'TRABAJO Y <em>ORGULLO</em>', 'la promesa de Hitler', W('muchos') - .2, W('nazis') - .3);
  CM.head(H, tl, 'LA DICTADURA <em>NAZI</em>', 'fin de la democracia · persecución', W('nazis') - .2, W('rearmó') - .3);
  m.line(tl, 'barbC', W('espacio') - .3, { color: '#E5484D', width: 8, dash: '16 12', arrow: true, dur: 1.4, end: W('rearmó') - .3 });
  m.text(tl, '«ESPACIO VITAL»', ...geo.cities['Varsovia'].map((v, i) => v + (i ? -50 : 120)), W('espacio') - .1, W('rearmó') - .3, { size: 30, fill: '#FFD23F' });
  m.zoom(tl, 'Praga', 2.2, W('rearmó') - .3, 1.4);
  m.pin(tl, 'Viena', 'AUSTRIA · 1938', W('austria') - .2, 60.0, { size: 22, fill: '#E5484D' }); m.pin(tl, 'Praga', 'SUDETES · 1938', W('sudetes') - .2, 60.0, { size: 22, fill: '#E5484D' });
  CM.head(H, tl, 'LA <em>EXPANSIÓN</em>', 'Austria y los Sudetes · 1938', W('rearmó') - .2, W('múnich') - .4);
  m.pin(tl, 'Múnich', 'MÚNICH', W('múnich') - .2, 60.0, { size: 22 }); m.color(tl, 'ESLOVAQUIA', C.central, W('marzo') - .1);
  CM.head(H, tl, 'EL ACUERDO DE <em>MÚNICH</em>', 'ceder para evitar la guerra… · marzo 1939: cae Checoslovaquia', W('múnich') - .2, 60.0);
  /* Asia */
  const pm = CM.map($('pac'), pac); tl.set(pm.g, { x: 960 - 560 * 2.2, y: 540 - 330 * 2.2, scale: 2.2 }, 0);
  pm.color(tl, 'JAPÓN', C.central, 60.3, .01); pm.color(tl, 'CHINA', '#c9a24a', W('china') - .2);
  pm.pin(tl, 'Manchuria', 'MANCHURIA · 1931', W('manchuria') - .2, null, { size: 16, fill: '#E5484D' }); pm.pin(tl, 'Nankín', 'CHINA · 1937', W('china') - .1, null, { size: 16, fill: '#E5484D' });
  CM.head(H, tl, 'JAPÓN EN <em>CHINA</em>', '1931 – 1937', 60.4, 65.9); tl.from($('pac'), { opacity: 0, duration: .3 }, 60.2);
  /* the Axis */
  const es = CM.svgIn($('eje'), 'radial-gradient(1100px 800px at 50% 50%, #3a1c1c, #120808)');
  [['DE2', 'ALEMANIA'], ['IT', 'ITALIA'], ['JP', 'JAPÓN']].forEach(([f, n], i) => { const g = CM.mk('g', { class: 'ax' }, es); CM.flag(g, f, 360 + i * 460, 380, 280, 186);
    const t = CM.mk('text', { x: 500 + i * 460, y: 650, 'text-anchor': 'middle', 'font-family': 'Bebas Neue', 'font-size': 70, fill: '#fff' }, g); t.textContent = n; });
  CM.head(H, tl, 'EL <em>EJE</em>', 'Alemania · Italia · Japón', 66.1, 71.0);
  tl.from($('eje'), { opacity: 0, duration: .3 }, 65.9).from(es.querySelectorAll('.ax'), { y: 80, opacity: 0, duration: .45, stagger: .25, ease: 'back.out(1.6)' }, W('alemania', 4) - .2);
  /* Hitler–Stalin pact, Poland */
  m.zoom(tl, 'Varsovia', 1.6, 71.0, .01); m.color(tl, 'URSS', '#9a5a5a', W('stalin') - .2);
  const split = CM.mk('path', { d: (() => { const [x, y] = geo.cities['Varsovia']; return `M${x + 60} ${y - 220} L${x + 30} ${y} L${x + 70} ${y + 220}`; })(), stroke: '#FFD23F', 'stroke-width': 8, 'stroke-dasharray': '16 12', fill: 'none' }, m.over);
  tl.from(split, { draw: 0, duration: 1, ease: 'power2.inOut' }, W('repartirse') - .4);
  CM.head(H, tl, 'PACTO <em>HITLER – STALIN</em>', '23 de agosto de 1939 · reparto secreto de Polonia', W('agosto') - .4, 80.4);
  m.color(tl, 'POLONIA', '#c97a3a', W('invadió') - .2); m.line(tl, 'polonia1', W('invadió') - .2, { color: '#E5484D', width: 12, arrow: true, dur: 1 }); m.line(tl, 'polonia2', W('invadió'), { color: '#E5484D', width: 12, arrow: true, dur: 1 });
  m.color(tl, ['FRANCIA', 'REINO UNIDO'], C.allies, W('declararon') - .2);
  CM.head(H, tl, '1 DE SEPTIEMBRE DE <em>1939</em>', 'Alemania invade Polonia · Francia y el Reino Unido declaran la guerra', 80.5, 90.2);
  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
