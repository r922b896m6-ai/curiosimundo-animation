<!doctype html>
<!-- WW2 · Capítulo 2 · 1939–1940: guerra relámpago, Polonia, guerra de broma, Ardenas y Maginot, Dunkerque (retirada), Compiègne, Churchill, batalla de Inglaterra (aviones derribados), Italia, el Blitz. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="99.7">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.5"></audio>
<section class="scene" id="map" data-start="3.6" data-duration="96.1"></section>
<section class="scene" id="blitz" data-start="3.6" data-duration="9.4"></section>
<section class="scene" id="phoney" data-start="18.5" data-duration="5.2"></section>
<section class="scene" id="dun" data-start="41.6" data-duration="11.4"></section>
<section class="scene" id="comp" data-start="52.8" data-duration="10.6"></section>
<section class="scene" id="bob" data-start="76.6" data-duration="9.6"></section>
<section class="scene" id="lon" data-start="90.7" data-duration="9.0"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4;
gm.wait(Promise.all([fetch('voz.json').then(r => r.json()), fetch('lib/europa1939.json').then(r => r.json())]).then(([words, geo]) => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), C = CM.MAPCOL, $ = id => document.getElementById(id);
  CM.card($('cards'), tl, 2, '1939 – 1940', 'LA GUERRA RELÁMPAGO', 0, 4);
  /* Blitzkrieg: tanks + Stukas + infantry */
  CM.tanks($('blitz'), 3.6, { n: 3, inf: 'DE2', planes: true, ww2: { color: '#5f6450', mark: 'cross', pc: '#7a7f86', pm: 'cross' }, sky: 'linear-gradient(#8fa3b8, #d9cfb4)' });
  CM.head(H, tl, 'LA GUERRA <em>RELÁMPAGO</em>', 'tanques · aviones · infantería', 4.3, 12.9);
  /* map */
  const m = CM.map($('map'), geo); tl.set(m.g, { x: 960 - 1050 * 1.7, y: 540 - 520 * 1.7, scale: 1.7 }, 0);
  m.color(tl, ['ALEMANIA', 'ESLOVAQUIA'], C.central, 0, .01).color(tl, ['FRANCIA', 'REINO UNIDO'], C.allies, 0, .01).color(tl, 'URSS', '#9a5a5a', 0, .01).color(tl, 'ITALIA', '#8f3a3a', 0, .01);
  m.line(tl, 'polonia1', 13.2, { color: '#E5484D', width: 12, arrow: true, dur: .8 }); m.line(tl, 'polonia2', 13.4, { color: '#E5484D', width: 12, arrow: true, dur: .8 });
  m.line(tl, 'polonia3', W('este') - .3, { color: '#9a5a5a', width: 12, arrow: true, dur: .8 }); m.color(tl, 'POLONIA', '#6a4a4a', W('semanas') - .2);
  CM.head(H, tl, 'CAE <em>POLONIA</em>', 'septiembre de 1939', 13.3, 18.5);
  /* phoney war */
  const ps = CM.svgIn($('phoney'), 'linear-gradient(#8fa3b8, #d9d2bc)'); CM.mk('rect', { y: 800, width: 1920, height: 280, fill: '#6b7a48' }, ps);
  CM.mk('path', { d: 'M500 800 L560 640 L1360 640 L1420 800Z', fill: '#8a8a80', stroke: '#5a5a52', 'stroke-width': 6 }, ps); CM.mk('rect', { x: 880, y: 690, width: 160, height: 34, fill: '#2a2a2a' }, ps);
  [380, 1500, 1640].forEach((x, i) => { const f = CM.figure(ps, i ? 'FR40' : 'UK'); CM.pose(f, { x, y: 860, s: 1.5, dir: i ? -1 : 1 }); });
  CM.head(H, tl, '«LA GUERRA DE <em>BROMA</em>»', 'meses de calma tensa en el oeste', 18.7, 23.6); tl.from($('phoney'), { opacity: 0, duration: .3 }, 18.5);
  /* west: Ardennes, Maginot */
  m.zoom(tl, 'Sedán', 2.6, 23.6, .01);
  m.color(tl, ['PAÍSES BAJOS', 'BÉLGICA'], '#7a5a5a', W('mayo') + .3); m.line(tl, 'ardenas', W('ardenas') - .3, { color: '#E5484D', width: 14, arrow: true, dur: 1.6 });
  m.pin(tl, 'Sedán', 'LAS ARDENAS', W('ardenas') - .2, 41.4, { size: 16 });
  CM.head(H, tl, 'MAYO DE <em>1940</em>', 'Países Bajos · Bélgica · Francia', W('mayo') - .3, W('maginot') - .3);
  m.line(tl, 'maginot', W('maginot') - .2, { color: '#2f6fcf', width: 16, dur: .8 }); m.text(tl, 'LÍNEA MAGINOT', ...geo.cities['Sedán'].map((v, i) => v + (i ? 110 : 140)), W('maginot'), 41.4, { size: 18, fill: '#9fd0ff' });
  CM.head(H, tl, 'LA LÍNEA <em>MAGINOT</em>', '…y los alemanes la rodearon', W('maginot') - .2, 41.4);
  /* Dunkirk: evacuation (retreat by sea), Luftwaffe overhead */
  const dz = CM.svgIn($('dun'), 'linear-gradient(#7d8b99, #c9c2ae 55%, #3d6a8f 55%, #1c3f62)'); CM.mk('path', { d: 'M0 600 L1100 600 L1500 1080 L0 1080Z', fill: '#c9b07a' }, dz);
  const boats = [0, 1, 2, 3].map(i => { const g = CM.mk('g', {}, dz); i % 2 ? CM.ship(g, '#59606b') : CM.lcvp(g); return g; });
  const queue = Array.from({ length: 10 }, (_, i) => ({ f: CM.figure(dz, i % 3 ? 'UK' : 'FR40', { pack: true }), x: 80 + i * 110, y: 760 + (i % 2) * 40 }));
  const pl = [CM.fighter(dz, '#7a7f86', 'cross'), CM.fighter(dz, '#7a7f86', 'cross')], dex = [43.5, 45.4, 47.6, 50.0].map((t, i) => CM.explosion(dz, 300 + i * 220, 760, t, .8, 'dk' + i));
  gm.onFrame($('dun'), (l, info) => { const t = info.time, d = t - 41.6;
    boats.forEach((g, i) => g.setAttribute('transform', `translate(${1300 + i * 150 + d * (20 + i * 8)} ${640 + i * 60}) scale(${i % 2 ? .5 : .8})`));
    queue.forEach((q, i) => CM.pose(q.f, { x: q.x + d * 70, y: q.y, s: 1.3, dir: 1, run: .35, ph: t * 5 + i }));
    pl.forEach((p, i) => p.setAttribute('transform', `translate(${-300 + d * 330 - i * 500} ${160 + i * 90 + Math.sin(t + i) * 20}) scale(.9)`)); dex.forEach(f => f(t)); });
  CM.head(H, tl, '<em>DUNKERQUE</em>', '26 de mayo – 4 de junio de 1940', 41.9, 52.8);
  const ev = CM.text($('dun'), 'mid', '<b>+330.000</b> soldados evacuados', 260); tl.from(ev, { y: 30, opacity: 0, duration: .35 }, W('trescientos') - .3).from($('dun'), { opacity: 0, duration: .3 }, 41.6);
  /* Compiègne: France surrenders in the same carriage */
  const cz = CM.svgIn($('comp'), 'linear-gradient(#3a4a3a, #8a9a7a)'); CM.mk('rect', { y: 800, width: 1920, height: 280, fill: '#2f3a2a' }, cz);
  for (let i = 0; i < 12; i++) { const x = 60 + i * 170; CM.mk('rect', { x: x - 10, y: 420, width: 20, height: 400, fill: '#2a2017' }, cz); CM.mk('circle', { cx: x, cy: 400, r: 90, fill: '#2f4a24' }, cz); }
  CM.mk('rect', { x: 560, y: 600, width: 800, height: 200, rx: 12, fill: '#4a3a2a' }, cz); for (let i = 0; i < 6; i++) CM.mk('rect', { x: 600 + i * 125, y: 640, width: 80, height: 60, fill: '#e8d9a8' }, cz);
  [['DE2', 380, 1], ['DE2', 1540, -1]].forEach(([n, x, d]) => CM.pose(CM.figure(cz, n), { x, y: 900, s: 1.4, dir: d }));
  const cmp = CM.text($('comp'), 'big', '22 · 6 · <em>1940</em>', 110, 'font-size:130px'), cmp2 = CM.text($('comp'), 'mid', 'Francia se rinde en <b>el mismo vagón</b> de 1918', 260);
  tl.from($('comp'), { opacity: 0, duration: .4 }, 52.8).from(cmp, { scale: 1.3, opacity: 0, duration: .5, ease: 'expo.out' }, 53.1).from(cmp2, { y: 30, opacity: 0, duration: .35 }, W('vagón') - .4);
  m.zoom(tl, [700, 520], 1.3, 63.2, .01); m.color(tl, 'FRANCIA', '#6a4a4a', 63.3, .01); m.color(tl, ['NORUEGA', 'DINAMARCA', 'PAÍSES BAJOS', 'BÉLGICA'], '#7a5a5a', 63.3, .01);
  tl.to(m.paths['REINO UNIDO'], { fill: '#5b9cff', duration: .3, yoyo: true, repeat: 3 }, W('solo') - .3);
  CM.head(H, tl, 'EL REINO UNIDO, <em>SOLO</em>', 'verano de 1940', 63.6, W('churchill') - .3);
  CM.head(H, tl, 'WINSTON <em>CHURCHILL</em>', '«nunca nos rendiremos»', W('churchill') - .2, 76.5);
  /* Battle of Britain */
  CM.dogfight($('bob'), 76.6, { a: { color: '#6b7a5a', mark: 'roundel' }, b: { color: '#7a7f86', mark: 'cross' }, n: 2, downs: [{ side: 'b', i: 0, at: W('ganaron') - .4 }, { side: 'b', i: 1, at: W('ganaron') + 1.6 }] });
  CM.head(H, tl, 'LA BATALLA DE <em>INGLATERRA</em>', 'julio – octubre de 1940 · Spitfire y Hurricane', 76.9, 86.4); tl.from($('bob'), { opacity: 0, duration: .3 }, 76.6);
  const fd = CM.text($('bob'), 'mid', 'la primera gran <b>derrota de Hitler</b>', 260); tl.from(fd, { y: 30, opacity: 0, duration: .35 }, W('derrota') - .4);
  m.zoom(tl, 'Roma', 1.8, 86.4, .01); tl.to(m.paths['ITALIA'], { fill: C.central, duration: .3 }, W('italia') - .2);
  CM.head(H, tl, 'ITALIA <em>ENTRA</em>', 'junio de 1940 · junto a Alemania', 86.6, 90.7);
  /* the Blitz on London */
  const lz = CM.svgIn($('lon'), 'linear-gradient(#05080f, #1d2a4a)');
  const beams = [0, 1, 2, 3].map(i => CM.mk('path', { fill: 'rgb(255 250 210 / .14)' }, lz));
  for (let i = 0; i < 22; i++) CM.mk('rect', { x: i * 90, y: 1080 - 160 - gm.random('lh' + i) * 260, width: 84, height: 500, fill: '#111622' }, lz);
  CM.mk('path', { d: 'M820 1080 L820 560 L860 520 L900 560 L900 1080Z', fill: '#111622' }, lz);
  const bx = [91.6, 92.8, 94.1, 95.5, 96.8, 98.0].map((t, i) => CM.explosion(lz, 200 + i * 290, 840 - (i % 2) * 80, t, .9, 'bl' + i));
  gm.onFrame($('lon'), (l, info) => { const t = info.time; beams.forEach((b, i) => { const a = Math.sin(t * .6 + i * 1.7) * .5, x0 = 300 + i * 420; b.setAttribute('d', `M${x0} 1000 L${x0 + Math.sin(a) * 1100 - 60} ${1000 - Math.cos(a) * 1100} L${x0 + Math.sin(a) * 1100 + 60} ${1000 - Math.cos(a) * 1100}Z`); }); bx.forEach(f => f(t)); });
  CM.head(H, tl, 'EL <em>BLITZ</em>', 'bombardeos sobre Londres · 1940 – 1941', 91.0, 99.5); tl.from($('lon'), { opacity: 0, duration: .3 }, 90.7);
  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
