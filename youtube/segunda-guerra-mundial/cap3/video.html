<!doctype html>
<!-- WW2 · Capítulo 3 · 1941: Barbarroja, Balcanes y Rommel, cercos y prisioneros (captura), Leningrado, Moscú (retirada alemana en la nieve), Pearl Harbor, expansión japonesa, EE. UU. entra. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="80.8">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.5"></audio>
<section class="scene" id="map" data-start="3.6" data-duration="51.2"></section>
<section class="scene" id="barb" data-start="3.6" data-duration="10.2"></section>
<section class="scene" id="cap" data-start="29.2" data-duration="6.6"></section>
<section class="scene" id="mos" data-start="42.4" data-duration="12.6"></section>
<section class="scene" id="ph" data-start="54.8" data-duration="12.6"></section>
<section class="scene" id="pac" data-start="67.2" data-duration="7.2"></section>
<section class="scene" id="us" data-start="74.2" data-duration="6.6"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4;
gm.wait(Promise.all([fetch('voz.json').then(r => r.json()), fetch('lib/europa1939.json').then(r => r.json()), fetch('lib/pacifico.json').then(r => r.json())]).then(([words, geo, pac]) => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), C = CM.MAPCOL, $ = id => document.getElementById(id);
  CM.card($('cards'), tl, 3, '1941', 'LA GUERRA SE VUELVE MUNDIAL', 0, 4);
  /* Barbarossa: panzers roll east */
  CM.tanks($('barb'), 3.6, { n: 3, inf: 'DE2', planes: true, ww2: { color: '#5f6450', mark: 'cross', pc: '#7a7f86', pm: 'cross' }, sky: 'linear-gradient(#a9bccd, #e3d9b6)', ground: '#5a6a34' });
  CM.head(H, tl, 'OPERACIÓN <em>BARBARROJA</em>', '22 de junio de 1941', 4.3, 13.6);
  /* map */
  const m = CM.map($('map'), geo); tl.set(m.g, { x: 960 - 1050 * 1.1, y: 540 - 800 * 1.1, scale: 1.1 }, 0);
  m.color(tl, ['ALEMANIA', 'ESLOVAQUIA', 'POLONIA', 'FRANCIA', 'PAÍSES BAJOS', 'BÉLGICA', 'DINAMARCA', 'NORUEGA'], C.central, 0, .01).color(tl, ['ITALIA', 'HUNGRÍA', 'RUMANÍA', 'BULGARIA', 'FINLANDIA'], '#8f3a3a', 0, .01)
   .color(tl, 'REINO UNIDO', C.allies, 0, .01).color(tl, ['URSS', 'BÁLTICOS'], '#9a5a5a', 0, .01);
  m.color(tl, ['YUGOSLAVIA', 'GRECIA'], '#7a5a5a', W('balcanes') - .2); m.pin(tl, 'Belgrado', 'BALCANES', W('balcanes') - .2, 21.8, { size: 26 });
  m.pin(tl, 'Tobruk', 'ÁFRICA DEL NORTE', W('áfrica') - .2, 21.8, { size: 26, dy: 40 });
  CM.head(H, tl, 'BALCANES Y <em>ÁFRICA</em>', 'Erwin Rommel, «el zorro del desierto»', 13.9, 21.8);
  m.zoom(tl, [1150, 420], 1.4, 21.4, 1.2);
  m.color(tl, ['URSS', 'BÁLTICOS'], C.allies, 22.2, .6);
  ['barbN', 'barbC', 'barbS'].forEach((k, i) => m.line(tl, k, W('leningrado') - .5 + i * 1.1, { color: '#E5484D', width: 14, arrow: true, dur: 1.2 }));
  m.pin(tl, 'Leningrado', 'LENINGRADO', W('leningrado') - .3, 28.9, { size: 26 }); m.pin(tl, 'Moscú', 'MOSCÚ', W('moscú') - .3, 28.9, { size: 26 }); m.pin(tl, 'Kiev', 'UCRANIA', W('ucrania') - .3, 28.9, { size: 26 });
  CM.head(H, tl, '+3 MILLONES <em>DE SOLDADOS</em>', 'tres direcciones', 22.3, 29.0);
  /* encirclement: Soviet soldiers taken prisoner */
  CM.battle($('cap'), { id: 'cp', left: 'DE2', right: 'SU', terrain: 'fields', t0: 29.2, t1: 35.8, n: 7, falls: [], mg: true, artillery: [29.4, 30.6, 31.8], outcome: { type: 'capture', at: 32.4 }, pan: [0, -1280] });
  CM.head(H, tl, 'CERCOS <em>Y PRISIONEROS</em>', 'millones de soldados soviéticos capturados', 29.5, 35.6); tl.from($('cap'), { opacity: 0, duration: .3 }, 29.2);
  /* Leningrad siege */
  m.zoom(tl, 'Leningrado', 3.2, 35.6, .01);
  const ring = CM.mk('circle', { cx: geo.cities['Leningrado'][0], cy: geo.cities['Leningrado'][1], r: 70, fill: 'none', stroke: '#E5484D', 'stroke-width': 8, 'stroke-dasharray': '14 10' }, m.g);
  tl.from(ring, { draw: 0, duration: 1.4, ease: 'power2.inOut' }, 36.3).to(ring, { opacity: 0, duration: .3 }, 42.2);
  const ld = CM.text($('map'), 'big', '<em>872</em> DÍAS', 700, 'font-size:120px'); tl.from(ld, { scale: 1.4, opacity: 0, duration: .45, ease: 'expo.out' }, W('días') - .3).to(ld, { opacity: 0, duration: .25 }, 42.2);
  CM.head(H, tl, 'EL SITIO DE <em>LENINGRADO</em>', '1941 – 1944 · hambre y frío', 36.1, 42.3);
  /* Moscow: winter, Red Army counterattacks, Germans fall back */
  CM.battle($('mos'), { id: 'ms', left: 'SU', right: 'DE2', terrain: 'snow', t0: 42.4, t1: 55.0, n: 8, falls: [], mg: true, artillery: [43.0, 44.6, 46.4, 48.0, 49.6], outcome: { type: 'retreat', at: W('contraatacó') }, pan: [0, -1280] });
  const snow = CM.mk('g', {}, $('mos').querySelector('svg')), flakes = Array.from({ length: 70 }, (_, i) => ({ el: CM.mk('circle', { r: 2 + gm.random('sr' + i) * 4, fill: '#fff', opacity: .8 }, snow), x: gm.random('sx' + i) * 1920, v: 60 + gm.random('sv' + i) * 90 }));
  gm.onFrame($('mos'), (l, info) => flakes.forEach((f, i) => { const y = (f.v * info.time + i * 97) % 1100; f.el.setAttribute('cx', (f.x + Math.sin(info.time + i) * 30) % 1920); f.el.setAttribute('cy', y); }));
  CM.head(H, tl, 'LA BATALLA DE <em>MOSCÚ</em>', 'diciembre de 1941 · −30 °C', 42.7, W('derrota') - .4);
  CM.head(H, tl, 'PRIMERA GRAN <em>DERROTA ALEMANA</em>', 'en tierra', W('derrota') - .3, 54.8); tl.from($('mos'), { opacity: 0, duration: .3 }, 42.4);
  /* Pearl Harbor */
  const pz = CM.svgIn($('ph'), 'linear-gradient(#8fb8de, #f2d9b0 50%, #3a7ab0 50%, #12385e)');
  CM.mk('path', { d: 'M0 520 Q300 420 600 500 Q900 380 1300 480 Q1600 420 1920 500 L1920 540 L0 540Z', fill: '#4a6a3a' }, pz);
  const fleet = [0, 1, 2, 3].map(i => { const g = CM.mk('g', { transform: `translate(${300 + i * 420} ${640 + (i % 2) * 90}) scale(.75)` }, pz); CM.ship(g, '#5a6270'); return g; });
  const jp = Array.from({ length: 5 }, () => CM.fighter(pz, '#c9c3a8', 'sun')), t0 = W('pearl') - 1.2;
  const pex = [0, 1, 2, 3, 4, 5].map(i => CM.explosion(pz, 330 + (i % 4) * 420, 620 + (i % 2) * 90, t0 + 1.2 + i * .9, 1, 'ph' + i));
  const smk = fleet.map((g, i) => CM.mk('ellipse', { cx: 300 + i * 420, cy: 520, rx: 60, ry: 120, fill: '#2a2a2a', opacity: 0 }, pz));
  gm.onFrame($('ph'), (l, info) => { const t = info.time; jp.forEach((p, i) => { const d = t - t0 - i * .5; p.setAttribute('transform', `translate(${2100 - d * 520} ${180 + i * 70 + Math.sin(d * 2) * 15}) scale(-.85 .85)`); });
    pex.forEach(f => f(t)); smk.forEach((s, i) => { const k = gm.clamp((t - t0 - 1.5 - i * .9) / 3); s.setAttribute('opacity', k * .55); s.setAttribute('ry', 120 + k * 120); s.setAttribute('cy', 560 - k * 140); }); });
  CM.head(H, tl, '<em>PEARL HARBOR</em>', '7 de diciembre de 1941 · Hawái', 55.2, 67.2); tl.from($('ph'), { opacity: 0, duration: .3 }, 54.8);
  const pt = CM.text($('ph'), 'mid', 'más de <b>2.400</b> estadounidenses muertos', 260); tl.from(pt, { y: 30, opacity: 0, duration: .35 }, W('murieron') - .3);
  /* Japan expands across the Pacific */
  const pm = CM.map($('pac'), pac); tl.set(pm.g, { x: 960 - 640 * 1.25, y: 540 - 520 * 1.25, scale: 1.25 }, 0);
  pm.color(tl, 'JAPÓN', C.central, 0, .01).color(tl, 'ESTADOS UNIDOS', C.allies, 0, .01).color(tl, 'CHINA', '#7a5a5a', 0, .01);
  ['expansion1', 'expansion2', 'expansion3'].forEach((k, i) => pm.line(tl, k, W('filipinas') - .4 + i * .8, { color: '#E5484D', width: 9, arrow: true, dur: 1 }));
  pm.color(tl, 'SUDESTE ASIÁTICO', '#8f3a3a', W('singapur') - .2); pm.pin(tl, 'Manila', 'FILIPINAS', W('filipinas') - .2, null, { size: 24 }); pm.pin(tl, 'Singapur', 'SINGAPUR', W('singapur') - .2, null, { size: 24 });
  CM.head(H, tl, 'JAPÓN SE <em>EXPANDE</em>', 'diciembre 1941 – mediados de 1942', 67.4, 74.2); tl.from($('pac'), { opacity: 0, duration: .3 }, 67.2);
  /* the USA joins */
  const uz = CM.svgIn($('us'), 'linear-gradient(#5d7fa6, #d6c9a6)'); CM.mk('rect', { y: 820, width: 1920, height: 260, fill: '#5d6a40' }, uz);
  const fl = CM.mk('g', {}, uz); CM.mk('rect', { x: 948, y: 260, width: 10, height: 560, fill: '#ddd' }, fl); CM.flag(fl, 'US', 958, 270, 240, 160);
  const mar = Array.from({ length: 7 }, (_, i) => CM.figure(uz, 'US44'));
  gm.onFrame($('us'), (l, info) => mar.forEach((f, i) => CM.pose(f, { x: -200 + i * 170 + (info.time - 74.2) * 140, y: 880 + (i % 2) * 30, s: 1.4, dir: 1, run: .3, ph: info.time * 5 + i })));
  CM.head(H, tl, 'ESTADOS UNIDOS <em>ENTRA</em>', 'ahora sí, una guerra mundial', 74.4, 80.6); tl.from($('us'), { opacity: 0, duration: .3 }, 74.2);
  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
