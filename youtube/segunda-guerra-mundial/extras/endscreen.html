<!doctype html>
<!-- Pantalla final de YouTube (20 s), Segunda Guerra Mundial: velas del recuerdo. Deja libres dos zonas para los elementos de YouTube Studio:
     vídeo recomendado (izquierda, 16:9) y botón de suscripción (derecha, círculo). -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="20">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script></head>
<body>
<audio src="musica.mp3" data-volume="0.6" data-fade-in="0.5" data-fade-out="3"></audio>
<section class="scene" id="e" data-start="0" data-duration="20"></section>
<script>
const e = document.getElementById('e'), tl = gm.timeline('#e');
const s = CM.svgIn(e, 'radial-gradient(1400px 900px at 50% 40%, #2a3550, #070b18 75%)');
const P = Array.from({ length: 34 }, (_, i) => { const g = CM.mk('g', {}, s), sc = .5 + gm.random('ps' + i) * .7;
  CM.mk('rect', { x: -10, y: -40, width: 20, height: 40, rx: 3, fill: '#e9e1cf' }, g); CM.mk('circle', { cy: -58, r: 26, fill: 'rgb(255 190 90 / .2)' }, g); CM.mk('ellipse', { cy: -54, rx: 6, ry: 14, fill: '#ffc86a', class: 'fl' }, g);
  const xr = gm.random('px' + i) * 1420; return { g, x: xr < 680 ? xr - 30 : xr + 560, y: 960 + gm.random('py' + i) * 110, sc, ph: gm.random('pp' + i) * 6 }; }).sort((a, b) => a.y - b.y);
P.forEach(p => s.append(p.g));
gm.onFrame('#e', t => P.forEach(p => { p.g.setAttribute('transform', `translate(${p.x} ${p.y}) scale(${p.sc})`); p.g.querySelector('.fl').setAttribute('ry', 14 * (1 + Math.sin(t * 8 + p.ph) * .12)); }));
// guide frames for the YouTube end-screen elements
const vbox = CM.mk('rect', { x: 230, y: 380, width: 704, height: 396, rx: 22, fill: 'rgb(255 255 255 / .06)', stroke: '#FFD23F', 'stroke-width': 5, 'stroke-dasharray': '18 12' }, s);
const sub = CM.mk('circle', { cx: 1440, cy: 578, r: 170, fill: 'rgb(255 255 255 / .06)', stroke: '#FFD23F', 'stroke-width': 5, 'stroke-dasharray': '18 12' }, s);
const t1 = CM.text(e, 'big', '¿QUÉ BATALLA QUIERES <em>VER EN DETALLE</em>?', 90, 'font-size:104px');
const t2 = CM.text(e, 'mid', 'cuéntamelo en los <b>comentarios</b>', 230);
const l1 = CM.text(e, 'mid', 'mira este <b>vídeo</b>', 800, 'left:230px;right:auto;width:704px;font-size:38px');
const l2 = CM.text(e, 'mid', '<b>suscríbete</b>', 800, 'left:1240px;right:auto;width:400px;font-size:38px');
const br = CM.text(e, 'big', 'CURIOSI<em>MUNDO</em>', 880, 'font-size:70px;letter-spacing:.14em;top:auto;bottom:40px');
const sl = CM.text(e, 'mid', 'un mundo de cosas por descubrir', 0, 'top:auto;bottom:16px;font-size:22px;color:#cfe3ff');
tl.from(t1, { scale: 1.2, opacity: 0, duration: .6, ease: 'expo.out' }, .2).from(t2, { y: 20, opacity: 0, duration: .4 }, .6)
  .from([vbox, sub], { opacity: 0, duration: .5, stagger: .2 }, .8).from([l1, l2], { y: 20, opacity: 0, duration: .4, stagger: .2 }, 1.1)
  .from(br, { y: 30, opacity: 0, letterSpacing: '.4em', duration: .8, ease: 'expo.out' }, 1.4).from(sl, { opacity: 0, duration: .5 }, 2)
  .to(sub, { scale: 1.04, duration: .8, ease: 'sine.inOut', yoyo: true, repeat: 19, transformOrigin: '1440px 578px' }, 2);
</script>
</body>
</html>
