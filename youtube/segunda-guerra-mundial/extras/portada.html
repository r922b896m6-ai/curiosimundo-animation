<!doctype html>
<!-- Portada de YouTube 1280×720: soldado estadounidense y soldado soviético frente a soldado alemán (casco y Balkenkreuz, sin esvástica), tanque y aviones, explosión. "1939–1945 · EN 10 MINUTOS". -->
<html data-width="1280" data-height="720" data-fps="30" data-duration="1">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script>
<style>.t1{position:absolute;left:0;right:0;top:34px;text-align:center;font:400 190px/1 'Bebas Neue';color:#FFD23F;text-shadow:0 8px 0 #111,0 0 40px rgb(0 0 0 / .8);letter-spacing:.02em;-webkit-text-stroke:4px #111}
.t2{position:absolute;left:0;right:0;top:218px;text-align:center;font:400 96px/1 'Bebas Neue';color:#fff;text-shadow:0 6px 0 #111,0 0 30px rgb(0 0 0 / .9);-webkit-text-stroke:3px #111}
.tag{position:absolute;left:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.12em;color:#fff;background:rgb(6 12 28 / .85);padding:10px 18px;border-radius:10px;border-left:6px solid #FFD23F}
.tag span{color:#FFD23F}.ww{position:absolute;right:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.08em;color:#111;background:#FFD23F;padding:10px 18px;border-radius:10px}</style></head>
<body>
<section class="scene" id="p" data-start="0" data-duration="1"></section>
<script>
const p = document.getElementById('p');
const s = CM.mk('svg', { viewBox: '0 0 1280 720', width: 1280, height: 720, style: 'position:absolute;inset:0' }, p); CM.defs();
const g = CM.mk('linearGradient', { id: 'pg', x1: 0, y1: 0, x2: 0, y2: 1 }, CM.mk('defs', {}, s)); CM.mk('stop', { offset: 0, 'stop-color': '#232a36' }, g); CM.mk('stop', { offset: 1, 'stop-color': '#c4602a' }, g);
CM.mk('rect', { width: 1280, height: 720, fill: 'url(#pg)' }, s);
CM.mk('circle', { cx: 640, cy: 520, r: 520, fill: 'url(#cmFlash)', opacity: .9 }, s);
for (let i = 0; i < 4; i++) CM.mk('circle', { cx: 380 + i * 170, cy: 470 - (i % 2) * 40, r: 140, fill: 'url(#cmSmoke)', opacity: .8 }, s);
[0, 1].forEach(i => { const f = CM.fighter(s, '#4a5f7a', 'star'); f.setAttribute('transform', `translate(${180 + i * 150} ${360 + i * 50}) scale(.55)`); });
const f2 = CM.fighter(s, '#7a7f86', 'cross'); f2.setAttribute('transform', 'translate(1090 380) scale(-.55 .55)');
const tk = CM.tank2(s, '#5f6450', 'cross'); tk.setAttribute('transform', 'translate(1040 610) scale(-.75 .75)');
CM.mk('path', { d: 'M0 600 Q640 560 1280 600 L1280 720 L0 720Z', fill: '#2a2017' }, s);
for (let i = 0; i < 18; i++) CM.mk('circle', { cx: 300 + gm.random('c' + i) * 680, cy: 330 + gm.random('d' + i) * 220, r: 6 + gm.random('e' + i) * 12, fill: '#2a2017' }, s);
const us = CM.figure(s, 'US44'), su = CM.figure(s, 'SU'), de = CM.figure(s, 'DE2');
CM.pose(su, { x: 130, y: 720, s: 2.2, dir: 1, lean: 6 }); CM.pose(us, { x: 300, y: 750, s: 2.6, dir: 1, lean: 6 }); CM.pose(de, { x: 960, y: 750, s: 2.6, dir: -1, lean: 6 });
CM.mk('use', { href: '#cmStar', transform: 'translate(640 420) scale(1.3)' }, s);
CM.flag(s, 'US', 36, 40, 110, 72); CM.flag(s, 'SU', 36, 128, 110, 72); CM.flag(s, 'DE2', 1134, 40, 110, 72);
p.insertAdjacentHTML('beforeend', '<div class="t1">1939 – 1945</div><div class="t2">EN 10 MINUTOS</div><div class="tag">CURIOSI<span>MUNDO</span></div><div class="ww">II GUERRA MUNDIAL</div>');
</script>
</body>
</html>
