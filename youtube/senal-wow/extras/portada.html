<!doctype html>
<!-- Portada de YouTube 1280×720: la tira impresa con 6EQUJ5 rodeado y «Wow!», cielo estrellado, «72 SEGUNDOS SIN EXPLICACIÓN». -->
<html data-width="1280" data-height="720" data-fps="30" data-duration="1">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/wow.js"></script>
<style>.t1{position:absolute;left:40px;top:40px;width:620px;font:400 150px/.88 'Bebas Neue';color:#FFD23F;text-shadow:0 8px 0 #111,0 0 40px rgb(0 0 0 / .8);-webkit-text-stroke:4px #111}
.t1 span{color:#fff}.tag{position:absolute;left:28px;bottom:24px;font:400 46px/1 'Bebas Neue';letter-spacing:.12em;color:#fff;background:rgb(6 12 28 / .85);padding:10px 18px;border-radius:10px;border-left:6px solid #FFD23F}.tag span{color:#FFD23F}</style></head>
<body>
<section class="scene" id="p" data-start="0" data-duration="1"></section>
<script>
const p = document.getElementById('p');
const s = CM.mk('svg', { viewBox: '0 0 1920 1080', width: 1280, height: 720, style: 'position:absolute;inset:0' }, p); CM.mk('rect', { width: 1920, height: 1080, fill: '#050a1a' }, s); WOW.stars(s, 260);
const host = document.createElement('div'); host.style.cssText = 'position:absolute;inset:0;transform:scale(.6667);transform-origin:0 0;width:1920px;height:1080px'; p.append(host);
const pr = WOW.printout(host, { left: 1040, top: 60, w: 760, h: 960 }); pr.d.style.transform = 'rotate(4deg)'; pr.d.querySelectorAll('.wc').forEach(c => c.style.color = '#d0312d');
p.insertAdjacentHTML('beforeend', '<div class="t1">72 SEGUNDOS<br><span>SIN</span><br>EXPLICACIÓN</div><div class="tag">CURIOSI<span>MUNDO</span></div>');
</script>
</body>
</html>
