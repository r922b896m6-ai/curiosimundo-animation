<!doctype html>
<!-- ¿Y si el Sol se apagara? · Capítulo 2 · El apagón: el cielo se apaga, estrellas a mediodía, la Luna desaparece (y Venus, Marte, Júpiter), la Tierra sale en línea recta (30 km/s), la Luna se queda, llega el frío. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="65.39">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.55"></audio>
<section class="scene" id="sky" data-start="3.6" data-duration="9.91"></section>
<section class="scene" id="stars" data-start="13.41" data-duration="6.73"></section>
<section class="scene" id="moon" data-start="20.04" data-duration="13.35"></section>
<section class="scene" id="line" data-start="33.29" data-duration="16.8"></section>
<section class="scene" id="moon2" data-start="49.99" data-duration="6.9"></section>
<section class="scene" id="cold" data-start="56.79" data-duration="8.6"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4, D = 65.39, S = {sky: 3.6, stars: 13.41, moon: 20.04, line: 33.29, moon2: 49.99, cold: 56.79};
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), $ = id => document.getElementById(id), mk = CM.mk;
  const svgOf = (id, bg) => CM.svgIn($(id), bg);
  Object.keys(S).slice(1).forEach(id => tl.from($(id), { opacity: 0, duration: .35 }, S[id]));
  const nxt = id => { const k = Object.keys(S), i = k.indexOf(id); return i + 1 < k.length ? S[k[i + 1]] : D; };
  const hd = (title, sub, at, end) => CM.head(H, tl, title, sub, at, end);
  const big = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'big', html, top, extra); tl.from(t, { scale: 1.3, opacity: 0, duration: .4, ease: 'expo.out' }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const mid = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'mid', html, top, extra); tl.from(t, { y: 20, opacity: 0, duration: .35 }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const stamp = (id, txt, at, top = 420, col = '#E5484D') => { const t = CM.text($(id), 'big', `<span style="border:12px solid ${col};border-radius:20px;padding:0 40px;color:${col}">${txt}</span>`, top, 'font-size:150px;transform:rotate(-8deg)'); tl.from(t, { scale: 2, opacity: 0, duration: .3, ease: 'back.out(2)' }, at); return t; };
  const push = (id, from = 1.15, to = 1, ox = '50%', oy = '50%') => { const s = $(id).querySelector('svg'); tl.fromTo(s, { scale: from }, { scale: to, duration: nxt(id) - S[id], ease: 'none', transformOrigin: `${ox} ${oy}` }, S[id]); };
  const ender = (id, q, at, sub = 'CUÉNTAMELO EN LOS COMENTARIOS') => { const end = document.createElement('div'); end.style.cssText = 'position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(1200px 800px at 50% 45%, #1d2a5a, #050a1a 75%)';
    end.innerHTML = `<div style="font:400 120px/1 'Bebas Neue';text-align:center">${q}</div><div style="font:800 40px Inter;letter-spacing:.06em">${sub}</div><div style="margin-top:30px;padding:22px 60px;border-radius:16px;background:#d0312d;font:800 44px Inter;letter-spacing:.08em">SUSCRÍBETE</div><div style="margin-top:20px;font:400 90px Bebas Neue;letter-spacing:.14em">CURIOSI<span style="color:#FFD23F">MUNDO</span></div>`;
    $(id).append(end); const c = end.children;
    tl.from(end, { opacity: 0, duration: .5 }, at).from(c[0], { scale: 1.2, opacity: 0, duration: .5, ease: 'expo.out' }, at + .1).from(c[1], { y: 20, opacity: 0, duration: .3 }, W('cuéntamelo') - .2)
      .from(c[2], { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('suscríbete') - .2).to(c[2], { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W('suscríbete') + .3)
      .from(c[3], { y: 30, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('curiosimundo') - .2); };
    const shake = (el, at, amp = 14) => tl.to(el, { x: amp, duration: .06 }, at).to(el, { x: -amp, duration: .08 }, at + .06).to(el, { x: amp * .5, duration: .08 }, at + .14).to(el, { x: 0, duration: .08 }, at + .22);

  const sunEarth = (s, sx = 330, ex = 1600, y = 560) => { SP.stars(s, 200); const sun = SP.sun(s, sx, y, 170); const e = SP.earth(s, ex, y, 70); return { sun, e }; };

  CM.card($('cards'), tl, 2, '0:00', 'EL APAGÓN', 0, 4);

  const zs = svgOf('sky'); const L = SP.landscape(zs); gm.onFrame($('sky'), (l, i) => L.sun.spin(i.time)); const ck = SP.clock(zs, 960, 400, 200);
  gm.onFrame($('sky'), (l, i) => ck.set(Math.max(0, 2 - (i.time - OFF) * 1.2)));
  const tA = W('apaga') - .1; tl.to(L.dark, { opacity: .72, duration: .15 }, tA).to(L.night, { opacity: 1, duration: .1 }, tA).to(L.sun.w, { opacity: 0, duration: .1 }, tA).to(ck.g, { opacity: 0, duration: .1 }, tA).to(L.win, { attr: { fill: '#ffd88a' }, duration: .3 }, tA + .8);
  shake(zs, tA, 22); hd('MINUTO <em>8:20</em>', 'el cielo se apaga en un instante', OFF + .2, S.stars);
  const zt = svgOf('stars', SP.NIGHT); SP.stars(zt, 500, 1920, 1080, 'st2'); mk('path', { d: 'M0 860 Q480 820 960 850 T1920 840 L1920 1080 L0 1080Z', fill: '#05080e' }, zt);
  const clk = SP.label(zt, '12:00 · MEDIODÍA', 960, 560, 150, '#FFD23F'); tl.from(clk, { opacity: 0, scale: 1.3, duration: .4, transformOrigin: '960px 520px' }, W('mediodía') - .4); push('stars', 1, 1.15);
  hd('ESTRELLAS <em>A MEDIODÍA</em>', 'su luz viene de mucho más lejos', S.stars + .3, S.moon);
  const zm = svgOf('moon', SP.NIGHT); SP.stars(zm, 260); const mo = SP.moon(zm, 960, 470, 200);
  tl.to(mo, { opacity: 0, duration: 1.2 }, W('desaparece') - .3); const lb = SP.label(zm, 'SOLO REFLEJA LA LUZ DEL SOL', 960, 820, 70, '#FFD23F'); tl.from(lb, { opacity: 0, duration: .4 }, W('refleja') - .3).to(lb, { opacity: 0, duration: .3 }, W('rato') - .3);
  [['VENUS', 'venus', 520, '#e8c27a', 70], ['MARTE', 'marte', 960, '#d0603a', 55], ['JÚPITER', 'júpiter', 1400, '#d8b48a', 110]].forEach(([n, w, x, c, r]) => { const p = SP.planet(zm, x, 600, r, c, false); const t = SP.label(zm, n, x, 800, 70);
    tl.from([p, t], { opacity: 0, duration: .3 }, S.moon + .5).to([p, t], { opacity: 0, duration: .8 }, W(w) - .1); });
  hd('LA LUNA <em>SE APAGA</em>', 'no tiene luz propia', S.moon + .3, W('rato') - .3); hd('Y LOS <em>PLANETAS</em>', 'uno detrás de otro', W('rato') - .2, S.line);
  const zl = svgOf('line', SP.NIGHT); SP.stars(zl, 260); mk('circle', { cx: 760, cy: 560, r: 380, fill: 'none', stroke: '#5bc0ff', 'stroke-width': 3, 'stroke-dasharray': '10 12', opacity: .5 }, zl);
  mk('circle', { cx: 760, cy: 560, r: 110, fill: '#1a1408', stroke: '#3a2e18', 'stroke-width': 4 }, zl); const el = SP.earth(zl, 0, 0, 50); const tr = mk('path', { d: '', stroke: '#5bc0ff', 'stroke-width': 4, fill: 'none', opacity: .8, 'stroke-dasharray': '4 10' }, zl);
  const tD = W('disparada') - .2; gm.onFrame($('line'), (l, i) => { const t = i.time; let x, y; const a0 = -Math.PI / 2 - (tD - Math.min(t, tD)) * .6;
    x = 760 + Math.cos(a0) * 380; y = 560 + Math.sin(a0) * 380; if (t > tD) { const d = (t - tD) * 90; x += -Math.sin(a0) * d; y += Math.cos(a0) * d; tr.setAttribute('d', `M${760 + Math.cos(a0) * 380} ${560 + Math.sin(a0) * 380} L${x} ${y}`); } else tr.setAttribute('d', '');
    el.w.setAttribute('transform', `translate(${x} ${y}) scale(.5)`); el.rot(t); });
  hd('LA TIERRA <em>SE SUELTA</em>', 'deja de girar alrededor del Sol', S.line + .3, tD - .1); hd('EN <em>LÍNEA RECTA</em>', '30 km/s · más de 100.000 km/h', tD, S.moon2);
  const zm2 = svgOf('moon2', SP.NIGHT); const sg = mk('g', {}, zm2); SP.stars(sg, 300, 3840, 1080, 'm2'); const e2 = SP.earth(zm2, 960, 560, 150); const m2 = SP.moon(zm2, 0, 0, 40);
  gm.onFrame($('moon2'), (l, i) => { const t = i.time - S.moon2; sg.setAttribute('transform', `translate(${-t * 80} 0)`); e2.rot(i.time); m2.setAttribute('transform', `translate(${960 + Math.cos(t * .9) * 360} ${560 + Math.sin(t * .9) * 140})`); });
  hd('LA LUNA <em>SE QUEDA</em>', 'la sujeta la gravedad de la Tierra', S.moon2 + .3, S.cold);
  const zc = svgOf('cold', SP.NIGHT); SP.stars(zc, 260); const e3 = SP.earth(zc, 960, 560, 260); gm.onFrame($('cold'), (l, i) => e3.rot(i.time));
  const frost = mk('circle', { cx: 960, cy: 560, r: 262, fill: '#dff4ff', opacity: 0 }, zc); tl.to(frost, { opacity: .55, duration: 3 }, W('peligroso') - .5);
  big('cold', 'EL <em>FRÍO</em>', 420, W('frío') - .3, 'font-size:240px'); shake(zc, W('frío'), 16);

  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
