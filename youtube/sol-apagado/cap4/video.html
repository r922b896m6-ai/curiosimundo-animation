<!doctype html>
<!-- ¿Y si el Sol se apagara? · Capítulo 4 · Quién sobreviviría: el hielo como manta, el fondo del mar líquido, fuentes hidrotermales, microbios, gusanos, cangrejos; los supervivientes; personas con energía nuclear o geotérmica; la buena noticia. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="76.48">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.55"></audio>
<section class="scene" id="ice" data-start="3.6" data-duration="8.26"></section>
<section class="scene" id="deep" data-start="11.76" data-duration="9.18"></section>
<section class="scene" id="vent" data-start="20.84" data-duration="16.04"></section>
<section class="scene" id="life" data-start="36.78" data-duration="9.42"></section>
<section class="scene" id="ans" data-start="46.1" data-duration="9.1"></section>
<section class="scene" id="hum" data-start="55.1" data-duration="13.83"></section>
<section class="scene" id="good" data-start="68.83" data-duration="7.65"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4, D = 76.48, S = {ice: 3.6, deep: 11.76, vent: 20.84, life: 36.78, ans: 46.1, hum: 55.1, good: 68.83};
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), $ = id => document.getElementById(id), mk = CM.mk;
  const svgOf = (id, bg) => CM.svgIn($(id), bg);
  Object.keys(S).slice(1).forEach(id => tl.from($(id), { opacity: 0, duration: .35 }, S[id]));
  const nxt = id => { const k = Object.keys(S), i = k.indexOf(id); return i + 1 < k.length ? S[k[i + 1]] : D; };
  const hd = (title, sub, at, end) => CM.head(H, tl, title, sub, at, end);
  const big = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'big', html, top, extra); tl.from(t, { scale: 1.3, opacity: 0, duration: .4, ease: 'expo.out' }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const mid = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'mid', html, top, extra); tl.from(t, { y: 20, opacity: 0, duration: .35 }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const stamp = (id, txt, at, top = 420, col = '#E5484D') => { const t = CM.text($(id), 'big', `<span style="border:12px solid ${col};border-radius:20px;padding:0 40px;color:${col}">${txt}</span>`, top, 'font-size:150px;transform:rotate(-8deg)'); tl.from(t, { scale: 2, opacity: 0, duration: .3, ease: 'back.out(2)' }, at); return t; };
  const push = (id, from = 1.15, to = 1, ox = '50%', oy = '50%') => { const s = $(id).querySelector('svg'); tl.fromTo(s, { scale: from }, { scale: to, duration: nxt(id) - S[id], ease: 'none', transformOrigin: `${ox} ${oy}` }, S[id]); };
  const ender = (id, q, at, sub = 'CUÉNTAMELO EN LOS COMENTARIOS') => { const end = document.createElement('div'); end.style.cssText = 'position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(1200px 800px at 50% 45%, #1d2a5a, #050a1a 75%)';
    end.innerHTML = `<div style="font:400 120px/1 'Bebas Neue';text-align:center">${q}</div><div style="font:800 40px Inter;letter-spacing:.06em">${sub}</div><div style="margin-top:30px;padding:22px 60px;border-radius:16px;background:#d0312d;font:800 44px Inter;letter-spacing:.08em">SUSCRÍBETE</div><div style="margin-top:20px;font:400 90px Bebas Neue;letter-spacing:.14em">CURIOSI<span style="color:#FFD23F">MUNDO</span></div>`;
    $(id).append(end); const c = end.children;
    tl.from(end, { opacity: 0, duration: .5 }, at).from(c[0], { scale: 1.2, opacity: 0, duration: .5, ease: 'expo.out' }, at + .1).from(c[1], { y: 20, opacity: 0, duration: .3 }, W('cuéntamelo') - .2)
      .from(c[2], { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('suscríbete') - .2).to(c[2], { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W('suscríbete') + .3)
      .from(c[3], { y: 30, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('curiosimundo') - .2); };
    const shake = (el, at, amp = 14) => tl.to(el, { x: amp, duration: .06 }, at).to(el, { x: -amp, duration: .08 }, at + .06).to(el, { x: amp * .5, duration: .08 }, at + .14).to(el, { x: 0, duration: .08 }, at + .22);

  const sunEarth = (s, sx = 330, ex = 1600, y = 560) => { SP.stars(s, 200); const sun = SP.sun(s, sx, y, 170); const e = SP.earth(s, ex, y, 70); return { sun, e }; };

  CM.card($('cards'), tl, 4, 'BAJO EL HIELO', 'QUIÉN SOBREVIVIRÍA', 0, 4);

  const zi = svgOf('ice', '#04142e'); const o1 = SP.ocean(zi); gm.onFrame($('ice'), (l, i) => o1.anim(i.time)); o1.vent.setAttribute('opacity', 0); o1.crab.setAttribute('opacity', 0); o1.microbes.forEach(m => m.setAttribute('opacity', 0));
  const bl = mk('path', { d: 'M0 175 Q480 150 960 175 T1920 170', stroke: '#FFD23F', 'stroke-width': 8, fill: 'none' }, zi); tl.from(bl, { draw: 0, duration: 1.2 }, W('manta') - .4);
  SP.label(zi, '−70 °C', 1700, 80, 80, '#9fd3f5'); const w1 = SP.label(zi, 'AGUA LÍQUIDA', 960, 560, 100, '#5bc0ff'); tl.from(w1, { opacity: 0, duration: .4 }, W('aísla') - .3);
  hd('EL HIELO, <em>UNA MANTA</em>', 'aísla el agua de abajo', S.ice + .3, S.deep);
  const zd = svgOf('deep', '#020a1a'); const o2 = SP.ocean(zd); gm.onFrame($('deep'), (l, i) => o2.anim(i.time)); o2.vent.setAttribute('opacity', 0); o2.crab.setAttribute('opacity', 0); push('deep', 1, 1.4, '50%', '90%');
  big('deep', 'CIENTOS DE <em>MILES</em> DE AÑOS', 380, W('cientos') - .3, 'font-size:120px'); hd('EL FONDO DEL MAR', 'seguiría líquido muchísimo tiempo', S.deep + .3, S.vent);
  const zv = svgOf('vent', '#020a1a'); const o3 = SP.ocean(zv); gm.onFrame($('vent'), (l, i) => o3.anim(i.time)); o3.ice.setAttribute('opacity', .3); o3.crab.setAttribute('opacity', 0); o3.worms.forEach(w => w.w.setAttribute('opacity', 0));
  tl.fromTo(zv, { scale: 1.6 }, { scale: 1, duration: 3, ease: 'power2.inOut', transformOrigin: '57% 80%' }, S.vent);
  hd('VIDA <em>SIN SOL</em>', 'en la oscuridad del fondo', S.vent + .3, W('fuentes') - .3); hd('FUENTES <em>HIDROTERMALES</em>', 'chimeneas de agua caliente del interior de la Tierra', W('fuentes') - .2, W('microbios') - .3);
  hd('<em>MICROBIOS</em>', 'se alimentan de sustancias químicas', W('microbios') - .2, S.life);
  const zf = svgOf('life', '#020a1a'); const o4 = SP.ocean(zf); gm.onFrame($('life'), (l, i) => o4.anim(i.time)); o4.ice.setAttribute('opacity', 0);
  tl.fromTo(zf, { scale: 1.9 }, { scale: 1.3, duration: S.ans - S.life, ease: 'none', transformOrigin: '52% 88%' }, S.life);
  [['GUSANOS GIGANTES', 'gusanos', 780], ['CANGREJOS', 'cangrejos', 860], ['ALMEJAS', 'almejas', 940]].forEach(([t, w, y]) => mid('life', `<b>${t}</b>`, y - 600, W(w) - .2, 'font-size:44px', S.ans));
  hd('SIN SOL… <em>NO CAMBIA NADA</em>', 'para ellos', W('ellos') - .3, S.ans);
  const za = svgOf('ans', 'radial-gradient(1200px 800px at 50% 50%, #0d3a5e, #020814 75%)'); for (let i = 0; i < 70; i++) mk('circle', { cx: gm.random('ax' + i) * 1920, cy: gm.random('ay' + i) * 1080, r: 4 + gm.random('ar' + i) * 10, fill: '#7cf0c0', opacity: .5 }, za);
  big('ans', 'LOS <em>SUPERVIVIENTES</em>', 300, S.ans + .5, 'font-size:150px'); mid('ans', 'seres diminutos del <b>fondo del mar</b>', 500, W('diminutos') - .3); mid('ans', 'millones de años <b>sin ver la luz</b>', 580, W('millones') - .3);
  const zh = svgOf('hum', 'linear-gradient(#03050d, #0e1626 70%)'); mk('rect', { y: 800, width: 1920, height: 280, fill: '#6f8299' }, zh); const steam = Array.from({ length: 8 }, (_, i) => mk('circle', { cx: 1300 + (i % 3) * 60, cy: 780, r: 40, fill: '#cfd8e2', opacity: .5 }, zh));
  [[1240, 'M0 0 L0 -120 L60 -120 L60 0Z'], [1380, 'M0 0 L0 -90 L50 -90 L50 0Z']].forEach(([x, d]) => mk('path', { d, fill: '#6a7684', transform: `translate(${x} 800)` }, zh));
  for (let i = 0; i < 5; i++) { const hx = 200 + i * 200, h = mk('g', { transform: `translate(${hx} 800)` }, zh); mk('rect', { x: -60, y: -100, width: 120, height: 100, fill: '#4a4f5a' }, h); mk('path', { d: 'M-75 -100 L0 -160 L75 -100Z', fill: '#e8eef4' }, h); mk('rect', { x: -20, y: -70, width: 40, height: 34, fill: '#ffd88a' }, h); }
  gm.onFrame($('hum'), (l, i) => steam.forEach((c, k) => { const q = ((i.time * .25 + k / 8) % 1); c.setAttribute('cy', 760 - q * 420); c.setAttribute('r', 30 + q * 80); c.setAttribute('opacity', .5 * (1 - q)); }));
  hd('¿Y <em>NOSOTROS</em>?', 'energía nuclear o calor del interior de la Tierra', S.hum + .3, W('islandia') - .3); hd('COMO <em>ISLANDIA</em>', 'calienta casas con calor de la Tierra', W('islandia') - .2, S.good);
  const zg = svgOf('good', 'radial-gradient(1200px 800px at 50% 45%, #2a1a08, #050308 75%)'); SP.stars(zg, 150); const sg = SP.sun(zg, 960, 560, 220); gm.onFrame($('good'), (l, i) => sg.spin(i.time)); tl.from(sg.g, { opacity: 0, scale: .3, duration: 1, ease: 'back.out(1.6)' }, S.good + .2);
  big('good', 'LA BUENA <em>NOTICIA</em>', 120, W('buena') - .3, 'font-size:130px'); stamp('good', 'NO PUEDE PASAR', W('puede') - .3, 820, '#FFD23F');

  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
