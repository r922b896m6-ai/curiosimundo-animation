<!doctype html>
<!-- ¿Y si el Sol se apagara? · Capítulo 5 · El futuro real del Sol: 4600 millones de años, 5000 millones más, gigante roja, enana blanca, recapitulación y pregunta final. -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="55.48">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script></head>
<body>
<audio src="voz.mp3" data-start="4"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.55"></audio>
<section class="scene" id="age" data-start="3.6" data-duration="8.08"></section>
<section class="scene" id="fuel" data-start="11.58" data-duration="4.19"></section>
<section class="scene" id="red" data-start="15.67" data-duration="9.0"></section>
<section class="scene" id="wd" data-start="24.57" data-duration="9.95"></section>
<section class="scene" id="rec" data-start="34.42" data-duration="10.84"></section>
<section class="scene" id="end" data-start="45.16" data-duration="10.32"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 4, D = 55.48, S = {age: 3.6, fuel: 11.58, red: 15.67, wd: 24.57, rec: 34.42, end: 45.16};
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), $ = id => document.getElementById(id), mk = CM.mk;
  const svgOf = (id, bg) => CM.svgIn($(id), bg);
  Object.keys(S).slice(1).forEach(id => tl.from($(id), { opacity: 0, duration: .35 }, S[id]));
  const nxt = id => { const k = Object.keys(S), i = k.indexOf(id); return i + 1 < k.length ? S[k[i + 1]] : D; };
  const hd = (title, sub, at, end) => CM.head(H, tl, title, sub, at, end);
  const big = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'big', html, top, extra); tl.from(t, { scale: 1.3, opacity: 0, duration: .4, ease: 'expo.out' }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const mid = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'mid', html, top, extra); tl.from(t, { y: 20, opacity: 0, duration: .35 }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const stamp = (id, txt, at, top = 420, col = '#E5484D') => { const t = CM.text($(id), 'big', `<span style="border:12px solid ${col};border-radius:20px;padding:0 40px;color:${col}">${txt}</span>`, top, 'font-size:150px;transform:rotate(-8deg)'); tl.from(t, { scale: 2, opacity: 0, duration: .3, ease: 'back.out(2)' }, at); return t; };
  const push = (id, from = 1.15, to = 1, ox = '50%', oy = '50%') => { const s = $(id).querySelector('svg'); tl.fromTo(s, { scale: from }, { scale: to, duration: nxt(id) - S[id], ease: 'none', transformOrigin: `${ox} ${oy}` }, S[id]); };
  const ender = (id, q, at, sub = 'CUÉNTAMELO EN LOS COMENTARIOS') => { const end = document.createElement('div'); end.style.cssText = 'position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(1200px 800px at 50% 45%, #1d2a5a, #050a1a 75%)';
    end.innerHTML = `<div style="font:400 120px/1 'Bebas Neue';text-align:center">${q}</div><div style="font:800 40px Inter;letter-spacing:.06em">${sub}</div><div style="margin-top:30px;padding:22px 60px;border-radius:16px;background:#d0312d;font:800 44px Inter;letter-spacing:.08em">SUSCRÍBETE</div><div style="margin-top:20px;font:400 90px Bebas Neue;letter-spacing:.14em">CURIOSI<span style="color:#FFD23F">MUNDO</span></div>`;
    $(id).append(end); const c = end.children;
    tl.from(end, { opacity: 0, duration: .5 }, at).from(c[0], { scale: 1.2, opacity: 0, duration: .5, ease: 'expo.out' }, at + .1).from(c[1], { y: 20, opacity: 0, duration: .3 }, W('cuéntamelo') - .2)
      .from(c[2], { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('suscríbete') - .2).to(c[2], { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W('suscríbete') + .3)
      .from(c[3], { y: 30, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('curiosimundo') - .2); };
    const shake = (el, at, amp = 14) => tl.to(el, { x: amp, duration: .06 }, at).to(el, { x: -amp, duration: .08 }, at + .06).to(el, { x: amp * .5, duration: .08 }, at + .14).to(el, { x: 0, duration: .08 }, at + .22);

  const sunEarth = (s, sx = 330, ex = 1600, y = 560) => { SP.stars(s, 200); const sun = SP.sun(s, sx, y, 170); const e = SP.earth(s, ex, y, 70); return { sun, e }; };

  CM.card($('cards'), tl, 5, '5.000 M', 'EL FUTURO DEL SOL', 0, 4);

  const za = svgOf('age', SP.NIGHT); SP.stars(za, 240); const s1 = SP.sun(za, 960, 470, 220); gm.onFrame($('age'), (l, i) => s1.spin(i.time));
  hd('UNA <em>ESTRELLA</em>', 'de unos 4.600 millones de años', S.age + .3, W('bombilla') - .5); stamp('age', 'NO ES UNA BOMBILLA', W('bombilla') - .4, 720, '#FFD23F');
  const zf = svgOf('fuel', SP.NIGHT); SP.stars(zf, 200); mk('rect', { x: 200, y: 520, width: 1520, height: 40, rx: 20, fill: '#1d2a4a' }, zf); const bar = mk('rect', { x: 200, y: 520, width: 1520, height: 40, rx: 20, fill: '#FFD23F' }, zf);
  tl.from(bar, { attr: { width: 0 }, duration: 2, ease: 'power2.out' }, S.fuel + .3); const n = SP.label(zf, 'HOY', 200, 470, 70, '#fff', 'start'); const f = SP.label(zf, '+5.000 MILLONES DE AÑOS', 1720, 640, 80, '#FFD23F', 'end');
  tl.from(f, { opacity: 0, duration: .4 }, W('cinco') - .2); hd('LE QUEDA <em>COMBUSTIBLE</em>', 'para unos 5.000 millones de años', S.fuel + .3, S.red);
  const zr = svgOf('red', SP.NIGHT); SP.stars(zr, 200); [200, 300, 420].forEach((r, k) => mk('circle', { cx: 960, cy: 560, r, fill: 'none', stroke: k === 2 ? '#5bc0ff' : '#9fb3c8', 'stroke-width': 3, 'stroke-dasharray': '8 10', opacity: .7 }, zr));
  const rg = mk('g', {}, zr); mk('circle', { cx: 960, cy: 560, r: 600, fill: 'url(#spRedGlow)' }, rg); const rc = mk('circle', { cx: 960, cy: 560, r: 90, fill: 'url(#spSun)' }, rg), rr = mk('circle', { cx: 960, cy: 560, r: 90, fill: 'url(#spRed)', opacity: 0 }, rg); SP.label(zr, 'ÓRBITA DE LA TIERRA', 1400, 200, 50, '#5bc0ff');
  tl.to([rc, rr], { attr: { r: 420 }, duration: 4, ease: 'power1.inOut' }, W('hinchará') - .3).to(rr, { opacity: 1, duration: 2 }, W('hinchará')); hd('UNA <em>GIGANTE ROJA</em>', 'quizá hasta la órbita de la Tierra', W('gigante') - .3, S.wd);
  const zw = svgOf('wd', SP.NIGHT); SP.stars(zw, 240); const neb = mk('circle', { cx: 960, cy: 560, r: 120, fill: 'none', stroke: '#b06aff', 'stroke-width': 40, opacity: .5 }, zw); const wd = mk('circle', { cx: 960, cy: 560, r: 26, fill: '#eaf4ff' }, zw);
  tl.to(neb, { attr: { r: 460, 'stroke-width': 6 }, opacity: .15, duration: S.rec - S.wd, ease: 'power1.out' }, S.wd); hd('UNA <em>ENANA BLANCA</em>', 'pequeña, densa, enfriándose poco a poco', W('enana') - .3, S.rec);
  const zc = svgOf('rec', SP.NIGHT); const a = sunEarth(zc); gm.onFrame($('rec'), (l, i) => { a.sun.spin(i.time); a.e.rot(i.time); }); const ck = SP.clock(zc, 960, 330, 160);
  big('rec', '<em>8 MINUTOS</em> Y 20 SEGUNDOS', 760, W('exactamente') - .3, 'font-size:110px'); hd('NO SE APAGARÁ', 'de un día para otro', S.rec + .3, W('ahora') - .3);
  ender('end', '¿QUÉ HARÍAS TÚ EN ESOS <span style="color:#FFD23F">8 MINUTOS</span>?', S.end + .1);

  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
