<!doctype html>
<!-- Venus: el infierno de al lado · Capítulo 0 · Arranque en frío: 465 °C, casi del tamaño de la Tierra, plomo derretido, lluvia ácida, un día más largo que un año, dos horas, el gemelo malvado, ¿océanos? -->
<html data-width="1920" data-height="1080" data-fps="30" data-duration="25.24">
<head><link rel="stylesheet" href="lib/cm.css"><script src="lib/cm.js"></script><script src="lib/space.js"></script></head>
<body>
<audio src="voz.mp3" data-start="0"></audio>
<audio src="musica.mp3" data-volume="0.5" data-duck="0.4" data-fade-out="1"></audio>
<audio src="sfx.mp3" data-volume="0.55"></audio>
<section class="scene" id="s0" data-start="0" data-duration="4.0"></section>
<section class="scene" id="s1" data-start="3.9" data-duration="4.68"></section>
<section class="scene" id="s2" data-start="8.48" data-duration="3.44"></section>
<section class="scene" id="s3" data-start="11.82" data-duration="9.46"></section>
<section class="scene" id="t" data-start="21.18" data-duration="4.06"></section>
<div class="vig"></div><div id="heads"></div><div id="cards"></div><div id="caps"></div>
<script>
const OFF = 0, D = 25.24, S = {s0: 0, s1: 3.9, s2: 8.48, s3: 11.82, t: 21.18};
gm.wait(fetch('voz.json').then(r => r.json()).then(words => {
  const W = CM.W(words, OFF), G = { global: true }, tl = gm.timeline(null, G), H = document.getElementById('heads'), $ = id => document.getElementById(id), mk = CM.mk;
  const svgOf = (id, bg) => CM.svgIn($(id), bg);
  Object.keys(S).slice(1).forEach(id => tl.from($(id), { opacity: 0, duration: .35 }, S[id]));
  const nxt = id => { const k = Object.keys(S), i = k.indexOf(id); return i + 1 < k.length ? S[k[i + 1]] : D; };
  const hd = (title, sub, at, end) => CM.head(H, tl, title, sub, at, end);
  const big = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'big', html, top, extra); tl.from(t, { scale: 1.3, opacity: 0, duration: .4, ease: 'expo.out' }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const mid = (id, html, top, at, extra = '', end) => { const t = CM.text($(id), 'mid', html, top, extra); tl.from(t, { y: 20, opacity: 0, duration: .35 }, at); if (end) tl.to(t, { opacity: 0, duration: .25 }, end); return t; };
  const stamp = (id, txt, at, top = 420, col = '#E5484D') => { const t = CM.text($(id), 'big', `<span style="border:12px solid ${col};border-radius:20px;padding:0 40px;color:${col}">${txt}</span>`, top, 'font-size:150px;transform:rotate(-8deg)'); tl.from(t, { scale: 2, opacity: 0, duration: .3, ease: 'back.out(2)' }, at); return t; };
  const push = (id, from = 1.15, to = 1, ox = '50%', oy = '50%') => { const s = $(id).querySelector('svg'); tl.fromTo(s, { scale: from }, { scale: to, duration: nxt(id) - S[id], ease: 'none', transformOrigin: `${ox} ${oy}` }, S[id]); };
  const ender = (id, q, at, sub = 'CUÉNTAMELO EN LOS COMENTARIOS') => { const end = document.createElement('div'); end.style.cssText = 'position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(1200px 800px at 50% 45%, #1d2a5a, #050a1a 75%)';
    end.innerHTML = `<div style="font:400 120px/1 'Bebas Neue';text-align:center">${q}</div><div style="font:800 40px Inter;letter-spacing:.06em">${sub}</div><div style="margin-top:30px;padding:22px 60px;border-radius:16px;background:#d0312d;font:800 44px Inter;letter-spacing:.08em">SUSCRÍBETE</div><div style="margin-top:20px;font:400 90px Bebas Neue;letter-spacing:.14em">CURIOSI<span style="color:#FFD23F">MUNDO</span></div>`;
    $(id).append(end); const c = end.children;
    tl.from(end, { opacity: 0, duration: .5 }, at).from(c[0], { scale: 1.2, opacity: 0, duration: .5, ease: 'expo.out' }, at + .1).from(c[1], { y: 20, opacity: 0, duration: .3 }, W('cuéntamelo') - .2)
      .from(c[2], { scale: 0, duration: .4, ease: 'back.out(2.5)' }, W('suscríbete') - .2).to(c[2], { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W('suscríbete') + .3)
      .from(c[3], { y: 30, opacity: 0, letterSpacing: '.4em', duration: .7, ease: 'expo.out' }, W('curiosimundo') - .2); };
    const shake = (el, at, amp = 14) => tl.to(el, { x: amp, duration: .06 }, at).to(el, { x: -amp, duration: .08 }, at + .06).to(el, { x: amp * .5, duration: .08 }, at + .14).to(el, { x: 0, duration: .08 }, at + .22);

  const VSKY = 'radial-gradient(1600px 1000px at 50% 40%, #1a1430, #05030d 75%)';
  const vp = (id, x, y, r) => { const s = $(id).querySelector('svg'); const v = SP.venus(s, x, y, r); gm.onFrame($(id), (l, i) => v.flow(i.time)); return v; };
  const dusk = s => { const lg = mk('linearGradient', { id: 'dk' + Math.random().toString(36).slice(2), x1: 0, y1: 0, x2: 0, y2: 1 }, s); [['0', '#0b1030'], ['.55', '#3a2a5a'], ['.8', '#e07a4a'], ['1', '#f2b46a']].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, lg));
    mk('rect', { width: 1920, height: 1080, fill: `url(#${lg.id})` }, s); SP.stars(s, 80, 1920, 500, 'dk'); mk('path', { d: 'M0 860 Q480 820 960 850 T1920 840 L1920 1080 L0 1080Z', fill: '#140c18' }, s);
    const v0 = mk('g', { transform: 'translate(1380 520)' }, s), v = mk('g', {}, v0); mk('circle', { r: 46, fill: '#fff6d8', opacity: .25 }, v); mk('circle', { r: 14, fill: '#fffbe8' }, v); return v; };
  const rain = (s, x0, x1, y0, y1, n = 60, seed = 'r') => { const D = Array.from({ length: n }, (_, i) => ({ el: mk('line', { stroke: '#d8e24a', 'stroke-width': 4, 'stroke-linecap': 'round' }, s), x: x0 + gm.random(seed + i) * (x1 - x0), p: gm.random(seed + 'p' + i) }));
    return t => D.forEach(d => { const k = (t * .7 + d.p) % 1, y = y0 + k * (y1 - y0); d.el.setAttribute('x1', d.x); d.el.setAttribute('x2', d.x - 6); d.el.setAttribute('y1', y); d.el.setAttribute('y2', y + 30); d.el.setAttribute('opacity', 1 - k); }); };

  

  const z0 = svgOf('s0', VSKY); SP.stars(z0, 200); const e0 = SP.earth(z0, 560, 600, 210); gm.onFrame($('s0'), (l, i) => e0.rot(i.time)); vp('s0', 1360, 600, 200);
  SP.label(z0, 'TIERRA', 560, 880, 64); SP.label(z0, 'VENUS', 1360, 880, 64, '#FFD23F');
  const n0 = CM.text($('s0'), 'big', '<em>465 °C</em>', 90, 'font-size:240px;text-shadow:0 10px 60px #000'); tl.fromTo(n0, { scale: 1.2 }, { scale: 1, duration: .5, ease: 'expo.out' }, 0).to(n0, { opacity: 0, duration: .3 }, W('tamaño') - .4);
  big('s0', 'CASI DEL <em>MISMO TAMAÑO</em>', 120, W('tamaño') - .3, 'font-size:110px');
  const z1 = svgOf('s1'); SP.venusGround(z1); const rf = rain(z1, 0, 1920, -40, 600, 70); gm.onFrame($('s1'), (l, i) => rf(i.time));
  const lead = mk('g', { transform: 'translate(560 700)' }, z1); const bar = mk('rect', { x: -140, y: -90, width: 280, height: 90, rx: 8, fill: '#8f96a3' }, lead); const pool = mk('ellipse', { cx: 0, cy: 6, rx: 40, ry: 10, fill: '#a8b0bc' }, lead);
  tl.to(bar, { attr: { height: 20, y: -20 }, duration: 1.6 }, W('plomo') - .3).to(pool, { attr: { rx: 220, ry: 26 }, duration: 1.6 }, W('plomo') - .3);
  const lp = SP.label(z1, 'PLOMO', 560, 560, 70); tl.from(lp, { opacity: 0, duration: .2 }, W('plomo') - .3);
  big('s1', 'LLUEVE <em>ÁCIDO</em>', 150, W('ácido') - .3, 'font-size:120px', W('día') - .4); big('s1', '1 DÍA <em>&gt;</em> 1 AÑO', 150, W('día') - .2, 'font-size:150px');
  const z2 = svgOf('s2'); SP.venusGround(z2); const vl = SP.venera(z2, 960, 820, 1.3); const ck = SP.clock(z2, 1500, 300, 140, '#E5484D'); ck.t.textContent = '2 H';
  tl.from(vl.g, { y: -900, duration: 1, ease: 'power2.out' }, S.s2).from(ck.g, { opacity: 0, duration: .3 }, W('dos') - .3); shake(z2, S.s2 + 1, 12);
  const z3 = svgOf('s3', VSKY); SP.stars(z3, 200); const v3 = vp('s3', 960, 560, 330); push('s3', 1.25, 1);
  big('s3', 'EL GEMELO <em>MALVADO</em>', 110, W('gemelo') - .3, 'font-size:130px', W('final') - .3); const oc = mk('circle', { cx: 960, cy: 560, r: 330, fill: '#2f7fd0', opacity: 0 }, z3);
  tl.to(oc, { opacity: .6, duration: .8 }, W('océanos') - .5); big('s3', '¿<em>OCÉANOS</em>?', 110, W('océanos') - .3, 'font-size:140px');
  const t = $('t'); const zt = CM.svgIn(t, 'radial-gradient(1200px 800px at 50% 45%, #3a1a08, #050308 75%)'); SP.stars(zt, 200); const vt = SP.venus(zt, 960, 900, 520); gm.onFrame(t, (l, i) => vt.flow(i.time));
  const h = CM.text(t, 'big', '<em>VENUS</em>', 250, 'font-size:240px'); const a = CM.text(t, 'mid', 'el infierno de al lado', 500, 'font-size:56px;color:#FFD23F');
  tl.from(h, { scale: 1.3, opacity: 0, filter: 'blur(16px)', duration: .8, ease: 'expo.out' }, S.t + .1).to(h, { scale: 1.05, duration: D - S.t - 1, ease: 'sine.inOut' }, S.t + .9).from(a, { y: 30, opacity: 0, duration: .4 }, W('infierno') - .3);

  return CM.captions(words, OFF);
}));
</script>
</body>
</html>
